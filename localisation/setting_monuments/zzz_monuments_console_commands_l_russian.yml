l_russian:
 # English Language Only:
 d_monuments_console_commands_DESC: "Перечисляет все консольные команды мода §Y EU4 Style Monuments §!.  \n Если игра не запущена в режиме отладки, на консоли не будут отображаться логи.  \n В этом случае проверьте файл §Y game.log §! в папке журналов.  \n Использование: §Y Monuments_console_commands §!"
 d_monuments_debug_DESC: "Включает или отключает режим отладки для мода §Y EU4 Style Monuments §!.  \n Показывает идентификаторы памятников при наведении на них курсора.  \n Использование: §Y Monuments_debug §!"
 d_set_monument_level_DESC: "Устанавливает указанный памятник в выбранном состоянии на указанный уровень.  \n Использование: §Y set_monument_level <идентификатор памятника> <уровень> §! \n На карте должен быть выбран штат."
 d_set_all_monument_levels_DESC: "Устанавливает все памятники на карте на указанный уровень.  \n Работает только если игра уже запущена в режиме отладки.  \n Использование: §Y set_all_monument_levels <уровень> §!"
 d_add_monument_DESC: "Добавляет указанный памятник в выбранное состояние на указанном уровне.  \n Работает только если игра уже запущена в режиме отладки.  \n Памятник может существовать только в одном государстве.  \n Использование: §Y add_monument <идентификатор памятника> <уровень> §! \n На карте должен быть выбран штат."
 d_remove_monument_DESC: "Удаляет указанный памятник из выбранного состояния.  \n Работает только если игра уже запущена в режиме отладки.  \n Использование: §Y remove_monument <идентификатор памятника> §! \n На карте должен быть выбран штат."
 d_move_monuments_list_button_DESC: "Перемещает кнопку, чтобы открыть окно §Y Глобального списка памятников §!.  \n Начальные координаты: __3§Y4__ , __5§Y6__ .  \n Использование: §Y move_monuments_list_button <X> <Y> §!"
 d_update_global_monuments_list_DESC: "Обновляет окно §Y Глобальный список памятников §!, если оно открыто.  \n Использование: §Y update_global_monuments_list §!"
 d_set_up_monuments_DESC: "Устанавливает памятники так же, как в начале игры. Уже существующие памятники \n не будут изменены.  \n Может быть полезно, если были добавлены новые памятники, которых еще нет в вашей сохраненной игре.  \n Использование: §Y set_up_monuments §!"
 d_get_monument_name_DESC: "Возвращает название памятника по указанному идентификатору.  \n Использование: §Y get_monument_name <ID> §!"
 D_GET_MONUMENT_NAME_TT: "Памятник с идентификатором §Y [?args^0?1] §! называется: §C [This.GetMonumentNameOtherContext] §! ."
 d_get_all_monument_names_DESC: "Печатает название и состояние всех существующих на данный момент памятников.  \n Работает только если игра уже запущена в режиме отладки.  \n Использование: §Y get_all_monument_names §!"
