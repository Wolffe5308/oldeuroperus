l_russian:
 # Monuments:
 MONUMENT_1_NAME: "Бранденбургские ворота"
 MONUMENT_1_DESC: "§Y $MONUMENT_1_NAME$ §! это неоклассический памятник 18-го века, расположенный в $VICTORY_POINTS_6521$ году, построенный по распоряжению прусского короля Фридриха Вильгельма II после насильственного усмирения Республики Соединённые Нидерланды вторжением прусских войск. Они были задуманы как символ мира и сначала назывались §Y Воротами мира §! . На вершине ворота установлена ​​скульптура всадницы – колесницы, запряжённой четверкой лошадей, управляемая Викторией, римской богиней победы."

 MONUMENT_2_NAME: "Триумфальная арка"
 MONUMENT_2_DESC: "§Y $MONUMENT_2_NAME$ §! была разработана в 1806 году после победы императора Напалеона в битве при Аустрелице. После завершения §Y $MONUMENT_2_NAME$ §! года началось начало французских войск, провозглашающих парадом после успеха глобальной революции, а также для ежегодного военного парада в День взятия Бастилии. Среди знаменитых маршей, прошедших под или рядом с §Y $MONUMENT_2_NAME$ §! — марш немецких войск в 1871 году и французских в 1919 году."

 MONUMENT_3_NAME: "Эйфелева башня"
 MONUMENT_3_DESC: "§Y $MONUMENT_3_NAME$ §! – решетчатая башня из кованого железа высотой 324 метра. Названа в честь Гюстава Эйфеля, чья компания спроектировала и построила башню. Строилась с 1887-го по 1889 год и первоначально задумывалась как временное сооружение, служившее входной аркой парижской Всемирной выставки 1889 года."

 MONUMENT_4_NAME: "Колонна Победы"
 MONUMENT_4_DESC: "§Y $MONUMENT_4_NAME$ §! была поставлена ​​в 1864 году в ознаменование победы Пруссии во Второй Шлезвигской Войне. Ко времени официального открытия 2 сентября 1873 года Пруссия победила Австрию и ее союзников в Австро-Прусской войне (1866 г.) и Францию ​​во Франко-Прусской (1870–71 гг.), При предложении колонны особых сторон. В отличие от первоначальных планов, именно поздние победы в борьбе за объединение вдохновили на установку высоких колонн бронзовой скульптуры Виктории, римские богини победы."

 MONUMENT_5_NAME: "Вестминстерский дворец"
 MONUMENT_5_DESC: "§Y $MONUMENT_5_NAME$ §! служители в качестве места сбора §Y Палат общин §! и §Y Палаты лордов §!, двухпалатного парламента Великобритании.  §Y $MONUMENT_5_NAME$ §! в целом претерпел значительные изменения, начиная с 18 века, так как Парламент провел заседание в ограниченном пространстве всех зданий. Призывы к строительству нового дворца остались без внимания — вместо этого к нему пристроили новые здания, отличавшиеся по качеству и стилю."

 MONUMENT_6_NAME: "Букингемский дворец"
 MONUMENT_6_DESC: "§Y $MONUMENT_6_NAME$ §! является административной резиденцией британских монархов. Конструкция была известна как §Y Букингем-хаус §!, дворец изначально был домом, построенным для герцога Бекингемского и Норменби в 1703 году на участке, который находился в частной собственности не менее 150 лет. Он был приобретен королем Георгом III в 1762 году в качестве будущей частной резиденции монарха. В течение 75 лет дворец расширяли и перестраивали.  §Y $MONUMENT_6_NAME$ §! был официально объявлен $VICTORY_POINTS_6103$ резиденцией британских монархов при вступлении на престол королевы Виктории в 1837 году."

 MONUMENT_7_NAME: "Статуя Свободы"
 MONUMENT_7_DESC: "§Y $MONUMENT_7_NAME$ §! — монументальная скульптура в стиле неоклассицизма. Медная статуя является подарком французского народа Соединённых Штатов Америки; она была открыта 28 октября 1886 года. Статуя олицетворяет Либертас, римскую богиню свободы. В правой руке над головой она держит факел, а в левой руке лежит табличка с начертанной датой июль IV MDCCLXXVI (4 июля 1776 года римскими цифрами), датой принятия Декларации независимости США. У ног рабини — сломанные оковы, символизирующие недавнюю отмену в стране. После открытия конференции статуя стала символом свободы."

 MONUMENT_8_NAME: "Гора Рашмор"
 MONUMENT_8_DESC: "§Y $MONUMENT_8_NAME$ §! высечена в гранитной скале горы Рашмор в массиве §Y Блэк-Хилс §! . Скульптура изображает 18-метровые портреты четырех президентов США: Джорджа Вашингтона (1732–1799), Томаса Джефферсона (1743–1826), Теодора Рузвельта (1858–1919) и Авраама Линкольна (1809–1865)."

 MONUMENT_9_NAME: "Белый дом"
 MONUMENT_9_DESC: "§Y $MONUMENT_9_NAME$ §! – официальная резиденция и место работы президента США. В 1901 году президент Теодору Рузвельту приступил к работе в главном мире, и все рабочие кабинеты были недавно перенесены в построенное Западное крыло. В 1909 году президент Уильям Говард Тафт расширил это крыло и создал первый Овальный кабинет — впоследствии его несколько раз перенесли на еще большее расширение. Жилые помещения на третьем этаже появились в 1927 году, когда существовавшую шатр крышу переделали, выходя на длинную мансардную окно."

 MONUMENT_10_NAME: "Капитолий"
 MONUMENT_10_DESC: "§Y $MONUMENT_10_NAME$ §! , часто называемое §Y Капитолий §! или §Y Здание Капитолия §! , является местом заседаний Конгресса США и резиденцией законодательной власти федерального правительства США. Первоначальное здание было завершено в 1800 году. Оно было частично разрушено во время пожара $VICTORY_POINTS_3957$ 1814 года, затем было полностью восстановлено в течение пяти лет. Позже здание было расширено за счет добавления массивного купола и расширенных крыльев с расширенными палатами для двухпалатного законодательного органа, Палаты представителей в южном крыле и Сената в северном крыле. Как и основные здания исполнительной и судебной власти, §Y $MONUMENT_10_NAME$ §! построено в неоклассическом стиле и имеет белый фасад."

 MONUMENT_11_NAME: "Зимний дворец"
 MONUMENT_11_DESC: "§Y $MONUMENT_11_NAME$ §! с 1762 года по 1904 год использовался в качестве официальной зимней резиденции российских императоров. Монументальный облик президента, возведенного по воле монархов, был властью власти и силы царской России. Дворец, окрашенный в зеленый и белый цвета, имеет форму вытянутого контура. Длина его главного фасада составляет 215 метров, высота — 30 метров."

 MONUMENT_12_NAME: "Красная площадь"
 MONUMENT_12_DESC: "§Y $MONUMENT_12_NAME$ §! одна из старых и разных площадей в $VICTORY_POINTS_6380$ . Она расположена в историческом центре $VICTORY_POINTS_6380$, к востоку от Кремля. Это главная достопримечательность $VICTORY_POINTS_6380$ , с такими знаками сооружений, как собор Василия Блаженного и Мавзолея Ленина.  §Y $MONUMENT_12_NAME$ §! изначально возник как главный городской рынок, а также служил местом для различных выступлений. С самого своего основания она используется для проведения мероприятий всеми правительствами России."

 MONUMENT_13_NAME: "Памятник затопленным кораблям"
 MONUMENT_13_DESC: "§Y $MONUMENT_13_NAME$ §! Памятник сооружён в 1905 году к 50-летию первой обороны $VICTORY_POINTS_3686$ во время Крымской войны, во время которой у входа в Севастопольскую бухту были затоплены русские парусные корабли, почти все из которых были написаны Черноморскому флоту."

 MONUMENT_14_NAME: "Колизей"
 MONUMENT_14_DESC: "§Y $MONUMENT_14_NAME$ §! — овальный амфитеатр в центре города $VICTORY_POINTS_9904$. Это самый большой древний амфитеатр, когда-либо построенный. Несмотря на то, что §Y $MONUMENT_14_NAME$ §! был существенно разрушен из-за землетрясений и грабителей камней, он по-прежнему остается культовым символом Имперского Рима. Основание арены было частично раскопано в 1810–1814 и 1874 годах и полностью обнажено при Бенито Муссолини в 1930-х годах."

 MONUMENT_15_NAME: "Рейхстаг"
 MONUMENT_15_DESC: "§Y $MONUMENT_15_NAME$ §! — историческое здание в $VICTORY_POINTS_6521$, построенное для размещения императорского сейма Германской империи. Он был открыт в 1894 году и в нем размещался Сейм до 1933 года, когда он был серьезно поврежден после поджога. В 1916 году знаковые слова «Dem Deutschen Volke» («Немецкому народу») были размещены над главным фасадом здания, к большому неудовольствию Вильгельма II, который пытался заблокировать добавление надписи из-за ее демократического значения. После окончания Великой войны и отречения Вильгельма от престола в революционные дни 1918 года Филипп Шейдеман провозгласил учреждение республики с одного из балконов §Y $MONUMENT_15_NAME$ §! 9 ноября."

 MONUMENT_16_NAME: "Алтарь Отечества"
 MONUMENT_16_DESC: "§Y $MONUMENT_16_NAME$ §!, первоначально названный Памятником Виктором Эммануилу II, это памятник в честь первого короля объединённой Италии. С внешних точек зрения он был задуман как современный форум — агора на трех уровнях, соединенных двумя лестницами и увенчанными портиком с колоннадой. Памятник посвящён королю Виктору Эммануилу II Савойскому, под руководством которого произошло сложное объединение страны. Это событие имеет огромное символическое значение, поэтому в поврежденном и художественном отношении памятник, созданный на идее единства Италии. Сегодня §Y $MONUMENT_16_NAME$ §! считается одним из национальных символов страны. Строительство было начато в 1885 году и завершено в 1927 году."

 MONUMENT_17_NAME: "Королевский дворец Венария"
 MONUMENT_17_DESC: "§Y $MONUMENT_17_NAME$ §! — бывшая королевская резиденция с садами. Он был спроектирован и построен в 1675 году по заказу герцога Карла Эммануила II, которому требовалась база для его охотничьих экспедиций в вересковой холмистой местности к северу от $VICTORY_POINTS_6780$. Он был расширен и стал роскошной резиденцией Савойского дома. Дворцовый комплекс стал шедевром архитектуры барокко и был наполнен украшениями и произведениями искусства. В конце 18 века он вышел из употребления. В настоящее время он используется в военных целях."

 MONUMENT_18_NAME: "Дворец итальянской цивилизации"
 MONUMENT_18_DESC: "§Y $MONUMENT_18_NAME$ §! был спроектирован в 1938 году тремя итальянскими архитекторами. Здание является примером итальянского рационализма и фашистской архитектуры с неоклассическим дизайном, олицетворяющим романиту, философию, которая объединяет прошлое, настоящее и будущее в одном. Огромное сооружение призвано отразить новый курс фашистского режима в итальянской истории. На всех четырех сторонах здания находится надпись из речи Муссолини, произнесенной 2 октября 1935 года: «Un popolo di поэти, ди артисти, ди eroi, di santi, di pensatori, di scienziati, di navigatori, di trasmigratori» («нация поэтов, художников, героев, святых, мыслителей, ученых, мореплавателей, мигрантов»)."

 MONUMENT_19_NAME: "Самые Золотые Ворота"
 MONUMENT_19_DESC: "§Y $MONUMENT_19_NAME$ §! — это подвесной мост через Золотые Ворота, пролив шириной 1,6 километра, соединяющий залив $VICTORY_POINTS_9671$ и Тихий океан. Первоначально он был спроектирован в 1917 году и завершен в 1937 году. До того, как мост был построен, единственным практичным коротким маршрутом между $VICTORY_POINTS_9671$ и округом Марин была лодка через участок залива $VICTORY_POINTS_9671$. Паромное сообщение началось еще в 1820 году, а регулярное регулярное сообщение началось в 1840-х годах с целью транспортировки воды в $VICTORY_POINTS_9671$."

 MONUMENT_20_NAME: "Пирамиды Гизы"
 MONUMENT_20_DESC: "§Y $MONUMENT_20_NAME$ §! , также называемый §Y Некрополем Гизы §! , представляет собой участок на плато Гиза в Большом $VICTORY_POINTS_7011$ , который включает в себя §Y Великую пирамиду Гизы §! , §Y пирамиду Хефрена §! и §Y пирамиду Менкаура §! , а также связанную с ними пирамиду. комплексы и Большой Сфинкс Гизы. Все они были построены во времена Четвертой династии Старого царства Древнего Египта. На территории также есть несколько кладбищ и остатки рабочей деревни. Участок находится на окраине Западной пустыни, примерно в 9 км к западу от реки Нил в городе $VICTORY_POINTS_3996$ и примерно в 13 км к юго-западу от центра города $VICTORY_POINTS_7011$."

 MONUMENT_21_NAME: "Антверпенский порт"
 MONUMENT_21_DESC: "§Y $MONUMENT_21_NAME$ §! — один из крупнейших портов Европы.  Потенциал $VICTORY_POINTS_6598$ как морского порта был признан Наполеоном Бонапартом, и он приказал построить первый причал $VICTORY_POINTS_6598$ в 1811 году. К 1908 году было построено восемь доков. Во время Великой войны §Y $MONUMENT_21_NAME$ §! имело важное стратегическое значение для британцев."

 MONUMENT_22_NAME: "Аустерлицкая пирамида"
 MONUMENT_22_DESC: "§Y $MONUMENT_22_NAME$ §! — земляная пирамида высотой 36 метров, построенная в 1804 году солдатами Наполеона на одной из самых высоких точек хребта $VICTORY_POINTS_6241$. На вершине пирамиды установлен каменный обелиск 1894 года. В 1804 году французский генерал Огюст де Мармон разбил военный лагерь в этом центральном месте Батавской республики, где в течение нескольких месяцев он собрал различные батальоны в большую, хорошо обученную армию, способную победить британского врага в случае повторения вторжения 1799 года. Осенью 1804 года, удовлетворенный военной мощью новой армии, и Чтобы занять своих скучающих солдат, Мармон приказал своим солдатам построить памятник из земли и дерна, вдохновленный Великой пирамидой в Гизе, которую Мармон видел в 1798 году во время египетской кампании Наполеона. Имитировалась даже подверженная эрозии ступенчатая поверхность. Строительство длилось 27 дней. В 1806 году, несмотря на протесты Мармона, Луи Бонапарт, новый король Голландии, переименовал холм в §Y $MONUMENT_22_NAME$ §! ."

 MONUMENT_23_NAME: "Памятник борьбы народов"
 MONUMENT_23_DESC: "§Y $MONUMENT_23_NAME$ §! — памятник высотой 91 метр в $VICTORY_POINTS_3535$, посвященный битве при Лейпциге 1813 года, также известной как «Битва народов». Оплаченный в основном за счет пожертвований и города $VICTORY_POINTS_3535$, он был завершен в 1913 году к 100-летию битвы и обошёлся в шесть миллионов золотых марок. Памятник увековечивает поражение французской армии Наполеона в $VICTORY_POINTS_3535$ году, решающий шаг на пути к окончанию боевых действий в войне Шестой коалиции. Коалиционные армии России, Пруссии, Австрии и Швеции возглавляли российский царь Александр I и Карл Филипп, принц Шварценбергский. Немцы сражались с обеих сторон, поскольку в войска Наполеона входили также призывники из немцев с левого берега Рейна, аннексированного Францией, а также войска его немецких союзников из Рейнской Конфедерации."

 MONUMENT_24_NAME: "Тысячелетие России"
 MONUMENT_24_DESC: "§Y $MONUMENT_24_NAME$ §! — бронзовый памятник в $VICTORY_POINTS_117$ . Он был установлен в 1862 году в честь тысячелетия со дня прибытия Рюрика в $VICTORY_POINTS_117$ г. — события, традиционно принимаемого за отправную точку истории российской государственности. Самый дорогой на тот момент российский памятник, он был установлен за 400 000 рублей, в основном собранных по общественной подписке. Чтобы создать подходящий постамент для огромной скульптуры, в $VICTORY_POINTS_117$ привезли шестнадцать блоков сортавальского гранита, каждый весом более 35 тонн. Сам бронзовый памятник весит 100 тонн."

 MONUMENT_25_NAME: "Блетчли-парк"
 MONUMENT_25_DESC: "§Y $MONUMENT_25_NAME$ §! — английский загородный дом и поместье в Милтон-Кейнсе. В мае 1938 года адмирал сэр Хью Синклер, глава Секретной разведывательной службы, купил особняк для использования правительством в случае войны. С 1939 года здесь располагалась §Y Правительственная школа кодов и шифров §! , которая регулярно проникала в секретные коммуникации держав оси – прежде всего, в немецкие шифры «Энигма» и Лоренца."

 MONUMENT_26_NAME: "Истана"
 MONUMENT_26_DESC: "§Y $MONUMENT_26_NAME$ §! , также называемый §Y Дом правительства Сингапура §! , был построен между 1867 и 1869 годами по указанию сэра Гарри Сент-Джорджа Орда, первого колониального губернатора $VICTORY_POINTS_12299$ после перевода Ост-Индской компании в Управление по делам колоний. В том же комплексе находится Шри Темасек, одна из нескольких резиденций старших колониальных офицеров в Доме правительства, ранее принадлежавших министру по делам колоний. Поместье площадью 0,43 квадратных километра когда-то было частью обширной плантации мускатного ореха на горе София."

 MONUMENT_27_NAME: "Водопад Виктория"
 MONUMENT_27_DESC: "§Y $MONUMENT_27_NAME$ §! — водопад на реке Замбези на юге Африки, который обеспечивает среду обитания для нескольких уникальных видов растений и животных. Он считается одним из крупнейших водопадов в мире благодаря своей ширине 1708 метров. Дэвид Ливингстон, шотландский миссионер и исследователь, как полагают, был первым европейцем, увидевшим водопад 16 ноября 1855 года с того места, которое сейчас известно как остров Ливингстон, одного из двух массивов суши в середине реки, непосредственно вверх по течению от водопада недалеко от берега Замбии. Ливингстон назвал свое наблюдение в честь королевы Виктории."

 MONUMENT_28_NAME: "Зал Народа"
 MONUMENT_28_DESC: "§Y $MONUMENT_28_NAME$ §! — монументальное куполообразное здание, спроектированное Адольфом Гитлером и его архитектором Альбертом Шпеером. Это центр правительства в городе §Y $VICTORY_POINTS_6521$ §!, внутри которого находится офис фюрера. С высокой трибуны в главном зале выступающие могут обратиться к более чем 150 000 собравшимся людям. Места для сидения состоят из трех ярусов, окружающих гигантскую круглую арену, а на открытом полу могут разместиться еще многие тысячи зрителей. Само здание физически состоит из огромного гранитного подиума и является знаковым благодаря своему монументальному куполу, который доминирует над горизонтом города и конкурирует с другими такими массивными сооружениями, как §Y $MONUMENT_29_NAME$ §! в $VICTORY_POINTS_3878$ . Перед §Y $MONUMENT_28_NAME$ §! сидит §Y $MONUMENT_15_NAME$ §! ."

 MONUMENT_29_NAME: "Эмпайр-стейт-билдинг"
 MONUMENT_29_DESC: "§Y $MONUMENT_29_NAME$ §! — 102-этажный небоскрёб в стиле ар-деко в центре Манхэттена в $VICTORY_POINTS_3878$ году. Оно строилось с 1930 по 1931 год. Высота крыши здания составляет 380 метров, а общая высота, включая антенну, составляет 443,2 метра. Вещание началось в §Y $MONUMENT_29_NAME$ §! 22 декабря 1931 года, когда NBC и RCA начали передавать экспериментальные телевизионные передачи с небольшой антенны, установленной на вершине мачты, с двумя отдельными передатчиками для визуальных и аудиоданных. Они арендовали 85-й этаж и построили там лабораторию."

 MONUMENT_30_NAME: "Плотина Гувера"
 MONUMENT_30_DESC: "§Y $MONUMENT_30_NAME$ §! — бетонная арочная гравитационная плотина в Чёрном каньоне реки Колорадо. Он был построен между 1931 и 1936 годами во время Великой депрессии и был открыт 30 сентября 1935 года президентом Франклином Д. Рузвельтом. Его строительство стало результатом огромных усилий, в которых приняли участие тысячи рабочих, и унесло более ста жизней. Генераторы плотины обеспечивают электроэнергией государственные и частные предприятия в [This.GetName] , [377.GetName] и [378.GetName] ."

 MONUMENT_31_NAME: "Гранд-Каньон"
 MONUMENT_31_DESC: "§Y $MONUMENT_31_NAME$ §! — это каньон с крутыми склонами, прорезанный рекой Колорадо в [This.GetName] году. Его длина составляет 446 километров, ширина — до 29 километров, а глубина — более 1857 метров. На протяжении тысячелетий этот район постоянно был заселен коренными американцами, которые построили поселения внутри каньона и его многочисленных пещер. Жители Пуэбло считали §Y $MONUMENT_31_NAME$ §! святым местом и совершали к нему паломничества.  §Y Национальный парк Гранд-Каньон §! был окончательно учрежден как 17-й национальный парк США на основании акта Конгресса, подписанного президентом Вудро Вильсоном 26 февраля 1919 года."

 MONUMENT_32_NAME: "Ниагарский водопад"
 MONUMENT_32_DESC: "§Y $MONUMENT_32_NAME$ §! — группа из трех водопадов в южной части Ниагарского ущелья. Текущий на север как часть реки Ниагара, которая впадает из озера Эри в озеро Онтарио, объединенный водопад имеет самую высокую скорость потока среди всех водопадов в Северной Америке с перепадом высот более 50 метров. В 1853 году была основана §Y компания «Гидравлическая энергетическая и горнодобывающая компания Ниагарского водопада» §!, которая в конечном итоге построила каналы, которые будут использоваться для выработки электроэнергии. В 1881 году была построена первая гидроэлектростанция на реке Ниагара."

 MONUMENT_33_NAME: "Акрополь"
 MONUMENT_33_DESC: "§Y $MONUMENT_33_NAME$ §! — это древняя цитадель, расположенная на скалистом обнажении над городом $VICTORY_POINTS_4109$ и содержащая остатки нескольких древних зданий, имеющих большое архитектурное и историческое значение, самым известным из которых является Парфенон. Парфенон и другие здания были серьезно повреждены во время осады венецианцами в 1687 году во время Морейской войны, когда порох, хранившийся в Парфеноне османами, был поражен пушечным ядром и взорвался."

 MONUMENT_34_NAME: "Улуру"
 MONUMENT_34_DESC: "§Y $MONUMENT_34_NAME$ §! — это крупное скальное образование из песчаника в северной части [This.GetName]. Он расположен в 335 километрах к юго-западу от ближайшего крупного города Алис-Спрингс.  §Y $MONUMENT_34_NAME$ §! является священным местом для местных аборигенов и популярным местом для туристов."

 MONUMENT_35_NAME: "Ангкор-Ват"
 MONUMENT_35_DESC: "§Y $MONUMENT_35_NAME$ §! — крупнейший по площади храмовый комплекс в мире. Храм был построен Сурьяварманом II в начале 12 века в столице Кхмерской империи как государственный храм Империи. Первоначально построенный как личный мавзолей кхмерского короля Сурьявармана II, посвященный Вишну в начале 12 века, к концу 12 века он был преобразован в буддийский храм.  §Y $MONUMENT_35_NAME$ §! сочетает в себе два основных плана кхмерской храмовой архитектуры: храм-гору и более поздний храм-галерею. Он предназначен для изображения горы Меру, дома дэвов в индуистской и буддийской космологии. Храм восхищает величием и гармонией архитектуры, обширными барельефами и статуями Будд и Дэвов, украшающими его стены."

 MONUMENT_36_NAME: "Собор Святой Софии"
 MONUMENT_36_DESC: "§Y $MONUMENT_36_NAME$ §! — позднеантичное культовое сооружение в $VICTORY_POINTS_9833$, спроектированное греческими геометрами Исидором Милетским и Антемием Траллесским. Построенный в 537 году как патриарший собор столицы империи Константинополя, он был крупнейшей христианской церковью Восточной Римской империи и Восточной православной церкви, за исключением периода Латинской империи с 1204 по 1261 год, когда он стал латинско-католическим собором города. В 1453 году, после захвата Константинополя Османской империей, она была превращена в мечеть."

 MONUMENT_37_NAME: "Чичен-Ица"
 MONUMENT_37_DESC: "§Y $MONUMENT_37_NAME$ §! был одним из крупнейших городов майя и, вероятно, одним из мифических великих городов, или Толланов, упоминаемых в более поздней мезоамериканской литературе.  §Y $MONUMENT_37_NAME$ §! был основным центром внимания в низменностях северных майя от позднего классического периода (600–900 гг.) до терминального классического периода (800–900 гг.) и до ранней части постклассического периода (900–1200 гг.). На этом месте представлено множество архитектурных стилей, напоминающих стили центральной Мексики, а также стили Пуук и Ченес в низинах северных майя."

 MONUMENT_38_NAME: "Котоку-ин"
 MONUMENT_38_DESC: "§Y $MONUMENT_38_NAME$ §! — буддийский храм в городе Камакура. Храм известен §Y Великим Буддой Камакуры §! , монументальной бронзовой статуей Амитабхи под открытым небом. Согласно храмовым записям, статуя датируется примерно 1252 годом, периодом Камакура, в честь которого она и названа. Ему предшествовал гигантский деревянный Будда, который был завершен в 1243 году после десяти лет непрерывного труда и был поврежден штормом в 1248 году."

 MONUMENT_39_NAME: "Дворец Потала"
 MONUMENT_39_DESC: "§Y $MONUMENT_39_NAME$ §! — крепость дзонг в городе $VICTORY_POINTS_5033$. Это зимний дворец Далай-лам. Он назван в честь горы Поталака, мифической обители бодхисаттвы Авалокитешвары. Пятый Далай-лама начал его строительство в 1645 году. Возможно, на этом месте он находится на остатках более ранней крепости, называемой Белым или Красным дворцом, построенной Сонгценом Гампо в 637 году."

 MONUMENT_40_NAME: "Медресе Санкоре"
 MONUMENT_40_DESC: "§Y $MONUMENT_40_NAME$ §! , также называемый §Y Университетом Санкоре §! , является одним из трех древних центров обучения, расположенных в Тимбукту. Три мечети Санкоре, Джингеребер и Сиди Яхья составляют Университет Тимбукту.  §Y $MONUMENT_40_NAME$ §! берет свое начало в мечети Санкоре, основанной в 989 году Аль-Кади Акибом ибн Махмудом ибн Умаром, верховным судьей Тимбукту.  §Y $MONUMENT_40_NAME$ §! процветал и стал очень важным центром образования в мусульманском мире, особенно во времена правления Мансы Мусы (1307–1332) и династии Аскиа (1493–1591)."

 MONUMENT_41_NAME: "Боробудур"
 MONUMENT_41_DESC: "§Y $MONUMENT_41_NAME$ §! — буддийский храм Махаяны VII века в центральной части [This.GetName] . Это крупнейший буддийский храм в мире. Храм состоит из девяти сложенных друг на друга платформ, шести квадратных и трех круглых, увенчанных центральным куполом. Он украшен 2672 рельефными панелями и 504 статуями Будды. Центральный купол окружен 72 статуями Будды. Всемирная известность о его существовании возникла в 1814 году благодаря сэру Томасу Стэмфорду Раффлзу, тогдашнему британскому правителю Явы, которому сообщили о его местонахождении коренные индонезийцы."

 MONUMENT_42_NAME: "Замок Химэдзи"
 MONUMENT_42_DESC: "§Y $MONUMENT_42_NAME$ §! — японский замковый комплекс на вершине холма, расположенный в городе Химедзи. Замок считается лучшим сохранившимся примером типичной японской замковой архитектуры, состоящей из сети из 83 комнат с развитыми защитными системами феодального периода.  §Y $MONUMENT_42_NAME$ §! датируется 1333 годом, когда Акамацу Норимура построил форт на вершине холма Химэяма. Форт был разобран и перестроен в замок Химэяма в 1346 году, а два столетия спустя реконструирован в §Y $MONUMENT_42_NAME$ §!."

 MONUMENT_43_NAME: "Пизанская башня"
 MONUMENT_43_DESC: "§Y $MONUMENT_43_NAME$ §! — это отдельно стоящая колокольня кафедрального собора итальянского города Пиза, известная во всем мире своим наклоном почти на четыре градуса, возникшим в результате нестабильного фундамента. Башня начала наклоняться во время строительства в 12 веке из-за мягкого грунта, который не мог должным образом выдержать вес конструкции, и ситуация ухудшилась после завершения строительства в 14 веке."

 MONUMENT_44_NAME: "Мачу-Пикчу"
 MONUMENT_44_DESC: "§Y $MONUMENT_44_NAME$ §! — цитадель инков XV века, расположенная в Восточных Кордильерах на юге Перу, на горном хребте высотой 2430 метров. Мимо него протекает река Урубамба, прорезая Кордильеры и создавая каньон с тропическим горным климатом. Большинство археологов полагают, что §Y $MONUMENT_44_NAME$ §! было построено как поместье императора инков Пачакути (1438–1472). Часто ошибочно называемый «Затерянным городом инков», это самый известный символ цивилизации инков. Инки построили поместье около 1450 года, но покинули его столетие спустя, во время испанского завоевания. Хотя он был известен на местном уровне, он не был известен испанцам в колониальный период и оставался неизвестным внешнему миру, пока американский историк Хирам Бингхэм не привлек к нему международное внимание в 1911 году."

 MONUMENT_45_NAME: "Статуя Христа-Искупителя"
 MONUMENT_45_DESC: "§Y $MONUMENT_45_NAME$ §! — статуя Иисуса Христа в стиле ар-деко, построенная в $VICTORY_POINTS_10980$ году. Построенная между 1922 и 1931 годами, статуя имеет высоту 30 метров, не считая 8-метрового постамента. Рукава простираются на 28 метров в ширину. Статуя весит 635 тонн и расположена на вершине 700-метровой горы Корковадо. Он изготовлен из железобетона и мыльного камня."

 MONUMENT_46_NAME: "Водопады Игуасу"
 MONUMENT_46_DESC: "§Y $MONUMENT_46_NAME$ §! — водопады реки Игуасу. Вместе они составляют самый большой водопад в мире. Лестничный характер водопада представляет собой двухступенчатый водопад, образованный тремя слоями базальта. Ступени высотой 35 и 40 метров."

 MONUMENT_47_NAME: "Дождевые леса Амазонии"
 MONUMENT_47_DESC: "§Y $MONUMENT_47_NAME$ §! — это влажный широколиственный тропический лес в биоме Амазонки, который покрывает большую часть бассейна Амазонки в Южной Америке. §Y $MONUMENT_47_NAME$ §! представляет собой более половины оставшихся на планете тропических лесов и включает в себя самый большой и самый биоразнообразный участок тропических лесов в мире, насчитывающий примерно 390 миллиардов отдельных деревьев, разделенных на 16 000 видов."

 MONUMENT_48_NAME: "Столовая гора"
 MONUMENT_48_DESC: "§Y $MONUMENT_48_NAME$ §! — гора с плоской вершиной, образующая выдающуюся достопримечательность с видом на город $VICTORY_POINTS_12589$ в Южной Африке. Главной особенностью §Y $MONUMENT_48_NAME$ §! является ровное плато длиной около трех километров, окаймленное впечатляющими скалами. Плато, окруженное Пиком Дьявола на востоке и Львиной Головой на западе, образует впечатляющий фон для $VICTORY_POINTS_12589$. Эта широкая полоса горных высот вместе с Сигнал-Хилл образует естественный амфитеатр гавани Сити-Боул и Столовой бухты."

 MONUMENT_49_NAME: "Тадж-Махал"
 MONUMENT_49_DESC: "§Y $MONUMENT_49_NAME$ §! — мраморный мавзолей цвета слоновой кости на южном берегу реки Ямуны. Он был заказан в 1632 году императором Великих Моголов Шах-Джаханом (правил с 1628 по 1658 год) для размещения могилы его любимой жены Мумтаз-Махал; здесь также находится могила самого Шаха Джахана. Гробница является центральным элементом комплекса площадью 17 гектаров, который включает в себя мечеть и гостевой дом и расположена в саду, ограниченном с трех сторон зубчатой ​​стеной."

 MONUMENT_50_NAME: "Панамский канал"
 MONUMENT_50_DESC: "§Y $MONUMENT_50_NAME$ §! — искусственный водный путь протяженностью 82 километра в Панаме, соединяющий Атлантический океан с Тихим океаном. Строительство началось в 1904 году и было завершено в 1914 году. Канал пересекает Панамский перешеек и является каналом морской торговли. Один из крупнейших и самых сложных инженерных проектов, когда-либо реализованных, короткий маршрут §Y $MONUMENT_50_NAME$ §! значительно сокращает время путешествия кораблей между Атлантическим и Тихим океанами, позволяя им избежать длительного и опасного маршрута к мысу Горн вокруг самой южной оконечности Южной Америки через пролив Дрейка или Магелланов пролив и еще менее популярного маршрута через Арктический архипелаг и Берингов пролив."

 MONUMENT_51_NAME: "Суэцкий канал"
 MONUMENT_51_DESC: "§Y $MONUMENT_51_NAME$ §! — искусственный водный путь на уровне моря в Египте, соединяющий Средиземное море с Красным морем через Суэцкий перешеек и разделяющий Африку и Азию. Канал является частью Шелкового пути, соединяющего Европу с Азией. В 1858 году Фердинанд де Лессепс основал §Y Компанию Суэцкого канала §! специально для строительства канала. Строительство канала длилось с 1859 по 1869 год и проходило под региональной властью Османской империи. Канал официально открылся 17 ноября 1869 года. Он предлагает судам прямой маршрут между Северной Атлантикой и северной частью Индийского океана через Средиземное и Красное моря, минуя Южную Атлантику и южную часть Индийского океана и сокращая расстояние пути от Аравийского моря до $VICTORY_POINTS_6103$ примерно на 8900 километров."

 MONUMENT_52_NAME: "Колокол Свободы"
 MONUMENT_52_DESC: "§Y $MONUMENT_52_NAME$ §! — знаковый символ независимости Америки, расположенный в $VICTORY_POINTS_6845$ , [This.GetName] . Колокол был заказан в 1752 году Провинциальным собранием $VICTORY_POINTS_6845$ у фирмы $VICTORY_POINTS_6103$ «Лестер и Пак» и на нем была отлита надпись «Провозглашайте СВОБОДУ по всей земле всем ее жителям», что является библейской ссылкой из Книги Левит (25:10). Колокол приобрел свою характерную большую трещину где-то в начале 19 века - широко распространенная история утверждает, что он треснул во время звонка после смерти главного судьи Джона Маршалла в 1835 году. Колокол стал известен после того, как в рассказе 1847 года утверждалось, что пожилой звонарь позвонил в него 4 июля 1776 года, узнав о голосовании Второго Континентального Конгресса за независимость. Хотя 4 июля колокол независимости не прозвенел, эта история была широко принята как факт, даже некоторыми историками. Начиная с 1885 года город $VICTORY_POINTS_6845$, владеющий колоколом, разрешил ему посещать различные выставки и патриотические собрания. Колокол собирал огромные толпы, куда бы он ни направлялся, происходило дополнительное растрескивание, а охотники за сувенирами откалывали куски. Последнее такое путешествие произошло в 1915 году, после чего город отказался от дальнейших запросов."

 MONUMENT_53_NAME: "Петра"
 MONUMENT_53_DESC: "§Y $MONUMENT_53_NAME$ §!, первоначально известный своим жителям как §Y Ракму §! или §Y Ракемо §!, является историческим и археологическим городом на юге [This.GetName]. Он примыкает к горе Джабаль аль-Мадба. Территория вокруг §Y $MONUMENT_53_NAME$ §! была заселена еще с 7000 г. до н.э. Набатейцы были арабами-кочевниками, которые инвестировали в §Y $MONUMENT_53_NAME$ §! близость §! к торговым путям благовоний, сделав его крупным региональным торговым центром."

 MONUMENT_54_NAME: "Гора Фудзи"
 MONUMENT_54_DESC: "§Y $MONUMENT_54_NAME$ §!, расположенная на острове Хонсю, является самой высокой горой Японии, ее высота составляет 3776,24 метра. Это второй по высоте вулкан, расположенный на острове в Азии, и седьмая по высоте вершина острова на Земле.  §Y $MONUMENT_54_NAME$ §! — действующий стратовулкан, последний раз извергавшийся с 1707 по 1708 год. Исключительно симметричный конус §Y $MONUMENT_54_NAME$ §!, который около пяти месяцев в году покрыт снегом, широко используется в качестве культурного символа Японии и часто изображается в искусстве и фотографии, а также посещается туристами и альпинистами."

 MONUMENT_55_NAME: "Замок Нойшванштайн"
 MONUMENT_55_DESC: "§Y $MONUMENT_55_NAME$ §! — исторический дворец XIX века на скалистом холме над деревней Хоэншвангау недалеко от Фюссена на юго-западе Баварии. Дворец был построен по заказу короля Баварии Людвига II в честь Рихарда Вагнера. Людвиг решил оплатить дворец из своего личного состояния и посредством обширных займов, а не из государственных средств Баварии. Строительство началось в 1869 году, но так и не было полностью завершено."

 MONUMENT_56_NAME: "Вевельсбург"
 MONUMENT_56_DESC: "§Y $MONUMENT_56_NAME$ §! — замок эпохи Возрождения, расположенный в деревне $MONUMENT_56_NAME$, что недалеко от города Падерборн в прусской провинции [This.GetName]. Замок имеет треугольную планировку с тремя круглыми башнями, соединенными массивными стенами. После 1934 года он использовался СС под руководством Генриха Гиммлера и должен был быть расширен до комплекса, который будет служить центральным культовым объектом СС. В 1935 году Гиммлер объявил, что замок СС будет официально называться «SS-Schule Haus $MONUMENT_56_NAME$» («Школа СС, дом $MONUMENT_56_NAME$»). В центре внимания школы должно было стать: «Немецкая Vor- und Frühgeschichte, Volkstumskunde u.a. als Rüstzeug zur weltanschaulich-politischen Schulung» (т.е. «Германская пред- и ранняя история, фольклорные исследования и т. д. как средство идеологически-политической подготовки»)."

 MONUMENT_57_NAME: "Харбор-Бридж"
 MONUMENT_57_DESC: "§Y $MONUMENT_57_NAME$ §! — стальной сквозной арочный мост через гавань $VICTORY_POINTS_12406$, по которому осуществляется железнодорожное, автомобильное, велосипедное и пешеходное движение. Его длина составляет 1149 метров, а высота — 132 метра. Мост получил прозвище «§Y Вешалка §!» из-за своей арочной конструкции. Он был открыт в 1932 году."

 MONUMENT_58_NAME: "Запретный город"
 MONUMENT_58_DESC: "§Y $MONUMENT_58_NAME$ §! — дворцовый комплекс в центре Имперского города $VICTORY_POINTS_9843$. Он окружен многочисленными роскошными императорскими садами и храмами. §Y $MONUMENT_58_NAME$ §! был построен с 1406 по 1420 год и был бывшим китайским императорским дворцом и зимней резиденцией императора Китая от династии Мин (со времен императора Юнлэ) до конца династии Цин, между 1420 и 1924 годами. §Y $MONUMENT_58_NAME$ §! служил домом китайских императоров и их семей и был церемониальный и политический центр китайского правительства на протяжении более 500 лет."

 MONUMENT_59_NAME: "Альгамбра"
 MONUMENT_59_DESC: "§Y $MONUMENT_59_NAME$ §! — дворцово-крепостной комплекс, расположенный в $VICTORY_POINTS_1176$ . Первоначально он был построен как небольшая крепость в 889 году на остатках римских укреплений, а затем практически игнорировался, пока его руины не были отремонтированы и перестроены в середине 13 века арабским эмиром Насридов Мохаммедом бен Аль-Ахмаром из Гранадского эмирата, который построил нынешний дворец и стены. Он был преобразован в королевский дворец в 1333 году Юсуфом I, султаном Гранады. После завершения христианской Реконкисты в 1492 году это место стало королевским двором Фердинанда и Изабеллы, а дворцы были частично перестроены в стиле эпохи Возрождения."

 MONUMENT_60_NAME: "Килва-Кисивани"
 MONUMENT_60_DESC: "§Y $MONUMENT_60_NAME$ §! был центром султаната Килва, средневекового султаната, власть которого на пике своего расцвета в 13-15 веках распространялась по всей длине побережья Суахили. Он был оккупирован как минимум с 8 века и стал одним из самых могущественных поселений на побережье. Сезонные изменения направления ветра повлияют на торговые обороты. Торговые связи с Аравийским полуостровом, а также с Индией и Китаем повлияли на рост и развитие §Y $MONUMENT_60_NAME$ §!, и, хотя существуют исламские слова и обычаи, адаптированные к этой культуре, их происхождение африканское."

 MONUMENT_61_NAME: "Оксфордский университет"
 MONUMENT_61_DESC: "§Y $MONUMENT_61_NAME$ §! — университетский исследовательский университет в Оксфорде. Есть свидетельства того, что преподавание началось еще в 1096 году, что делает его старейшим университетом в англоязычном мире, вторым старейшим постоянно действующим университетом в мире и одним из самых престижных академических учреждений в мире. Он быстро рос с 1167 года, когда Генрих II запретил английским студентам посещать Университет $VICTORY_POINTS_11506$. Университет состоит из тридцати девяти полуавтономных колледжей, шести постоянных частных залов и ряда академических факультетов, которые разделены на четыре подразделения. Все колледжи являются самоуправляемыми учреждениями внутри университета, каждый из которых контролирует свое членство и имеет свою внутреннюю структуру и деятельность. Все студенты являются членами колледжа. У него нет главного кампуса, а его здания и помещения разбросаны по всему центру города."

 MONUMENT_62_NAME: "Каса-де-Контратасьон"
 MONUMENT_62_DESC: "§Y $MONUMENT_62_NAME$ §! было учреждено Короной Кастилии в 1503 году в порту $VICTORY_POINTS_7183$ (и переведено в $VICTORY_POINTS_1048$ в 1717 году) в качестве коронного агентства Испанской империи. До создания Индийского совета в 1524 году §Y $MONUMENT_62_NAME$ §! имел широкие полномочия по заморским делам, особенно по финансовым вопросам, касающимся торговли и возникающих из-за этого юридических споров. Он также отвечал за лицензирование эмигрантов, обучение пилотов, создание карт и уставов, завещание поместий испанцев, умирающих за границей. В отличие от более поздних Ост-Индских компаний, зарегистрированных компаний, основанных голландцами, англичанами и другими, §Y $MONUMENT_62_NAME$ §! собирали все колониальные налоги и пошлины, разрешали все исследовательские и торговые рейсы, сохраняли секретную информацию о торговых путях и новых открытиях, лицензировали капитанов и применяли коммерческое право."

 MONUMENT_63_NAME: "Сиднейский оперный театр"
 MONUMENT_63_DESC: "§Y $MONUMENT_63_NAME$ §! — это многоцелевой центр исполнительских искусств в гавани $VICTORY_POINTS_12406$. Это одно из самых известных и самобытных зданий 20-го века. Здание включает в себя несколько площадок для выступлений, на которых ежегодно проводится более 1500 представлений, которые посещают более 1,2 миллиона человек."

 MONUMENT_64_NAME: "Дворец Советов"
 MONUMENT_64_DESC: "§Y $MONUMENT_64_NAME$ §! — административный центр и конгресс-холл в $VICTORY_POINTS_6380$. В нем находится §Y Верховный Совет Советского Союза §!, и это самое высокое здание в мире. На самом верху здания находится колоссальная статуя Владимира Ленина."

 MONUMENT_65_NAME: "Монастырь Эскориал"
 MONUMENT_65_DESC: "§Y $MONUMENT_65_NAME$ §!, или §Y Королевский комплекс Сан-Лоренцо-де-Эль-Эскориал §!, представляет собой историческую резиденцию короля Испании, расположенную в городе Сан-Лоренцо-де-Эль-Эскориал примерно в 45 километрах к северо-западу от $VICTORY_POINTS_3938$. Это один из испанских королевских объектов, функционирующий как монастырь, базилика, королевский дворец, пантеон, библиотека, музей, университет, школа и больница.  §Y $MONUMENT_65_NAME$ §! состоит из двух архитектурных комплексов, имеющих большое историческое и культурное значение: самого королевского монастыря и §Y Ла-Гранхилья-де-ла-Фреснеда §! , королевского охотничьего домика и монастырского убежища примерно в 5 километрах. Эти сайты имеют двойную природу; то есть в XVI и XVII веках это были места, в которых власть испанской монархии и церковное преобладание римско-католической религии в Испании нашли общее архитектурное проявление."

 MONUMENT_66_NAME: "Вулкан Килиманджаро"
 MONUMENT_66_DESC: "§Y $MONUMENT_66_NAME$ §! — спящий вулкан в [This.GetName] . Имеет три вулканических конуса: Кибо, Мавензи и Шира. Это самая высокая гора в Африке и самая высокая отдельно стоящая гора в мире: 5895 метров над уровнем моря и около 4900 метров над основанием плато. Происхождение его названия неизвестно, но существует ряд теорий. Европейские исследователи приняли это название к 1860 году и сообщили, что это название горы на суахили."

 MONUMENT_67_NAME: "Гора Эверест"
 MONUMENT_67_DESC: "§Y $MONUMENT_67_NAME$ §! — самая высокая гора Земли над уровнем моря, расположенная в подхребте Махалангур-Химал в Гималаях. Несмотря на несколько экспедиций с 1924 года, ни один человек с начала рекордов еще не достиг вершины."

 MONUMENT_68_NAME: "Скала Язык Тролля"
 MONUMENT_68_DESC: "§Y $MONUMENT_68_NAME$ §! — скальное образование, расположенное на высоте около 1100 метров над уровнем моря в [This.GetName] . Скала выступает горизонтально из горы, примерно на 700 метров над северной стороной озера Рингедалсватнет. Ежегодно его посещают около 800 туристов. Это очень сложный поход, минимум 10 часов по пересеченной местности. На маршруте похода нет приютов и мест, где можно купить припасы."

 MONUMENT_69_NAME: "Кьёсфоссен"
 MONUMENT_69_DESC: "§Y $MONUMENT_69_NAME$ §! — водопад, расположенный в муниципалитете Аурланд в [This.GetName] году. Его общее падение составляет около 225 метров. Железнодорожный путь проходит прямо перед и над верхней частью водопада."

 MONUMENT_70_NAME: "Прекестулен"
 MONUMENT_70_DESC: "§Y $MONUMENT_70_NAME$ §! — крутая скала, возвышающаяся на 604 метра над Люсе-фьордом. На вершине скалы находится почти плоская вершина размером примерно 25 на 25 метров. Название означает §Y Кафедра Скалы §! или §Y Стул проповедника §! ."

 MONUMENT_71_NAME: "Лофотенские острова"
 MONUMENT_71_DESC: "§Y $MONUMENT_71_NAME$ §! — архипелаг в Норвегии. Он имеет характерные пейзажи с потрясающими горами и вершинами, открытым морем и защищенными бухтами, пляжами и нетронутыми землями. Это один из самых северных населенных регионов, и, расположенный за Полярным кругом, архипелаг испытывает одну из крупнейших в мире аномалий повышенной температуры по сравнению с его высокими широтами."

 MONUMENT_72_NAME: "Скальные храмы в Лалибэле"
 MONUMENT_72_DESC: "§Y $MONUMENT_72_NAME$ §! — это монолитные церкви, расположенные в Западном Эфиопском нагорье недалеко от города Лалибела, названные в честь короля конца XII и начала XIII веков Гебре Мескеля Лалибелы из династии Загве, который заказал масштабный проект строительства 11 высеченных в скале церквей, чтобы воссоздать священный город $VICTORY_POINTS_1086$ в своем королевстве. Это место по сей день используется Эфиопской православной христианской церковью и остается важным местом паломничества эфиопских православных верующих."

 MONUMENT_73_NAME: "Великая мечеть Кайруана"
 MONUMENT_73_DESC: "§Y $MONUMENT_73_NAME$ §!, также известная как §Y Мечеть Укба §!, — мечеть, расположенная в городе Кайруан, и один из самых впечатляющих и крупнейших исламских памятников в Северной Африке. Мечеть, основанная арабским генералом Укбой ибн Нафи в 670 году при основании города Кайруан, занимает площадь более 9000 квадратных метров. §Y $MONUMENT_73_NAME$ §! — одно из старейших мест поклонения в исламском мире и образец для всех более поздних мечетей в Магрибе. По периметру его, составляющему около 405 метров, расположены гипостильный молитвенный зал, мощеный мрамором двор и квадратный минарет. Помимо своего духовного престижа, это один из шедевров исламской архитектуры, примечательный, среди прочего, первым исламским использованием подковообразной арки."

 MONUMENT_74_NAME: "Дворец Аль-Бади"
 MONUMENT_74_DESC: "§Y $MONUMENT_74_NAME$ §! — дворец, расположенный в $VICTORY_POINTS_4108$ . Он был построен по заказу султана Ахмада аль-Мансура из династии Саади через несколько месяцев после его восшествия на престол в 1578 году, а строительство и украшение продолжались на протяжении большей части его правления. Дворец, украшенный материалами, импортированными из многих стран, от Италии до Мали, использовался для приемов и был предназначен для демонстрации богатства и власти султана. Это была часть более крупного дворцового комплекса Саади, занимавшего район Касба $VICTORY_POINTS_4108$ года. Дворец был заброшен после смерти аль-Мансура в 1603 году и в конечном итоге пришел в упадок после упадка династии Саадитов."

 MONUMENT_75_NAME: "Водопад Узд"
 MONUMENT_75_DESC: "§Y $MONUMENT_75_NAME$ §! — собирательное название нескольких водопадов, впадающих в ущелье реки Эль-Абид. «§Y Ouzoud §!» на берберском языке означает «действие помола зерна». Это, кажется, подтверждается частыми мельницами в этом регионе. К подножию водопада можно добраться по тенистой тропинке, окруженной оливковыми деревьями. На вершине водопада стоит дюжина старых небольших мельниц, которые все еще работают."

 MONUMENT_76_NAME: "Абу-Симбел"
 MONUMENT_76_DESC: "§Y $MONUMENT_76_NAME$ §! — два массивных высеченных в скале храма в деревне Абу-Симбел. Храмы-близнецы были первоначально высечены в склоне горы в 13 веке до нашей эры, во время правления 19-й династии фараона Рамсеса II. Они служат вечным памятником королю Рамсесу II. Его жену Нефертари и детей можно увидеть в меньших фигурах у его ног, которые считаются менее важными и не имеют такого же положения в масштабе. Это ознаменовывает его победу в битве при Кадеше."

 MONUMENT_77_NAME: "Рейксмюсеум"
 MONUMENT_77_DESC: "§Y $MONUMENT_77_NAME$ §! — голландский национальный музей, посвященный искусству и истории $VICTORY_POINTS_391$ . §Y $MONUMENT_77_NAME$ §! был основан в $VICTORY_POINTS_3211$ 19 ноября 1798 года и переехал в $VICTORY_POINTS_391$ в 1808 году, где сначала располагался в Королевском дворце, а затем в Триппенхейсе. Нынешнее главное здание было впервые открыто в 1885 году."

 MONUMENT_78_NAME: "Новая церковь"
 MONUMENT_78_DESC: "§Y $MONUMENT_78_NAME$ §! — протестантская церковь в городе Делфт. В 1584 году здесь был похоронен Вильгельм Безмолвный в мавзолее, спроектированном Хендриком и Питером де Кейзер. С тех пор члены Дома Оранских-Нассау погребены в королевском склепе. Башня церкви была завершена в 1872 году."

 MONUMENT_79_NAME: "Храм Святого Семейства"
 MONUMENT_79_DESC: "§Y $MONUMENT_79_NAME$ §! — большая незавершенная римско-католическая церковь в $VICTORY_POINTS_9764$. Его спроектировал испанский архитектор Антонио Гауди (1852–1926). 19 марта 1882 года началось строительство §Y $MONUMENT_79_NAME$ §! под руководством архитектора Франсиско де Паула дель Вильяр. В 1883 году, когда Вильяр ушел в отставку, Гауди занял пост главного архитектора, преобразовав проект своим архитектурным и инженерным стилем, объединив готику и криволинейные формы модерна. Гауди посвятил этому проекту остаток своей жизни и похоронен в склепе. На момент его смерти в 1926 году было завершено менее четверти проекта."

 MONUMENT_80_NAME: "Купол Скалы"
 MONUMENT_80_DESC: "§Y $MONUMENT_80_NAME$ §! — исламская святыня, расположенная на Храмовой горе в Старом городе $VICTORY_POINTS_1086$ года. Первоначально он был завершен в 691–692 годах по приказу халифа Омейядов Абд аль-Малика во время Второй Фитны на месте Второго еврейского храма, разрушенного во время римской осады Иерусалима в 70 году. Первоначальный купол рухнул в 1015 году и был восстановлен в 1022–1023 годах. §Y $MONUMENT_80_NAME$ §! по своей сути является одним из старейших сохранившихся произведений исламской архитектуры."

 MONUMENT_81_NAME: "Храм Гроба Господня"
 MONUMENT_81_DESC: "§Y $MONUMENT_81_NAME$ §! — церковь в христианском квартале Старого города $VICTORY_POINTS_1086$ . Согласно традициям, восходящим к четвертому веку, здесь находятся два самых святых места христианства: место, где Иисус был распят, в месте, известном как Голгофа или Голгофа, и пустая гробница Иисуса, где, как полагают христиане, он был похоронен и воскрес. Церковь была основным местом христианского паломничества с момента ее создания в четвертом веке как традиционное место воскресения Христа."

 MONUMENT_82_NAME: "Церковь Всех знаний"
 MONUMENT_82_DESC: "§Y $MONUMENT_82_NAME$ §! , также известная как §Y Базилика Агонии Господней §! , является римско-католической церковью, расположенной на Елеонской горе на востоке $VICTORY_POINTS_1086$ . Здесь хранится часть скалы, где, как говорят, Иисус молился перед своим арестом. Нынешняя церковь стоит на фундаменте двух более ранних: византийской базилики IV века, разрушенной землетрясением в 746 году, и небольшой часовни крестоносцев XII века, заброшенной в 1345 году. Церковь была построена между 1919 и 1924 годами на средства, пожертвованные из разных стран. Гербы этих двенадцати стран, из которых поступили пожертвования, включены в потолок, каждый в отдельном небольшом куполе, а также во внутреннюю мозаику."

 MONUMENT_83_NAME: "Западная стена"
 MONUMENT_83_DESC: "§Y $MONUMENT_83_NAME$ §! или §Y Стена Плача §! — древняя известняковая стена в Старом городе $VICTORY_POINTS_1086$ года. Это относительно небольшой сегмент гораздо более длинной древней подпорной стены. Первоначально стена была возведена в рамках расширения Второго еврейского храма, начатого Иродом Великим, в результате чего естественный крутой холм, известный евреям и христианам как Храмовая гора, был заключен в огромную прямоугольную структуру, увенчанную плоской платформой, что создало больше места для самого Храма, его вспомогательных построек и толп верующих и посетителей. Святость §Y $MONUMENT_83_NAME$ §! в иудаизме является результатом его близости к Храмовой горе. Из-за ограничений на вход на Храмовую гору Стена является самым святым местом, где евреям разрешено молиться, хотя за ней находится Камень основания, самое священное место в еврейской вере."

 MONUMENT_84_NAME: "Церковь Искупителя"
 MONUMENT_84_DESC: "§Y $MONUMENT_84_NAME$ §! — протестантская церковь в $VICTORY_POINTS_1086$, построенная на земле, подаренной немецкому кайзеру Вильгельму I в период с 1893 по 1898 год архитектором Паулем Фердинандом Гротом по проекту Фридриха Адлера. В 1898 году кайзер Вильгельм II совершил поездку в $VICTORY_POINTS_1086$, чтобы лично освятить новую церковь."

 MONUMENT_85_NAME: "Мечеть аль-Харам"
 MONUMENT_85_DESC: "§Y $MONUMENT_85_NAME$ §!, также известная как §Y Великая мечеть Мекки §!, — это мечеть, окружающая Каабу в Мекке. Это место паломничества во время хаджа, который каждый мусульманин должен совершить хотя бы один раз в жизни, если имеет возможность, а также основной этап умры, меньшего паломничества, которое можно совершать в любое время года. Обряды обоих паломничеств включают обход Каабы внутри мечети. §Y $MONUMENT_85_NAME$ §! включает в себя другие важные места, в том числе Черный камень, колодец Замзам и Макам Ибрагим."

 MONUMENT_86_NAME: "Салар-де-Уюни"
 MONUMENT_86_DESC: "§Y $MONUMENT_86_NAME$ §! — крупнейшая в мире соляная равнина площадью более 10 000 квадратных километров. Он находится недалеко от гребня Анд на высоте 3656 метров над уровнем моря. Оно образовалось в результате преобразований нескольких доисторических озер. Он покрыт соляной коркой толщиной несколько метров, которая имеет необычайную плоскостность со средними перепадами высот в пределах одного метра по всей площади §Y $MONUMENT_86_NAME$ §! ."

 MONUMENT_87_NAME: "Храм Минакши"
 MONUMENT_87_DESC: "§Y $MONUMENT_87_NAME$ §! — исторический индуистский храм, расположенный на южном берегу реки Вайгай в храмовом городе Мадурай. Он посвящен Тирукамакоттаму удайе аалудайя начияр, форме Парвати, и ее супругу Сундарешвару, форме Шивы. Храм находится в центре древнего храмового города Мадурай, упомянутого в тамильской литературе Сангама, а храм богини упоминается в текстах VI века."

 MONUMENT_88_NAME: "Торри-ди-Белен"
 MONUMENT_88_DESC: "§Y $MONUMENT_88_NAME$ §! , также известная как §Y Башня Белен §! , представляет собой укрепление 16-го века, расположенное в $VICTORY_POINTS_11805$, которое служило местом посадки и высадки португальских исследователей, а также церемониальными воротами в $VICTORY_POINTS_11805$ .  Он был построен в разгар португальского Возрождения и является ярким примером португальского стиля мануэлино, но в нем также присутствуют намеки на другие архитектурные стили. Сооружение построено из лиозового известняка и состоит из бастиона и 30-метровой четырехэтажной башни. Его часто изображают как символ эпохи европейских открытий и как метоним Португалии или $VICTORY_POINTS_11805$, учитывая его знаковый статус."

 MONUMENT_89_NAME: "Стоунхендж"
 MONUMENT_89_DESC: "§Y $MONUMENT_89_NAME$ §! — доисторический памятник на равнине Солсбери в Уилтшире. Он состоит из внешнего кольца из вертикальных стоящих камней Сарсена, каждый около 4 метров в высоту, 2,1 метра в ширину и весом около 25 тонн, увенчанных соединяющимися горизонтальными камнями-перемычками. Внутри находится кольцо из более мелких голубых камней. Внутри находятся отдельно стоящие трилитоны, два более массивных вертикальных сарсена, соединенных одной перемычкой. Весь памятник, ныне разрушенный, ориентирован на восход солнца в день летнего солнцестояния. Археологи полагают, что он был построен между 3000 и 2000 годами до нашей эры."

 MONUMENT_90_NAME: "Версальский дворец"
 MONUMENT_90_DESC: "§Y $MONUMENT_90_NAME$ §! был главной королевской резиденцией Франции с 1682 года при Людовике XIV до начала Французской революции в 1790 году при Людовике XVI. Простой охотничий домик, а затем небольшой замок со рвом занимал это место до 1661 года, когда для Людовика XIV были проведены первые работы по расширению замка во дворец. В 1682 году, когда дворец стал достаточно большим, король перенес весь королевский двор и французское правительство в §Y $MONUMENT_90_NAME$ §! . Дворец также имел историческое значение. Здесь был подписан Парижский мир (1783 г.), Провозглашение Германской империи произошло в хваленом Зеркальном зале, а Великая война завершилась во дворце Версальским договором."

 MONUMENT_91_NAME: "Родина-мать"
 MONUMENT_91_DESC: "§Y $MONUMENT_91_NAME$ §! — композиционный центр памятника-ансамбля «Героям Сталинградской битвы» на Мамаевом кургане в $VICTORY_POINTS_3529$ году. Это самая высокая статуя в мире, ее высота от кончика меча до вершины постамента составляет 85 метров. Памятник весит более 8000 тонн."

 MONUMENT_92_NAME: "Правительственные здания"
 MONUMENT_92_DESC: "§Y $MONUMENT_92_NAME$ §! — большое здание в эдвардианском стиле, окружающее четырехугольник на Меррион-стрит в $VICTORY_POINTS_11293$. Здание, которое должно было стать §Y $MONUMENT_92_NAME$ §!, было последним крупным общественным зданием, построенным при британском правлении. Первый камень в фундамент здания был заложен королем Эдуардом VII в 1904 году. Оно было построено на месте ряда георгианских домов, которые по спорным причинам сносились один за другим по мере возведения нового здания. Само здание было спроектировано сэром Астоном Уэббом, британским архитектором, который позже перепроектировал фасад §Y $MONUMENT_6_NAME$ §! . Последнее завершенное здание было открыто королем Георгом V в 1911 году."

 MONUMENT_93_NAME: "Мостовая гигантов"
 MONUMENT_93_DESC: "§Y $MONUMENT_93_NAME$ §! — это территория, состоящая примерно из 40 000 взаимосвязанных базальтовых колонн, образовавшаяся в результате древнего извержения вулкана. Он расположен на северном побережье Северной Ирландии. Вершины колонн образуют ступеньки, ведущие от подножия скалы и исчезающие под водой. Большинство колонн шестиугольные, хотя есть и четырех-, пяти-, семи- или восьмигранные."

 MONUMENT_94_NAME: "Мараэ Тапутапуатеа"
 MONUMENT_94_DESC: "§Y $MONUMENT_94_NAME$ §! — это большой комплекс мараэ в Опоа в Тапутапуатеа, на юго-восточном побережье Райатеа. На этом месте расположено множество мараэ и других каменных построек, и когда-то оно считалось центральным храмом и религиозным центром Восточной Полинезии. Около 1763 года воины с Бора-Бора напали на остров, разгромив Тупайю, и разграбили остров. Это включало в себя разрушение домов богов в Тапутапуатеа, разрушение платформы и вырубку укрывающих деревьев."

 MONUMENT_95_NAME: "Мон-Сен-Мишель"
 MONUMENT_95_DESC: "§Y $MONUMENT_95_NAME$ §! — приливный остров и материковая коммуна в Нормандии. Остров находится примерно в одном километре от побережья. Остров остался непокоренным во время Столетней войны; небольшой гарнизон отразил полномасштабное нападение англичан в 1433 году. Людовик XI осознал обратные преимущества его естественной защиты и превратил его в тюрьму. Во времена Старого режима аббатство регулярно использовалось в качестве тюрьмы."

 MONUMENT_96_NAME: "Крепость Каркасон"
 MONUMENT_96_DESC: "§Y $MONUMENT_96_NAME$ §! — средневековая цитадель, расположенная в городе Каркассон, в регионе Окситания. Он расположен на холме на правом берегу реки Од, в юго-восточной части города. Основанная в галло-римский период, цитадель получила свою репутацию благодаря своим двойным окружающим стенам длиной 3 километра, перемежающимся 52 башнями. Город имеет около 2500-летнюю историю и в разные эпохи был оккупирован римлянами, вестготами и крестоносцами."

 MONUMENT_97_NAME: "Национальный парк Йеллоустон"
 MONUMENT_97_DESC: "§Y $MONUMENT_97_NAME$ §! — национальный парк, расположенный преимущественно в северо-западной части [This.GetName]. Он был учрежден Конгрессом США и подписан президентом Улиссом С. Грантом 1 марта 1872 года. Широко распространено мнение, что это первый национальный парк в мире. Парк известен своей дикой природой и многочисленными геотермальными объектами. Хотя он представляет собой множество типов биомов, субальпийский лес является наиболее многочисленным."

 MONUMENT_98_NAME: "Озеро Морейн"
 MONUMENT_98_DESC: "§Y $MONUMENT_98_NAME$ §! — озеро ледникового происхождения в национальном парке Банф в [This.GetName] году. Он расположен в Долине Десяти Пиков, на высоте около 1884 метров. Озеро имеет площадь 50 га. Озеро, питающееся ледниковым путем, не достигает своей вершины до середины-конца июня. Когда он наполнен, он отражает характерный оттенок лазурного синего. Уникальный цвет обусловлен преломлением света от каменной муки, постоянно отлагающейся в озере окружающими ледниками."

 MONUMENT_99_NAME: "Сад скромного чиновника"
 MONUMENT_99_DESC: "§Y $MONUMENT_99_NAME$ §! — китайский сад в Сучжоу. Впервые на месте сада был построен сад в период Шаосин (1131-1162 гг.) династии Южная Сун. Впоследствии он сменил владельца и постоянно уничтожался или модифицировался. Это была резиденция и сад Лу Гуймэна, учёного династии Тан. Позже, во времена династии Юань, он стал садом храма Дахун. В саду расположены многочисленные павильоны и мостики, расположенные среди лабиринта соединенных друг с другом бассейнов и островов. Он состоит из трех основных частей, расположенных вокруг большого озера."

 MONUMENT_100_NAME: "Хуаншань"
 MONUMENT_100_DESC: "§Y $MONUMENT_100_NAME$ §! , что буквально означает §Y Желтая гора §! , — горный массив на юге [This.GetName] восточного Китая. Первоначально он назывался §Y Ишань §!, а был переименован из-за легенды о том, что император Сюаньюань когда-то занимался здесь алхимией."

 MONUMENT_101_NAME: "Собор Святого Петра"
 MONUMENT_101_DESC: "§Y $MONUMENT_101_NAME$ §! — это церковь, построенная в стиле ренессанса, расположенная в Ватикане, папском анклаве, находящемся в пределах города $VICTORY_POINTS_9904$ . Он известен как место паломничества и своими литургическими функциями. Папа председательствует на ряде литургий в течение года как в базилике, так и на прилегающей §Y площади Святого Петра §! ; эти литургии собирают аудиторию от 15 000 до более 80 000 человек. §Y $MONUMENT_101_NAME$ §! имеет множество исторических связей с раннехристианской церковью, папством, протестантской реформацией и католической контрреформацией, а также с многочисленными художниками, особенно Микеланджело. Как произведение архитектуры, он считается величайшим зданием своего времени."

 MONUMENT_102_NAME: "Мальборкский замок"
 MONUMENT_102_DESC: "§Y $MONUMENT_102_NAME$ §! , также известный как §Y Замок Тевтонского ордена в Мальборке §! , представляет собой тевтонский замок и крепость 13-го века, расположенный недалеко от города Мальборк. Это самый большой замок в мире по площади. Первоначально он был построен Тевтонскими рыцарями, немецким католическим религиозным орденом крестоносцев, в форме крепости Орденсбург. Орден назвал его §Y Мариенбург §! в честь Марии, матери Иисуса. Замок представляет собой классический образец средневековой крепости и после завершения строительства в 1406 году стал крупнейшим кирпичным замком в мире."

 MONUMENT_103_NAME: "Пражский Град"
 MONUMENT_103_DESC: "§Y $MONUMENT_103_NAME$ §! — замковый комплекс в $VICTORY_POINTS_11542$, построенный в 9 веке. Замок был резиденцией королей Богемии, императоров Священной Римской империи и президентов Чехословакии. Чешские королевские регалии хранятся в потайной комнате внутри него. Последнюю крупную перестройку замка провела императрица Мария Терезия во второй половине XVIII века."

 MONUMENT_104_NAME: "Карлов мост"
 MONUMENT_104_DESC: "§Y $MONUMENT_104_NAME$ §! — средневековый каменный арочный мост, пересекающий реку Влтаву в $VICTORY_POINTS_11542$ году. Его строительство началось в 1357 году под эгидой короля Карла IV и завершилось в начале 15 века. Будучи единственным средством переправы через реку Влтаву до 1841 года, §Y $MONUMENT_104_NAME$ §! был важнейшим связующим звеном между §Y $MONUMENT_103_NAME$ §! и Старым городом и прилегающими районами. Это сухопутное сообщение сделало $VICTORY_POINTS_11542$ важным торговым путем между Восточной и Западной Европой."

 MONUMENT_105_NAME: "Венский Бельведер"
 MONUMENT_105_DESC: "§Y $MONUMENT_105_NAME$ §! — это комплекс исторических зданий в $VICTORY_POINTS_11666$, состоящий из двух дворцов в стиле барокко, Оранжереи и Дворцовой конюшни. Дворцовый комплекс в стиле барокко был построен как летняя резиденция принца Евгения Савойского. §Y $MONUMENT_105_NAME$ §! был построен в период обширного строительства в $VICTORY_POINTS_11666$, который в то время был одновременно столицей империи и домом правящей династии Габсбургов. Этот период процветания последовал за успешным завершением главнокомандующим принцем Евгением Савойским серии войн против Османской империи. В 1723 году строительство было завершено."

 MONUMENT_106_NAME: "Хофбург"
 MONUMENT_106_DESC: "§Y $MONUMENT_106_NAME$ §! является официальной резиденцией и местом работы президента Австрии и ранее был главным императорским дворцом династии Габсбургов. Расположенный в центре $VICTORY_POINTS_11666$, он был построен в 13 веке и впоследствии несколько раз расширялся. С 1279 года §Y $MONUMENT_106_NAME$ §! является официальной резиденцией правительства. Дворец выходит на §Y Хельденплац §!, построенную во времена правления императора Франца Иосифа I."

 MONUMENT_107_NAME: "Здание венгерского парламента"
 MONUMENT_107_DESC: "§Y $MONUMENT_107_NAME$ §! является резиденцией Национального собрания Венгрии.  $VICTORY_POINTS_9660$ был объединен из трех городов в 1873 году. Семь лет спустя Сейм постановил создать новое представительное здание парламента, выражающее суверенитет нации. Здание планировалось обращено к реке Дунай. Строительство было начато в 1885 году, а открытие здания состоялось к предполагаемому 1000-летию страны в 1896 году. Полностью оно было завершено только в 1904 году."

 MONUMENT_108_NAME: "Площадь Героев"
 MONUMENT_108_DESC: "§Y $MONUMENT_108_NAME$ §! , что означает §Y Площадь Героев §! , является одной из главных площадей $VICTORY_POINTS_9660$ . Центральной достопримечательностью §Y $MONUMENT_108_NAME$ §! , а также достопримечательностью $VICTORY_POINTS_9660$ , является §Y Мемориал тысячелетия §! . Строительство началось в 1896 году в ознаменование тысячелетия венгерского завоевания Карпатского бассейна и основания Венгерского государства в 1896 году и было частью гораздо более масштабного строительного проекта, который также включал расширение и реконструкцию проспекта Андраши и строительство первой линии метро в $VICTORY_POINTS_9660$ году. Строительство было в основном завершено в 1900 году, именно тогда площадь получила свое название. Четыре аллегорические скульптуры были добавлены в 1906 году."

 MONUMENT_109_NAME: "Загребский собор"
 MONUMENT_109_DESC: "§Y $MONUMENT_109_NAME$ §! — римско-католическое учреждение и не только самое высокое здание в [This.GetName], но и самое монументальное сакральное здание в готическом стиле к юго-востоку от Альп. Он посвящен Успению Марии и королям Святому Стефану и Святому Ладиславу. В 1093 году, когда король Ладислав (1040-1095) перенес кафедру епископа из Сисака в $VICTORY_POINTS_11581$, он провозгласил существующую церковь собором. Строительство собора началось вскоре после его смерти, было завершено в 1217 году и освящено королем Венгрии Андреем II. Здание было разрушено монголами в 1242 году, но несколько лет спустя восстановлено епископом Тимотеем (1263-1287). В конце 15 века Османская империя вторглась в Хорватию, что привело к строительству крепостных стен вокруг собора, некоторые из которых сохранились до сих пор."

 MONUMENT_110_NAME: "Памятник Героям-авиаторам"
 MONUMENT_110_DESC: "§Y $MONUMENT_110_NAME$ §! , расположенный на площади Авиаторов на бульваре Авиаторов $VICTORY_POINTS_9617$ , был построен между 1930 и 1935 годами. Сооружение высотой 20 метров состоит из бронзовых скульптур, опирающихся на каменный постамент в форме обелиска, который, в свою очередь, стоит на четырех трапециевидных призмах, соединенных между собой дугами. Под всем этим комплексом находится круглое каменное основание. К вершине обелиска прикреплена 5-метровая 5-тонная статуя, изображающая летающего человека с распростертыми крыльями. Складки шали ниспадают с его талии на обелиск. Вокруг основания обелиска изображены три авиатора, каждый на разных стадиях полета. На постаменте расположены знаки отличия, шлем и снаряжение авиаторов, а также выгравированные таблички с именами румынских летчиков, разбившихся насмерть к моменту возведения памятника. Эти люди погибли, преследуя различные цели: развитие навыков, производительность, приключения и сражения в Великой войне."

 MONUMENT_111_NAME: "Замок Бран"
 MONUMENT_111_DESC: "§Y $MONUMENT_111_NAME$ §! — замок в Бране, в 25 километрах $VICTORY_POINTS_690$ . Это национальный памятник и достопримечательность [This.GetName] . Широко известный за пределами [This.GetName] как §Y Замок Дракулы §!, его часто называют домом главного героя в романе Брэма Стокера «Дракула». По Трианонскому договору 1920 года Венгрия потеряла [This.GetName], а замок стал королевской резиденцией в Королевстве Румыния после того, как его передали королевскому дому саксы Кронштадт-Брашов, которые больше не использовали его и не были заинтересованы в финансировании поврежденного временем имущества. Он стал любимым домом и убежищем Марии Румынской, которая заказала его капитальный ремонт."

 MONUMENT_112_NAME: "Собор Александра Невского"
 MONUMENT_112_DESC: "§Y $MONUMENT_112_NAME$ §! — православный собор в $VICTORY_POINTS_949$ . Построенное в неовизантийском стиле, оно считается одним из 50 крупнейших по объему христианских церковных зданий в мире. Строительство §Y $MONUMENT_112_NAME$ §! началось в 1882 году, когда был заложен первый камень, но большая его часть была построена в период с 1904 по 1912 год. Собор создан в честь русских воинов, погибших во время русско-турецкой войны 1877-1878 годов, в результате которой Болгария была освобождена от османского владычества."

 MONUMENT_113_NAME: "Белградская крепость"
 MONUMENT_113_DESC: "§Y $MONUMENT_113_NAME$ §! — это центральная и старейшая часть городской территории $VICTORY_POINTS_11586$. На протяжении веков население города концентрировалось только в стенах крепости. В 1521 году, через 132 года после битвы за Косово, крепость, как и большая часть сербского государства, была завоевана турками и оставалась (с короткими периодами австрийской и сербской оккупации) под властью Османской империи до 1867 года, когда турки ушли из $VICTORY_POINTS_11586$ и [This.GetName] . За короткий период австрийского правления (1718–1738 гг.) крепость была существенно перестроена и модернизирована."

 MONUMENT_114_NAME: "Памуккале"
 MONUMENT_114_DESC: "§Y $MONUMENT_114_NAME$ §! — природный объект в [This.GetName] . Этот район известен карбонатными минералами, оставшимися в результате течения термальной родниковой воды. Этот район привлекал посетителей своими термальными источниками еще со времен классической античности.  Террасы §Y $MONUMENT_114_NAME$ §! сделаны из травертина — осадочной породы, отложенной минеральной водой из горячих источников. В этом районе находится 17 горячих источников с температурой от 35°C до 100°C."

 MONUMENT_115_NAME: "Аныткабир"
 MONUMENT_115_DESC: "§Y $MONUMENT_115_NAME$ §! — мавзолей Мустафы Кемаля Ататюрка, лидера турецкой войны за независимость, основателя и первого президента Турецкой Республики. Он расположен в $VICTORY_POINTS_11747$ . Строительство §Y $MONUMENT_115_NAME$ §! началось 9 октября 1944 года и завершилось 1 сентября 1953 года."

 MONUMENT_116_NAME: "Горный массив Псилоритис"
 MONUMENT_116_DESC: "§Y $MONUMENT_116_NAME$ §! — массив, расположенный на водоразделе между южной частью [This.GetName], притоком Ливийского моря, и северной, обращенной к Эгейскому морю. Самая высокая гора [This.GetName] §Y гора Ида §! (2456 метров) входит в состав §Y $MONUMENT_116_NAME$ §! . На его склонах лежит одна из пещер – Идейская, в которой, по преданию, родился Зевс."

 MONUMENT_117_NAME: "Мавзолей султана Салах-ад-Дина"
 MONUMENT_117_DESC: "В §Y $MONUMENT_117_NAME$ §! находится место упокоения и могила средневекового мусульманского султана Айюбидов §Y Саладина §! . Он был построен в 1196 году, через три года после смерти Саладина. В настоящее время в мавзолее находятся два саркофага: один деревянный, в котором, как говорят, хранятся останки Саладина, а другой мраморный, построенный в честь Саладина в конце девятнадцатого века османским султаном Абдул-Хамидом II."

 MONUMENT_118_NAME: "Медресе аль-Мустансирия"
 MONUMENT_118_DESC: "§Y $MONUMENT_118_NAME$ §! представлял собой научный комплекс средневековой эпохи, обеспечивавший универсальную систему высшего образования. Он был основан в 1227 году, назван в честь и построен аббасидским халифом аль-Мустансиром в $VICTORY_POINTS_2097$ году. Он предлагал множество различных предметов, включая медицину, математику, литературу, грамматику, философию и исламское религиоведение.  §Y $MONUMENT_118_NAME$ §! за свою историю пережил несколько периодов упадка и возрождения. Самым значительным ухудшением его архитектуры и положения в $VICTORY_POINTS_2097$ году стала монгольская осада 1258 года."

 MONUMENT_119_NAME: "Дворец Голестан"
 MONUMENT_119_DESC: "§Y $MONUMENT_119_NAME$ §! — королевский комплекс в $VICTORY_POINTS_10837$. Он состоит из садов, королевских зданий и коллекций иранских ремесел и европейских подарков XVIII и XIX веков. Двор и §Y $MONUMENT_119_NAME$ §! стали официальной резиденцией династии Каджаров. Дворец был перестроен в его нынешний вид в 1865 году Хаджи Аб ол Хасаном Мимаром Наваи. С 1925 года §Y $MONUMENT_119_NAME$ §! используется для официальных королевских приёмов."

 MONUMENT_120_NAME: "Памятник Хосе Рисаля"
 MONUMENT_120_DESC: "§Y $MONUMENT_120_NAME$ §! — мемориал в парке Ризал в $VICTORY_POINTS_10265$ году, построенный в память о казнённом филиппинском националисте Хосе Ризале. Памятник представляет собой стоящую бронзовую скульптуру Ризаля с обелиском, установленным на каменном постаменте, внутри которого захоронены его останки, в которых хранятся его два знаменитых романа «Эль Флибустьеризм» и «Ноли меня Тангере». Мемориальная доска на передней части постамента гласит: «В память Хосе Рисаля, патриота и мученика, казненного на поле Багумбаян 30 декабря 1896 года. Этот памятник посвящен народу Филиппинских островов». Строительство длилось 5 лет, с 1908 по 1913 год."

 MONUMENT_121_NAME: "Церкви острова Чилоэ"
 MONUMENT_121_DESC: "§Y $MONUMENT_121_NAME$ §! — уникальное архитектурное явление в Америке и один из самых выдающихся стилей архитектуры Чилоты. В отличие от классической испанской колониальной архитектуры, церкви Чилоэ полностью построены из местной древесины с широким использованием деревянной черепицы. Церкви были построены из материалов, устойчивых к влажному и дождливому океаническому климату архипелага Чилоэ. Построенные в 18 и 19 веках, когда архипелаг Чилоэ еще был частью владений испанской короны, церкви представляют собой сплав испанской иезуитской культуры и навыков и традиций местного коренного населения; отличный пример культуры метисов."

 MONUMENT_122_NAME: "Национальный парк Маунт-Кан-Кинли"
 MONUMENT_122_DESC: "§Y $MONUMENT_122_NAME$ §! — национальный парк и заповедник, расположенный в [This.GetName], с центром на Денали, самой высокой горе в Северной Америке. Законопроект был внесен в Сенат в апреле 1916 года. В течение следующего года велось активное лоббирование, и 19 февраля 1917 года законопроект был принят. 26 февраля 1917 года, через 11 лет после его принятия, законопроект был подписан президентом Соединенных Штатов Вудро Вильсоном, в результате чего было создано §Y $MONUMENT_122_NAME$ §! ."

 MONUMENT_123_NAME: "Тикаль"
 MONUMENT_123_DESC: "§Y $MONUMENT_123_NAME$ §! — это руины древнего города, который, вероятно, назывался §Y Ях Мутал §! . Это была столица государства-завоевателя, ставшего одним из самых могущественных королевств древних майя. Хотя монументальная архитектура на этом месте датируется IV веком до нашей эры, §Y $MONUMENT_123_NAME$ §! достигла своего апогея в классический период, ок. С 200 по 900. За это время город доминировал на большей части региона майя в политическом, экономическом и военном отношении."

 MONUMENT_124_NAME: "Руины Копана"
 MONUMENT_124_DESC: "§Y $MONUMENT_124_NAME$ §! — древний город майя, который отражает красоту физического ландшафта, в котором он процветал. Это была столица крупного королевства классического периода с 5 по 9 века. Город находился на крайнем юго-востоке мезоамериканского культурного региона, на границе с Истмо-колумбийским культурным регионом, и был почти окружен народами, не относящимися к майя.  §Y $MONUMENT_124_NAME$ §! был заселен более двух тысяч лет, от раннего доклассического периода до постклассического периода. В городе сложился своеобразный скульптурный стиль в традициях равнинных майя."

 MONUMENT_125_NAME: "Тасумаль"
 MONUMENT_125_DESC: "§Y $MONUMENT_125_NAME$ §! — архитектурный комплекс на большей территории древнего мезоамериканского города §Y Чалчуапа §! . Раскопки и реставрация начались в 1940-х годах. Археологические исследования показывают, что §Y $MONUMENT_125_NAME$ §! был заселен с классического периода до постклассического периода и что это место имело связи даже с центральной Мексикой, северным полуостровом Юкатан и нижней частью Центральной Америки. Металлические артефакты комплекса датируются VIII веком и являются одними из самых ранних металлических артефактов, зарегистрированных в Мезоамерике."

 MONUMENT_126_NAME: "Озеро Коатепека"
 MONUMENT_126_DESC: "§Y $MONUMENT_126_NAME$ §! — большое кратерное озеро в восточной части кальдеры Коатепеке. По берегам озера расположены горячие источники. Это одно из крупнейших озер [This.GetName] площадью 26 квадратных километров. На озере находится остров Теопан, который был важным местом майя."

 MONUMENT_127_NAME: "Вулкан Консепсьон"
 MONUMENT_127_DESC: "§Y $MONUMENT_127_NAME$ §! — один из двух вулканов, образующих остров Ометепе, расположенный на озере Никарагуа в [This.GetName] году.  §Y $MONUMENT_127_NAME$ §! — действующий стратовулкан высотой 1610 метров. Он покоится на километровом основании из четвертичных озерных аргиллитов."

 MONUMENT_128_NAME: "Водопад Кукенан"
 MONUMENT_128_DESC: "§Y $MONUMENT_128_NAME$ §! — тепуи в [This.GetName] . Его расчетная площадь составляет 21,85 квадратных километров, высота — 2680 метров, длина — 3 километра.  §Y Водопад Кукенан §! высотой 674 метра расположен на южной оконечности тепуи."

 MONUMENT_129_NAME: "Вулкан Килотоа"
 MONUMENT_129_DESC: "§Y $MONUMENT_129_NAME$ §! — заполненное водой кратерное озеро и самый западный вулкан [This.GetName] . Кальдера шириной три километра образовалась в результате обрушения дацитового вулкана после катастрофического извержения около 800 лет назад. С тех пор в кальдере образовалось кратерное озеро глубиной 250 метров, имеющее зеленоватый цвет из-за растворенных минералов."

 MONUMENT_130_NAME: "Вулкан Руапеху"
 MONUMENT_130_DESC: "§Y $MONUMENT_130_NAME$ §! — действующий стратовулкан в [This.GetName]. Это крупнейший действующий вулкан Новой Зеландии и самая высокая точка Северного острова, он имеет три основные вершины: Тахуранги (2797 метров), Те Хеухеу (2755 метров) и Парететайтонга (2751 метр). Название на языке маори означает «яма шума» или «взрывающаяся яма»."

 MONUMENT_131_NAME: "Мемориал Линкора Аризона"
 MONUMENT_131_DESC: "§Y $MONUMENT_131_NAME$ §! в Перл-Харборе, [This.GetName], отмечает место упокоения моряков и морских пехотинцев, погибших на §Y авианосце США «Аризона» §! во время §Y нападения на Перл-Харбор §! во Второй мировой войне, которое привело к участию Соединенных Штатов. Доступный только на лодке, §Y $MONUMENT_131_NAME$ §! стоит на затонувшем корпусе линкора, не касаясь его."

 MONUMENT_132_NAME: "Национальный Капитолий"
 MONUMENT_132_DESC: "§Y $MONUMENT_132_NAME$ §! был построен по заказу президента Кубы и строился с 1926 по 1929 год. Он был построен на земле, которая раньше была железнодорожным вокзалом в $VICTORY_POINTS_7622$ .  §Y $MONUMENT_132_NAME$ §! находится Конгресс Кубы."

 MONUMENT_133_NAME: "Ла-Реаль-Фуэрса"
 MONUMENT_133_DESC: "§Y $MONUMENT_133_NAME$ §! — форт-бастион на западной стороне гавани в $VICTORY_POINTS_7622$, [This.GetName]. Первоначально он был построен в 16 веке для защиты от нападения пиратов.  §Y $MONUMENT_133_NAME$ §! считается старейшим каменным фортом в Америке."

 MONUMENT_134_NAME: "Алькасар-де-Колон"
 MONUMENT_134_DESC: "§Y $MONUMENT_134_NAME$ §! — первый укрепленный испанский дворец, построенный в Америке. Он был построен между 1511 и 1514 годами в основном в готическом и ренессансном стиле. Поскольку влияние $VICTORY_POINTS_7660$ уменьшилось, дом превратился в руины, а к середине 18 века был заброшен и находился под угрозой гниения. В 1870 году §Y $MONUMENT_134_NAME$ §! был объявлен национальным памятником, и правительство Доминиканской Республики в конечном итоге восстановило дворец."

 MONUMENT_135_NAME: "Биржевой дворец"
 MONUMENT_135_DESC: "§Y $MONUMENT_135_NAME$ §! — это фондовая биржа и торговый суд в $VICTORY_POINTS_9817$ . Строительство началось в 1842 году и в основном было закончено к 1850 году, однако внутреннюю отделку завершили лишь в 1910 году."

 MONUMENT_136_NAME: "Рижский замок"
 MONUMENT_136_DESC: "§Y $MONUMENT_136_NAME$ §! — замок на берегу реки Даугавы в $VICTORY_POINTS_9340$ [This.GetName] году. Он был построен на основании договора между Ригой и Ливонским орденом – в 13 веке рижане восстали против ордена и снесли его первоначальный замок в центре города.  §Y $MONUMENT_136_NAME$ §! служил резиденцией магистра Ливонского ордена, но из-за постоянных конфликтов с рижанами резиденция была перенесена незадолго до того, как замок был разрушен рижанами в 1484 году. Рижане в конечном итоге проиграли битву и были вынуждены перестроить замок – реставрация была завершена в 1515 году. После прекращения существования Виленского договора в 1561 году замок стал литовским, а в 1569 году - Польско-литовский оплот. В 1621 году Рига перешла под власть Швеции, и §Y $MONUMENT_136_NAME$ §! использовалась для размещения шведской администрации."

 MONUMENT_137_NAME: "Памятник Свободы"
 MONUMENT_137_DESC: "§Y $MONUMENT_137_NAME$ §! находится в $VICTORY_POINTS_9340$ , [This.GetName] . Он посвящен памяти солдат, погибших во время войны за независимость Латвии. §Y $MONUMENT_137_NAME$ §! считается важным символом свободы, независимости и суверенитета Латвии. Открытый в 1935 году памятник высотой 42 метра из гранита, травертина и меди часто служит центром общественных собраний и официальных церемоний."

 MONUMENT_138_NAME: "Великая Китайская стена"
 MONUMENT_138_DESC: "§Y $MONUMENT_138_NAME$ §! — это серия укреплений, построенных на исторических северных границах древних китайских государств и императорского Китая в качестве защиты от различных кочевых групп из Евразийской степи. Несколько стен были построены еще в VII веке до нашей эры, а отдельные участки позже были объединены Цинь Ши Хуаном (220–206 до н.э.), первым императором Китая.  Позже многие последующие династии строили и поддерживали несколько участков пограничных стен. Самые известные участки стены были построены во времена династии Мин (1368–1644)."

 MONUMENT_139_NAME: "Императорский дворец Маньчжоу-го"
 MONUMENT_139_DESC: "§Y $MONUMENT_139_NAME$ §! официальная резиденция, созданная Императорской японской армией для проживания последнего императора Китая Пуи в рамках его роли императора японского марионеточного государства Маньчжоу-Го. §Y $MONUMENT_139_NAME$ §! был разработан как миниатюрная версия §Y $MONUMENT_58_NAME$ §! в $VICTORY_POINTS_9843$ году. Он был разделен на внутренний двор и внешний двор. Внешний или передний двор использовался в административных целях, а внутренний или задний двор – как королевская резиденция. Дворец занимает площадь 43 000 квадратных метров. §Y Зал Тонгдэ §! — самое большое и впечатляющее из зданий дворца и имеет самое роскошное внутреннее убранство. Первоначально это был офис по сбору налога на соль провинции Цзилинь, поэтому его иногда называли «Соляным дворцом», но японские инженеры реконструировали его с 1936 по 1938 год."

 MONUMENT_140_NAME: "Вавельский замок"
 MONUMENT_140_DESC: "§Y $MONUMENT_140_NAME$ §! — это резиденция в замке, расположенная в $VICTORY_POINTS_9427$ . Построенный по приказу короля Казимира III Великого, он состоит из ряда построек разных периодов, расположенных вокруг главного двора в итальянском стиле. Замок является частью укрепленного архитектурного комплекса, возведенного на вершине известнякового обнажения на левом берегу реки Вислы, на высоте 228 метров над уровнем моря. На протяжении веков резиденция королей Польши и символ польской государственности, §Y $MONUMENT_140_NAME$ §!, сегодня является одним из главных художественных музеев страны. Основанный в 1930 году, музей включает в себя десять кураторских отделов, отвечающих за коллекции картин."

 MONUMENT_141_NAME: "Ягеллонский университет"
 MONUMENT_141_DESC: "§Y $MONUMENT_141_NAME$ §! был основан в 1364 году королем Польши Казимиром III Великим. Это старейший университет в Польше, старейший славянский университет, второй старейший университет в Центральной Европе и один из старейших сохранившихся университетов в мире. Университет состоит из шестнадцати факультетов, включая гуманитарные, юридические, естественные и социальные науки и медицину."

 MONUMENT_142_NAME: "Королевский замок"
 MONUMENT_142_DESC: "§Y $MONUMENT_142_NAME$ §! — королевская резиденция, которая на протяжении веков служила официальным домом польских монархов. Он стал свидетелем многих заметных событий в истории Польши; Конституция от 3 мая 1791 года, первая в своем роде в Европе и вторая старейшая в мире кодифицированная национальная конституция, была разработана здесь четырехлетним парламентом. После раздела Польши здание было перестроено в неоклассическом стиле. В настоящее время это резиденция главы государства и президента Польши."

 MONUMENT_143_NAME: "Острая брама"
 MONUMENT_143_DESC: "§Y $MONUMENT_143_NAME$ §! — городские ворота в $VICTORY_POINTS_3320$ и один из важнейших религиозных, исторических и культурных памятников. Они были построены между 1503 и 1522 годами и являются единственными сохранившимися городскими воротами $VICTORY_POINTS_3320$."

 MONUMENT_144_NAME: "Болонский университет"
 MONUMENT_144_DESC: "§Y $MONUMENT_144_NAME$ §! был основан в 1088 году организованной гильдией студентов. Это старейший постоянно действующий университет в мире и первый университет в смысле высшего учебного заведения и института, присуждающего ученые степени. §Y $MONUMENT_144_NAME$ §! состоит из двадцати трех факультетов, включая искусство, медицину, право и инженерию."

 MONUMENT_145_NAME: "Дворец Иолани"
 MONUMENT_145_DESC: "§Y $MONUMENT_145_NAME$ §! был королевской резиденцией правителей Королевства Гавайи, начиная с Камехамеха III при династии Камехамеха (1845 г.) и заканчивая королевой Лилиуокалани (1893 г.) при династии Калакауа. Название отсылает к гавайскому ястребу. Первоначальное строение было очень простым по конструкции и напоминало скорее величественный дом, чем дворец, но в то время это был самый величественный дом в городе."

 MONUMENT_146_NAME: "Оссуарий Дуомон"
 MONUMENT_146_DESC: "§Y $MONUMENT_146_NAME$ §! — это мемориал, содержащий останки солдат, погибших на поле боя во время битвы при Вердене во время Великой войны. За 300 дней битвы при Вердене (21 февраля 1916 г. - 19 декабря 1916 г.) погибло около 230 000 человек из 700 000 раненых (убитых, раненых и пропавших без вести). §Y $MONUMENT_146_NAME$ §! содержит останки французских и немецких солдат, погибших на поле боя. Через небольшие внешние окна можно увидеть останки по меньшей мере 130 000 неопознанных бойцов обеих стран, заполнившие ниши на нижнем краю здания."

 MONUMENT_147_NAME: "Озеро Байкал"
 MONUMENT_147_DESC: "§Y $MONUMENT_147_NAME$ §! — рифтовое озеро, расположенное в [This.GetName] . Он сформировался как древняя рифтовая долина и имеет длинную форму полумесяца, площадь поверхности которого составляет 31 722 квадратных километра.  §Y $MONUMENT_147_NAME$ §! является домом для тысяч видов растений и животных, многие из которых являются эндемичными для данного региона."

 MONUMENT_148_NAME: "Озеро Балатон"
 MONUMENT_148_DESC: "§Y $MONUMENT_148_NAME$ §! — пресноводное озеро в [This.GetName] . Это самое большое озеро в Центральной Европе и одно из главных туристических направлений региона. Река Зала обеспечивает наибольший приток воды в озеро, а канализированный Сио является единственным стоком. Горный район северного побережья известен как своим историческим характером, так и крупным винодельческим регионом, а равнинный южный берег известен своими курортными городами."

 MONUMENT_149_NAME: "Обелиск в Буэнос-Айресе"
 MONUMENT_149_DESC: "§Y $MONUMENT_149_NAME$ §! — национальный исторический памятник и символ $VICTORY_POINTS_12364$. Он был установлен в 1936 году в ознаменование четырехсотлетия со дня основания города. Для его строительства, стоимость которого составила 200 000 песо moneda nacional, было использовано 680 кубометров бетона и 1360 квадратных метров белого камня. Его высота составляет 67,5 метров.  §Y $MONUMENT_149_NAME$ §! построен немецкой компанией G.E.O.P.E. - Siemens Bauunion – Grün & Bilfinger, завершившая свою работу за рекордный срок – 31 день, со штатом 157 человек."

 MONUMENT_150_NAME: "Суоменлинна"
 MONUMENT_150_DESC: "§Y $MONUMENT_150_NAME$ §! — обитаемая морская крепость, построенная на восьми островах примерно в 4 километрах к юго-востоку от центра города $VICTORY_POINTS_11105$. Первоначально называвшийся §Y Свеаборг §! или §Y Виапори §!, как его называли финноязычные финны, в 1918 году он был переименован в §Y $MONUMENT_150_NAME$ §! по патриотическим и националистическим причинам. Шведская корона начала строительство крепости в 1748 году как защиту от российского экспансионизма. Во время финской войны Швеция сдала крепость России 3 мая 1808 года, открыв путь к оккупации Финляндии русскими войсками в 1809 году и возможной уступке Финляндии России по окончании войны. Россия удерживала крепость до обретения Финляндией независимости в 1918 году."

 MONUMENT_151_NAME: "Исаакиевский собор"
 MONUMENT_151_DESC: "§Y $MONUMENT_151_NAME$ §! строилось 40 лет, с 1818 по 1858 год. Первоначально он был построен как собор, но позже советское правительство превратило его в музей."

 MONUMENT_152_NAME: "Транссибирская магистраль"
 MONUMENT_152_DESC: "§Y $MONUMENT_152_NAME$ §! — сеть железных дорог, соединяющая $VICTORY_POINTS_6380$ и $VICTORY_POINTS_957$. Это одна из самых длинных железнодорожных линий в мире, ее длина превышает 9289 километров. Еще до завершения строительства в 1916 году линия привлекала путешественников, писавших о своих приключениях."

 MONUMENT_153_NAME: "Венерн"
 MONUMENT_153_DESC: "§Y $MONUMENT_153_NAME$ §! — самое большое озеро Швеции и третье по величине озеро всей Европы. Озеро образовалось около 10 000 лет назад. Он занимает площадь 5655 квадратных километров и имеет максимальную глубину 106 метров."

 MONUMENT_154_NAME: "Ставкирка в Хеддейле"
 MONUMENT_154_DESC: "§Y $MONUMENT_154_NAME$ §! — деревянная церковь, расположенная в Хеддале, [This.GetName] . Это трехнефная деревянная церковь и самая большая деревянная церковь в Норвегии. Он был построен в начале 13 века. После реформации церковь находилась в очень плохом состоянии, в 1849–1851 годах проходила реставрация. Существует легенда, повествующая о возведении церкви и о том, как ее построил тролль за три дня."

 MONUMENT_155_NAME: "Крепость Бам"
 MONUMENT_155_DESC: "§Y $MONUMENT_155_NAME$ §! , расположенный в городе Бам, [This.GetName] , является самым большим глинобитным зданием в мире. Все здание представляло собой большую крепость. До 1932 года он использовался как гарнизон. В VII веке Бам был хорошо развитым рынком, окруженным обширной сельскохозяйственной территорией. В средние века он извлек выгоду из стратегического положения на маршруте специй, соединяющем регион с Шелковым путем. Город был известен разведением тутового шелкопряда и процветающей шелковой промышленностью."

 MONUMENT_156_NAME: "Нидервальдский памятник"
 MONUMENT_156_DESC: "§Y $MONUMENT_156_NAME$ §! — памятник, расположенный в Нидервальде в [This.GetName] году. Он был построен между 1871 и 1883 годами, его высота составляет 38 метров. §Y $MONUMENT_156_NAME$ §! был построен в ознаменование основания Германской империи в 1871 году после окончания франко-прусской войны. Первый камень был заложен 16 сентября 1871 года кайзером Вильгельмом I."

 MONUMENT_157_NAME: "Ханфорд Сайт"
 MONUMENT_157_DESC: "§Y $MONUMENT_157_NAME$ §! был создан в 1943 году в рамках §Y Манхэттенского проекта §! в Хэнфорде, на юге центральной части [This.GetName] , на этой площадке находился реактор B, первый в мире полномасштабный реактор по производству плутония. Плутоний, произведенный на полигоне, был использован в первой ядерной бомбе, испытанной на полигоне Тринити."

 MONUMENT_158_NAME: "Страсбургский собор"
 MONUMENT_158_DESC: "§Y $MONUMENT_158_NAME$ §! — католический собор в $VICTORY_POINTS_9503$, [This.GetName]. Хотя значительная его часть все еще относится к романской архитектуре, она считается одним из лучших образцов архитектуры районной готики. Строительство собора, начатое в 1015 году и возобновленное в 1190 году, было завершено в 1439 году. §Y $MONUMENT_158_NAME$ §! высотой 142 метра было самым высоким зданием в мире с 1647 по 1874 год."

 MONUMENT_159_NAME: "Такцанг-лакханг"
 MONUMENT_159_DESC: "§Y $MONUMENT_159_NAME$ §! — священное буддийское место, расположенное на склоне скалы в верхней части долины Паро в [This.GetName] году. Более поздний монастырский комплекс был построен в 1692 году вокруг пещеры §Y Такцанг Сенге Самдуп §!, где Гуру Падмасамбхава медитировал и практиковал с учениками перед тем, как покинуть Тибетское королевство в начале 9 века. Храм, посвященный Падмасамбхаве, относится к его восьми проявлениям."

 MONUMENT_160_NAME: "Грум-Лейк"
 MONUMENT_160_DESC: "§Y $MONUMENT_160_NAME$ §! — это строго засекреченный объект ВВС в [This.GetName]. Это открытый полигон, и обычно считается, что он предназначен для разработки и испытаний экспериментальных самолетов и систем вооружения. Во время Второй мировой войны объект был построен и использовался в качестве вспомогательного полевого и бомбардировочного полигона ВВС."

 MONUMENT_161_NAME: "Майдан Дзержинского"
 MONUMENT_161_DESC: "§Y $MONUMENT_161_NAME$ §! — площадь в городе $VICTORY_POINTS_418$. Он был построен с 1926 по 1935 год и назван в честь §Y Феликса Дзержинского §! , основателя большевистской тайной полиции. Площадь площади составляет около 12 гектаров. Примечательной достопримечательностью площади является здание Госпрома, первый советский небоскреб. 13-этажное здание было построено в 1928 году."

 MONUMENT_162_NAME: "Мавзолей Сунь Ятсена"
 MONUMENT_162_DESC: "§Y $MONUMENT_162_NAME$ §! расположен у подножия второй вершины Пурпурной горы в $VICTORY_POINTS_11913$ [This.GetName] . Это могила первого президента §Y Китайской Республики §! . Внутри жертвенного зала находится статуя Сунь Ятсена высотой 4,6 метра. Строительство §Y $MONUMENT_162_NAME$ §! началось в январе 1926 года и завершилось весной 1929 года."

 MONUMENT_163_NAME: "Колонна Независимости"
 MONUMENT_163_DESC: "§Y $MONUMENT_163_NAME$ §! , также известный как §Y Ангел Независимости §! , представляет собой колонну победы на кольцевой развязке на главной улице Пасео де ла Реформа в центре города $VICTORY_POINTS_1965$ . Он был построен в 1910 году в ознаменование столетия со дня начала войны за независимость Мексики. В последующие годы его превратили в мавзолей самым выдающимся героям той войны. Это одна из самых узнаваемых достопримечательностей города, ставшая центром как празднований, так и протестов. Основание колонны четырехугольное, в каждой вершине установлена ​​бронзовая скульптура, символизирующая закон, войну, справедливость и мир. Рядом с колонной находится группа мраморных статуй некоторых героев Войны за независимость. Сама колонна имеет высоту 36 метров и венчает 6,7-метровую статую греческой богини Победы, выполненную из бронзы и покрытую золотом."

 MONUMENT_164_NAME: "Замок Сан-Мигель"
 MONUMENT_164_DESC: "§Y $MONUMENT_164_NAME$ §! — португальский форт в [This.GetName] . Он был построен в 1576 году. На протяжении многих лет форт был автономным городом, защищенным толстыми стенами, инкрустированными пушками."

 MONUMENT_165_NAME: "Церковь Богоматери Муксимы"
 MONUMENT_165_DESC: "§Y $MONUMENT_165_NAME$ §! — церковь в португальском колониальном стиле XVI века. Он был классифицирован как национальный памятник Указом португальской провинции № 2 от 12 января 1924 года и является самым важным местом паломничества в [This.GetName] году."

 MONUMENT_166_NAME: "Королевские дворцы Абомея"
 MONUMENT_166_DESC: "§Y $MONUMENT_166_NAME$ §! — это 12 дворцов, расположенных на площади 40 гектаров в самом центре города Абомей в [This.GetName] . На пике своего развития дворцы могли вместить до 8000 человек. При двенадцати королях, которые правили страной с 1625 по 1900 год, Королевство Дагомея зарекомендовало себя как одно из самых могущественных королевств западного побережья Африки."

 MONUMENT_167_NAME: "Водопад Шют де ла Лобе"
 MONUMENT_167_DESC: "§Y $MONUMENT_167_NAME$ §! расположены примерно в 300 км к юго-западу от $VICTORY_POINTS_2080$ . Специфика водопада обусловлена ​​группировкой ручьев, которые текут по каскадам на расстоянии 1 километра и образуют величественное облако вокруг водопада. Самый высокий водопад имеет высоту 20 метров, а затем падает в Атлантический океан. §Y $MONUMENT_167_NAME$ §! представляют собой прочную основу символических верований народов батанга, мааби и пигмеев, которые живут в окрестностях и связывают водопад с различными культурными обрядами."

 MONUMENT_168_NAME: "Амбухиманга"
 MONUMENT_168_DESC: "§Y $MONUMENT_168_NAME$ §! — холм и традиционное укреплённое королевское поселение в [This.GetName] . Он считается наиболее значимым символом культурной самобытности народа Мерина и самым важным и наиболее хорошо сохранившимся памятником доколониального королевства Мерина. В обнесенной стеной исторической деревне есть резиденции и места захоронений нескольких важных монархов.  §Y $MONUMENT_168_NAME$ §! ассоциируется с сильным чувством национальной идентичности и сохраняет свой духовный и сакральный характер как в ритуальной практике, так и в народном воображении на протяжении как минимум четырехсот лет. Он остается местом поклонения, куда приезжают паломники из [This.GetName] и других мест."

 MONUMENT_169_NAME: "Каменные круги в Сенегамбии"
 MONUMENT_169_DESC: "§Y $MONUMENT_169_NAME$ §! — это крупнейшая в мире концентрация каменных кругов, насчитывающая более 1000 каменных кругов и связанных с ними курганов, расположенных на территории шириной 100 километров и длиной 350 километров вдоль реки Гамбия. Неизвестно, когда были построены эти памятники, но общепринятый диапазон датируется третьим веком до нашей эры. и шестнадцатый век нашей эры. Строительство каменных памятников свидетельствует о процветающем и организованном обществе, основанном на количестве труда, необходимого для строительства таких сооружений."

 MONUMENT_170_NAME: "Гробницы Касуби"
 MONUMENT_170_DESC: "§Y $MONUMENT_170_NAME$ §! является местом захоронения трех кабаков, королей Буганды и других членов королевской семьи Баганда. В результате это место остается важным духовным и политическим объектом для народа Ганда, а также важным примером традиционной архитектуры. Это место является одной из 31 королевской гробницы в королевстве Буганда с момента основания королевства в 13 веке. Традиционно тело умершего короля хоронили в одном месте, с отдельным святилищем для челюстной кости умершего короля, которая, как считалось, содержала его душу."

 MONUMENT_171_NAME: "Вест-Пойнт"
 MONUMENT_171_DESC: "§Y $MONUMENT_171_NAME$ §!, также известная как §Y Военная академия США §!, — военная академия в [This.GetName]. Первоначально он был основан как форт, поскольку расположен на стратегической возвышенности с видом на реку Гудзон. Академия была основана в 1802 году. Ежегодно в нее поступают около 1300 курсантов, из них около 1000 заканчивают обучение."

 MONUMENT_172_NAME: "Триумфальная Арка"
 MONUMENT_172_DESC: "§Y $MONUMENT_172_NAME$ §! — триумфальная арка, расположенная в северной части $VICTORY_POINTS_9617$ . Первая деревянная триумфальная арка была построена в спешке, после обретения Румынией независимости (1878 г.), чтобы под ней могли маршировать победоносные войска. Другая арка с бетонным каркасом и гипсовой внешней поверхностью, состоящей из сложных скульптур и украшений, спроектированных Петре Антонеску, была построена на том же месте после Первой мировой войны в 1922 году. Внешний вид арки, который серьезно обветшал, был заменен в 1935 году нынешним, гораздо более сдержанным неоклассическим дизайном. Новая арка была открыта 1 декабря 1936 года и имеет высоту 27 метров."

 MONUMENT_173_NAME: "Замок Сюри"
 MONUMENT_173_DESC: "§Y $MONUMENT_173_NAME$ §! был замком Рюкюань гусуку в [This.GetName] году. Между 1429 и 1879 годами это был дворец королевства Рюкю. Во время Второй мировой войны Императорская японская армия разместила свой штаб в подземном замке и к началу 1945 года установила сложные линии обороны и коммуникаций в регионе."

 MONUMENT_174_NAME: "Асуанская плотина"
 MONUMENT_174_DESC: "§Y $MONUMENT_174_NAME$ §! — контрфорсная плотина из гравитационной кладки на реке Нил в [This.GetName] году. Первоначально построенный между 1899 и 1902 годами, ничего подобного масштабу никогда не предпринималось; по завершении это была самая большая каменная плотина в мире. Плотина была спроектирована для хранения ежегодных паводковых вод и увеличения стока в засушливый сезон для поддержки более широкого развития ирригации и роста населения в нижнем течении Нила. Плотина, первоначально ограниченная по высоте из соображений сохранения, работала так, как было задумано, но не обеспечивала достаточную вместимость для запланированного строительства и поднималась дважды: в период с 1907 по 1912 год и снова в 1929–1933 годах."

 MONUMENT_175_NAME: "Собор Святого Иакова"
 MONUMENT_175_DESC: "§Y $MONUMENT_175_NAME$ §! — известное место захоронения святого Иакова Великого, одного из апостолов Иисуса Христа. Это также одна из трех сохранившихся церквей в мире, построенных на могиле апостола. Исторически он был местом паломничества на Пути Святого Иакова со времен раннего средневековья и знаменует собой традиционный конец паломнического маршрута. Здание представляет собой романскую постройку с пристройками в стиле поздней готики и барокко."

 MONUMENT_176_NAME: "Кёльнский собор"
 MONUMENT_176_DESC: "§Y $MONUMENT_176_NAME$ §! — католический собор в $VICTORY_POINTS_587$ [This.GetName] году. На данный момент это самая высокая церковь с двумя шпилями в мире высотой 157 метров. Это известный памятник немецкого католицизма и готической архитектуры. Это резиденция архиепископа Кельна и администрации Кельнской архиепархии. Строительство §Y $MONUMENT_176_NAME$ §! началось в 1248 году, но было остановлено около 1560 года и не было завершено. Работы возобновлялись только в 1840-х годах, а в 1880 году здание было завершено по первоначальному средневековому плану."

 MONUMENT_177_NAME: "Московский Кремль"
 MONUMENT_177_DESC: "§Y $MONUMENT_177_NAME$ §! — укрепленный комплекс в центре $VICTORY_POINTS_6380$, основанный российской правящей династией Рюриковичей. Внутри этого комплекса находится Большой Кремлевский дворец, бывший царской московской резиденцией. Сейчас комплекс служит официальной резиденцией политического лидера."

 MONUMENT_178_NAME: "Монастыри Метеоры"
 MONUMENT_178_DESC: "§Y $MONUMENT_178_NAME$ §! — это группа восточно-православных монастырей в §Y Метеоре §!, скальном образовании в [This.GetName]. На пике своего развития в 16 веке здесь было 24 монастыря, сегодня 6 из них все еще функционируют, а остальные в основном находятся в руинах. Большая часть архитектуры §Y $MONUMENT_178_NAME$ §! имеет афонское происхождение. Расположенные на высоких скалах, до них теперь можно добраться по лестницам и тропинкам, прорубленным в скальных образованиях в 1920-х годах."

 MONUMENT_179_NAME: "Штаб-квартира ООН"
 MONUMENT_179_DESC: "§Y $MONUMENT_179_NAME$ §! — это комплекс, спроектированный советом архитекторов под руководством Уоллеса Харрисона, а окончательные проекты разработаны Оскаром Нимейером и Ле Корбюзье. Комплекс служил официальной штаб-квартирой §Y Организации Объединенных Наций §! с момента его завершения в 1951 году. В §Y $MONUMENT_179_NAME$ §! располагаются главные органы §Y Организации Объединенных Наций §! , включая §Y Генеральную Ассамблею §! и §Y Совет Безопасности §! ."

 MONUMENT_180_NAME: "Кафедральный собор Уппсалы"
 MONUMENT_180_DESC: "§Y $MONUMENT_180_NAME$ §! — собор, расположенный в центре Уппсалы, [This.GetName] . Церковь Шведской церкви, национальной церкви, в лютеранской традиции, §Y $MONUMENT_180_NAME$ §! является резиденцией архиепископа Упсалы, предстоятеля Швеции. Это также место захоронения короля Эрика IX (ок. 1120–1160, годы правления 1156–1160), который стал покровителем нации, и традиционное место коронации новых королей Швеции.  §Y $MONUMENT_180_NAME$ §! датируется концом 13 века и имеет высоту 118,7 метра и является самой высокой церковью в скандинавских странах."

 MONUMENT_181_NAME: "Чумная колонна"
 MONUMENT_181_DESC: "§Y $MONUMENT_181_NAME$ §! — памятник на главной площади города Марибор, [This.GetName], воздвигнутый «благочестивыми горожанами» в знак благодарности за окончание эпидемии чумы 1680 года, унесшей жизни трети населения города. Первоначальный памятник был построен в 1681 году, нынешний памятник построен в 1743 году. §Y $MONUMENT_181_NAME$ §! полностью выполнен из белого мрамора и состоит из богато украшенного прямоугольного постамента, поддерживающего коринфскую колонну с позолоченной статуей Девы Марии, увенчанной двенадцатью звездами и стоящей на луне. У основания колонну окружают статуи шести святых."

 MONUMENT_182_NAME: "Южный канал"
 MONUMENT_182_DESC: "§Y $MONUMENT_182_NAME$ §! — канал длиной 240 километров в [This.GetName] . Первоначально названный §Y Королевским каналом в Лангедоке §! и переименованный французскими революционерами в §Y $MONUMENT_182_NAME$ §! в 1789 году, канал считается одним из величайших строительных сооружений 17 века. Он соединяет Средиземное море и Атлантический океан с помощью §Y Гароннского канала §! ."
