 # Game Rules:
 MONUMENTS_GAME_RULES_GROUP: "Правила игры «Памятники в стиле EU4»"
 MONUMENTS_GAME_RULE_LANDMARK_MONUMENTS: "Знаковые памятники"
 MONUMENTS_GAME_RULE_LANDMARK_MONUMENTS_ENABLED: "Включено"
 MONUMENTS_GAME_RULE_LANDMARK_MONUMENTS_ENABLED_DESC: "Памятники, существующие как §Y Достопримечательности §!, по-прежнему будут существовать как памятники. Они не связаны друг с другом, то есть достопримечательность может быть разрушена, а одноименный памятник — нет, и наоборот. Их включение приведет к тому, что страны смогут получать бонусы как от достопримечательности, так и от памятника одновременно."
 MONUMENTS_GAME_RULE_LANDMARK_MONUMENTS_DISABLED: "Неполноценный"
 MONUMENTS_GAME_RULE_LANDMARK_MONUMENTS_DISABLED_DESC: "Памятники, существующие как §Y Достопримечательности §!, удаляются. Вместо них используются только ориентиры."
 MONUMENTS_GAME_RULE_BONUS_TARGET: "Бонус к памятнику и цель строительства"
 MONUMENTS_GAME_RULE_BONUS_TARGET_OWNER: "Государственный владелец"
 MONUMENTS_GAME_RULE_BONUS_TARGET_OWNER_DESC: "Памятники могут строить и улучшать только владельцы памятников, а бонусы от них применяются только к §G владельцу §! штата. Владелец также должен контролировать государство.  \n §Y Присоединение §! к государству, имеющему памятник, приведет к понижению статуса памятника или его уничтожению, если памятник не является памятником природы."
 MONUMENTS_GAME_RULE_BONUS_TARGET_CONTROLLER: "Государственный контролер"
 MONUMENTS_GAME_RULE_BONUS_TARGET_CONTROLLER_DESC: "Памятники могут быть построены и улучшены, а бонусы от памятников применяются к §G контролеру §! штата.  \n §Y Взятие под контроль §! штата, в котором имеется памятник, приведет к понижению статуса памятника или его уничтожению, если памятник не является памятником природы.  \n \n §Y Это правило игры приведет к более быстрой смене «владельцев» памятников, что позволит быстрее использовать памятники за пределами начальных состояний. Однако потенциально это также приведет к более частому понижению статуса памятников. §!"
 MONUMENTS_GAME_RULE_COUNTRY_RESTRICTION: "Ограничение по стране памятника"
 MONUMENTS_GAME_RULE_COUNTRY_RESTRICTION_YES: "Ограниченный"
 MONUMENTS_GAME_RULE_COUNTRY_RESTRICTION_YES_DESC: "Многие памятники должны принадлежать определенной стране или группе определенных стран, чтобы использовать их бонусы и/или строить их."
 MONUMENTS_GAME_RULE_COUNTRY_RESTRICTION_NO: "Не ограничено"
 MONUMENTS_GAME_RULE_COUNTRY_RESTRICTION_NO_DESC: "Почти все памятники, которые обычно требуют, чтобы они принадлежали определенной стране или группе определенных стран, чтобы использовать их бонусы и/или строить их, больше НЕ требуют этого. Это означает, что почти все памятники могут использоваться любой страной, если она находится в их собственности или под контролем.  \n \n §Y Это правило игры приведет к тому, что страны смогут получить гораздо больше бонусов, чем первоначально предполагалось, а это означает, что это может привести к тому, что некоторые страны станут намного сильнее, чем хотелось бы.  \n Используйте это правило осторожно и учтите, что оно может привести к очень несбалансированной игре! §!"
 MONUMENTS_GAME_RULE_COSTS: "Базовая стоимость памятников"
 MONUMENTS_GAME_RULE_COSTS_REDUCED_BY_50: "§G -50,0% §!"
 MONUMENTS_GAME_RULE_COSTS_REDUCED_BY_50_DESC: "Базовая стоимость строительства и улучшения памятников изменена на §Y -50,0% §! .  \n Хотя это изменение стоимости также влияет на ИИ, порог, требующий не менее §Y 300 §! £pol_power£ (базовое значение, его можно изменить с помощью другого правила игры) для строительства или улучшения любого памятника, по-прежнему применяется."
 MONUMENTS_GAME_RULE_COSTS_NORMAL: "Нормальный"
 MONUMENTS_GAME_RULE_COSTS_NORMAL_DESC: "Базовая стоимость строительства и улучшения памятников не изменилась. Оставьте этот вариант, если вы не хотите уменьшать или увеличивать стоимость по соображениям баланса."
 MONUMENTS_GAME_RULE_COSTS_INCREASED_BY_50: "§R +50,0% §!"
 MONUMENTS_GAME_RULE_COSTS_INCREASED_BY_50_DESC: "Базовая стоимость строительства и улучшения памятников изменяется на §Y +50,0% §! .  \n Хотя это изменение стоимости также влияет на ИИ, порог, требующий не менее §Y 300 §! £pol_power£ (базовое значение, его можно изменить с помощью другого правила игры) для строительства или улучшения любого памятника, по-прежнему применяется."
 MONUMENTS_GAME_RULE_COSTS_INCREASED_BY_100: "§R +100,0% §!"
 MONUMENTS_GAME_RULE_COSTS_INCREASED_BY_100_DESC: "Базовая стоимость строительства и улучшения памятников изменяется на §Y +100,0% §! .  \n Хотя это изменение стоимости также влияет на ИИ, порог, требующий не менее §Y 300 §! £pol_power£ (базовое значение, его можно изменить с помощью другого правила игры) для строительства или улучшения любого памятника, по-прежнему применяется."
 MONUMENTS_GAME_RULE_COSTS_AI: "ИИ £pol_power£ Стоимость"
 MONUMENTS_GAME_RULE_COSTS_AI_ENABLED: "Включено"
 MONUMENTS_GAME_RULE_COSTS_AI_ENABLED_DESC: "Строительство и улучшение памятников обходится каждому в £pol_power£.  \n \n §O Значение, указанное в правиле игры « §Y $MONUMENTS_GAME_RULE_AI_MONUMENTS_PP_THRESHOLD$ §! », определяет, когда ИИ рассмотрит возможность инвестирования в памятники. §!"
 MONUMENTS_GAME_RULE_COSTS_AI_DISABLED: "Неполноценный"
 MONUMENTS_GAME_RULE_COSTS_AI_DISABLED_DESC: "Нациям ИИ не нужно платить £pol_power£ за строительство и модернизацию памятников, это делают только игроки-люди.  \n \n §Y Это даст странам ИИ возможность модернизировать и строить памятники с самого начала и без каких-либо ограничивающих факторов, таких как законы и министры, что сделает их сильнее. §! \n \n §O Указанное значение в правиле игры ' §Y $MONUMENTS_GAME_RULE_AI_MONUMENTS_PP_THRESHOLD$ §! ' игнорируется. §!"
 MONUMENTS_GAME_RULE_AI_MONUMENTS_PP_THRESHOLD: "Порог AI £pol_power£"
 MONUMENTS_GAME_RULE_AI_MONUMENTS_PP_THRESHOLD_100: "§Y 100 §! £pol_power£"
 MONUMENTS_GAME_RULE_AI_MONUMENTS_PP_THRESHOLD_100_DESC: "Страны ИИ будут инвестировать в памятники, когда у них будет более §Y 100 §! £pol_power£.  \n \n §O Это может привести к тому, что ИИ будет пренебрегать другими вещами, такими как советники и законы. §!"
 MONUMENTS_GAME_RULE_AI_MONUMENTS_PP_THRESHOLD_200: "§Y 200 §! £pol_power£"
 MONUMENTS_GAME_RULE_AI_MONUMENTS_PP_THRESHOLD_200_DESC: "Страны ИИ будут инвестировать в памятники, когда у них будет более §Y 200 §! £pol_power£.  \n \n §O Это может привести к тому, что ИИ будет пренебрегать другими вещами, такими как советники и законы. §!"
 MONUMENTS_GAME_RULE_AI_MONUMENTS_PP_THRESHOLD_300: "§Y 300 §! £pol_power£"
 MONUMENTS_GAME_RULE_AI_MONUMENTS_PP_THRESHOLD_300_DESC: "Страны ИИ будут инвестировать в памятники, когда у них будет более §Y 300 §! £pol_power£."
 MONUMENTS_GAME_RULE_AI_MONUMENTS_PP_THRESHOLD_400: "§Y 400 §! £pol_power£"
 MONUMENTS_GAME_RULE_AI_MONUMENTS_PP_THRESHOLD_400_DESC: "Страны ИИ будут инвестировать в памятники, когда у них будет более §Y 400 §! £pol_power£.  \n \n §O Это может привести к тому, что ИИ вообще будет очень редко инвестировать в памятники. §!"
 MONUMENTS_GAME_RULE_AI_MONUMENTS_PP_THRESHOLD_500: "§Y 500 §! £pol_power£"
 MONUMENTS_GAME_RULE_AI_MONUMENTS_PP_THRESHOLD_500_DESC: "Страны ИИ будут инвестировать в памятники, когда у них будет более §Y 500 §! £pol_power£.  \n \n §O Это может привести к тому, что ИИ вообще будет очень редко инвестировать в памятники. §!"

