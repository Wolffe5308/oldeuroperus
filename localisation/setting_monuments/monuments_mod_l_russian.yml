 GLOBAL_MONUMENTS_HELP_HEADER: "Помощь"
 GLOBAL_MONUMENTS_HELP_TEXT: "§Y Памятники §! \n Памятники расположены в определенных штатах. В штате может быть несколько памятников, а памятник может находиться только в одном штате. Памятники дают владельцу §C §! штата, в котором они находятся, особые бонусы, если он соответствует требованиям памятника.  \n \n §Y Типы памятников §! \n Памятники бывают двух типов: §Y $GLOBAL_MONUMENTS_TYPE_ARCHITECTURE$ §! и §Y $GLOBAL_MONUMENTS_TYPE_NATURE$ §! .  $MONUMENT_NATURE_TT_DELAYED$ \n \n §Y Уровни §! \n Каждый памятник имеет один из четырех возможных уровней: \n - §C $MONUMENT_LEVEL_NAME_DESTROYED$ §! / §C $MONUMENT_LEVEL_NAME_NOT_BUILT$ §! ( __29§Y30__ ) \n - §C $MONUMENT_LEVEL_NAME_NOTEWORTHY$ §! ( __35§!36__ ) \n - §C $MONUMENT_LEVEL_NAME_SIGNIFICANT$ §! ( __41\n42__ ) \n - §C $MONUMENT_LEVEL_NAME_MAGNIFICIENT$ §! ( __47§C48__ ) \n Каждый уровень дает более сильные бонусы, чем предыдущий. Уровень __50§Y51__ обычно не дает никаких бонусов.  \n \n §Y Строительство и модернизация §! \n Если владелец соответствует требованиям памятника, он может его построить или модернизировать. Это стоит £pol_power£ §Y $POLITICAL_POWER$ §! и требует времени, оба могут различаться в зависимости от самого памятника, а также его уровня и модификаторов штата или страны, а также от того, является ли государство ядром его владельца или нет.  \n Незавершенное строительство или модернизация называется §Y строительство §! и отображается в интерфейсе §Y $STATE_MONUMENTS_HEADER$ §!, в §Y $GLOBAL_MONUMENTS_CONSTANT$ §! и на вкладке решений. В первых двух случаях его можно отменить вручную или отменить автоматически, если владелец потеряет право собственности или контроль над государством или перестанет выполнять требования памятника.  \n В стране одновременно может быть максимум __70\n71__ памятников.  \n \n §Y $GLOBAL_MONUMENTS_CONSTANT$ §! \n В этом окне показаны все памятники, существующие на данный момент на карте, и содержится много информации о каждом из них. К ним относятся изображение, имя, описание, состояние, в котором оно находится, а также его владелец, его уровень, статус и его эффекты. Некоторую из этой информации, а также требования к бонусам можно увидеть, наведя курсор на изображение.  \n Он также включает в себя множество параметров фильтра, позволяющих отфильтровать большой список всех памятников и выбрать именно те, которые вы хотите посмотреть. Закрытие §Y $GLOBAL_MONUMENTS_CONSTANT$ §! сбрасывает фильтр выбранной страны на вашу.  \n Для быстрого сброса всех фильтров можно воспользоваться кнопкой §Y $GLOBAL_MONUMENTS_RESET_TEXT$ §!.  \n Из соображений производительности окно не обновляется постоянно, однако оно обновляется каждый раз при нажатии кнопки внутри него или при изменении памятников (например, если они теряют или получают уровень).  \n \n §Y Особые памятники §! \n Хотя они функционируют точно так же, как и все другие памятники, они особенны в одном: они не существуют в начале игры, а переводятся в определенное состояние посредством решения. Это относится к памятникам, которые технически не соответствуют временным рамкам обычной игры (например, §Y $MONUMENT_63_NAME$ §! ) или памятникам, которые в действительности никогда не существовали, но были запланированы некоторыми странами (например, §Y $MONUMENT_28_NAME$ §! и §Y $MONUMENT_64_NAME$ §! ).  \n \n §Y Использование ИИ §! \n Нации ИИ получают бонусы от памятников так же, как и игроки-люди. А еще они будут строить и модернизировать памятники; однако, чтобы гарантировать, что они будут в первую очередь уделять приоритетное внимание другим вещам (например, изменению законов), странам ИИ необходимо иметь как минимум §Y [?global.ai_monuments_pp_threshold?300|0] §! £pol_power£, чтобы рассмотреть возможность инвестирования в памятники. \n"

