 # Events:
 monuments_events.EVTNAME1: "Судьба $MONUMENT_79_NAME$"
 monuments_events.EVTDESC1: "Мы захватили $VICTORY_POINTS_9764$, а вместе с ним и $MONUMENT_79_NAME$. Религии нет места в нашем государстве, поэтому мы должны сжечь ее!"
 monuments_events1.EVTOPT1: "Сожгите его! Сожгите его дотла!"
 monuments_events1.EVTOPT2: "Сожгите фасад и планы внутри!"
 monuments_events1.EVTOPT3: "Возможно, оно еще может нам пригодиться..."

 monuments_events.EVTNAME2: "Ускоренное строительство"
 monuments_events.EVTDESC2: "Строительство памятника в [monument_construction_state.GetName] идет гораздо быстрее, чем мы изначально планировали. Они могут быть закончены раньше графика."
 monuments_events2.EVTOPT1: "Очень хороший."

 monuments_events.EVTNAME3: "Национальный фокус на памятниках?"
 monuments_events.EVTDESC3: "Люди в наших странах требуют уделять больше внимания памятникам и их содержанию. Некоторые промышленные предприятия были бы готовы предоставить средства в обмен на некоторые услуги..."
 monuments_events3.EVTOPT1: "Звучит как хороший план..."
 monuments_events3.EVTOPT2: "Одолжение? Больше похоже на коррупцию."

 monuments_events.EVTNAME4: "Региональный фокус на памятниках?"
 monuments_events.EVTDESC4: "Жители [monument_reduction_state.GetName] требуют уделять больше внимания памятникам и их содержанию. Некоторые промышленные предприятия были бы готовы предоставить средства в обмен на некоторые услуги..."
 monuments_events4.EVTOPT1: "Звучит как хороший план..."
 monuments_events4.EVTOPT2: "Одолжение? Больше похоже на коррупцию."

 monuments_events.EVTNAME5: "Задержка строительства в [monument_construction_state.GetName]"
 monuments_events.EVTDESC5: "Строительство памятника в [monument_construction_state.GetName] страдает от забастовок рабочих. Либо нам придется отложить дату завершения, либо нам нужно решить эту проблему сейчас."
 monuments_events5.EVTOPT1: "Мы не можем позаботиться об этом прямо сейчас."
 monuments_events5.EVTOPT2: "Улучшить условия труда."

 monuments_events.EVTNAME10: "$MONUMENT_79_NAME$ уничтожено"
 monuments_events.EVTDESC10: "После того, как [From.GetNameDef] завоевал $VICTORY_POINTS_9764$ , они разграбили $MONUMENT_79_NAME$ и сожгли его дотла. Величественная церковь сейчас лежит в руинах."
 monuments_events10.EVTOPT1: "Как они посмели сделать такое со святым зданием?"
 monuments_events10.EVTOPT2: "Религия имела свое время, и теперь оно закончилось!"

 monuments_events.EVTNAME11: "$MONUMENT_79_NAME$ поврежден"
 monuments_events.EVTDESC11: "После того, как [From.GetNameDef] завоевал $VICTORY_POINTS_9764$, они разграбили $MONUMENT_79_NAME$ и сожгли его переднюю часть. Планы его будущего строительства также были разрушены."
 monuments_events11.EVTOPT1: "Как они посмели сделать такое со святым зданием?"
 monuments_events11.EVTOPT2: "У религии было свое время, они сделали добро."

 monuments_events.EVTNAME12: "Процветание в [This.GetNameDef]"
 monuments_events.EVTDESC12: "Наша нация процветает. Наш народ счастлив, а страна стабильна. Ситуация в [state_target.GetName] даже лучше, чем в других наших штатах."
 monuments_events12.EVTOPT1: "Какой приятный сюрприз!"

