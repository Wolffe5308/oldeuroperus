l_russian:

 hashashin.1.t:0 "Тайное вторжение"
 hashashin.1.desc:0 "Властные бандиты, управляющие [FROM.GetNameDef], потребовали от нас немедленно сдать им нашу территорию под угрозой войны. Нельзя сказать, что мы удивлены таким решением [FROM.GetAdjective] стервятников, но это не делает нашу ситуацию менее опасной. \n \n Мы должны решить, готовы ли мы отдать нашу землю [FROM.GetAdjective] в надежде избежать войны или же мы готовы попытаться навсегда вернуть [FROM.GetNameDef] в анналы истории, где они должны были остаться."
 hashashin.1.a:0 "Это не стоит того, чтобы бороться."
 hashashin.1.b:0 "Давно пора окончательно уничтожить убийц."

 hashashin.2.t:0 "[FROM.GetNameDefCap] Отказывает нам!"
 hashashin.2.desc:0 "Дураки в [FROM.GetNameDef] отвергли наше вполне разумное требование вернуть нашу бывшую территорию законному владельцу. Это оставляет нам только один вариант действий: война!"
 hashashin.2.a:0 "Их наглость будет встречена нашими ятаганами."
 
 hashashin.3.t:0 "Наши территории – наши!"
 hashashin.3.desc:0 "Слабаки [FROM.GetNameDef] продемонстрировали некоторую нехарактерную мудрость, приняв решение вернуть нам наши Земли без необходимости применения насилия."
 hashashin.3.a:0 "Добро пожаловать обратно в Империю!"

 hashashin.4.t:0 "Наш Повелитель отвергает нас"
 hashashin.4.desc:0 "Наш Повелитель продемонстрировал некоторую нехарактерную мудрость, приняв решение не возвращать наши Земли."
 hashashin.4.a:0 "неприемлемо"

 hashashin.5.t:0 "Запрос на Гилан"
 hashashin.5.desc:0 "Хашаши нужно больше земель, чтобы увеличить свою власть и экономику."
 hashashin.5.a:0 "Пожертвуйте нашему союзнику"
 hashashin.5.b:0 "Нет!"
 
