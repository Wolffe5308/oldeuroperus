 hashashin.6.desc:0 "Хашаши нужно больше земель, чтобы увеличить свою власть и экономику."
 hashashin.6.a:0 "Пожертвуйте нашему союзнику"
 hashashin.6.b:0 "Нет!"
 
 hashashin.7.t:0 "Запрос Грузии"
 hashashin.7.desc:0 "Хашаши нужно больше земель, чтобы увеличить свою власть и экономику."
 hashashin.7.a:0 "Пожертвуйте нашему союзнику"
 hashashin.7.b:0 "Нет!"

 hashashin.8.t:0 "Запрос Армении"
 hashashin.8.desc:0 "Хашаши нужно больше земель, чтобы увеличить свою власть и экономику."
 hashashin.8.a:0 "Пожертвуйте нашему союзнику"
 hashashin.8.b:0 "Нет!"

 hashashin.9.t:0 "Запрос на Тибриз"
 hashashin.9.desc:0 "Хашаши нужно больше земель, чтобы увеличить свою власть и экономику."
 hashashin.9.a:0 "Пожертвуйте нашему союзнику"
 hashashin.9.b:0 "Нет!"

 hashashin.10.t:0 "§W Предложение Альянса!"
 hashashin.10.desc:0 "Австрия предлагает нам союз. Вместе мы создадим мощный политический блок, способный поддерживать наших соседей."
 hashashin.10.a:0 "Мы согласны."
 hashashin.10.b:0 "Мы не присоединяемся"

 hashashin_news.1.a:0 "Мы сильнее вместе"
 hashashin_news.1.t:0 "§W Запрос принят"
 hashashin_news.1.d:0 "Важным событием является то, что давно ожидаемый запрос на стратегическое партнерство был официально принят, что ознаменовало новую эру сотрудничества между двумя сторонами. После нескольких месяцев переговоров обе стороны достигли взаимного соглашения, открыв путь для совместных инициатив, которые, как ожидается, принесут пользу многим секторам."

 hashashin_news.2.a:0 "У нас появились новые враги"
 hashashin_news.2.t:0 "§W Запрос отклонен"
 hashashin_news.2.d:0 "Неожиданным шагом стало то, что долгожданная просьба о стратегическом партнерстве была официально отклонена, в результате чего обе стороны оказались в тупике. Источники, близкие к переговорам, сообщили, что, несмотря на месяцы обсуждений и ожиданий, ключевые условия не удалось согласовать, что в конечном итоге привело к решению выйти из сделки."
