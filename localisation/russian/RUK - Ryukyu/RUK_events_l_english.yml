l_english:

  ryukyu.1.t:0 "The Pirate Coup"
  ryukyu.1.d:0 "For years, the pirate captains of the Ryukyuan Islands have grown wealthier and more influential than the royal court itself. Under the cover of darkness, their fleets entered the capital, while armed crews stormed the royal palace and government offices. The king, his ministers, and the island assembly were slaughtered before they could organize any resistance.\n\nAt dawn, the black banners of the pirate captains flew above Shuri Castle. Declaring the old dynasty corrupt and weak, the captains abolished the monarchy and proclaimed the birth of a new state—the Pirate Republic of Ryukyu. From this day forward, the seas, not the throne, shall determine the fate of the islands."
  ryukyu.1.a:0 "Long live the Pirate Republic!"

  ryukyu.2.t:0 "The Colonization of Saipan"
  ryukyu.2.d:0 "After a long voyage across the eastern seas, Ryukyuan settlers have reached the island of Saipan. Fishermen, merchants, farmers, and sailors have begun constructing permanent villages and a sheltered harbor. With the Ryukyuan banner raised above the new settlement, Saipan has become our first colony in the distant Pacific."
  ryukyu.2.a:0 "Establish the Saipan Colony"  

  ryukyu.3.t:0 "The Colonization of Guam"
  ryukyu.3.d:0 "Ryukyuan navigators have successfully crossed the open Pacific and established a permanent settlement on the island of Guam. New fishing villages, trading posts, and a sheltered harbor have been founded, allowing Ryukyu to strengthen its maritime presence and expand its influence across the western Pacific."
  ryukyu.3.a:0 "Establish the Guam Colony"

  ryukyu.4.t:0 "Ryukyuan Pirates Raid Our Port"
  ryukyu.4.d:0 "Before dawn, a fleet of Ryukyuan pirate vessels descended upon one of our busiest ports. Merchant ships were looted, warehouses were set ablaze, and valuable cargo was carried away before the raiders disappeared over the horizon."
  ryukyu.4.a:0 "The pirates have escaped."

  ryukyu.5.t:0 "A Devastatingly Successful Raid"
  ryukyu.5.d:0 "Our pirate fleet encountered little meaningful resistance during its assault. The port was overwhelmed, its warehouses emptied, and several merchant vessels captured. Our ships have returned heavily laden with treasure, supplies, and prisoners. Tales of this victory have spread throughout the islands, greatly strengthening the reputation of the Pirate Republic."
  ryukyu.5.a:0 "A magnificent haul!"

  ryukyu.6.t:0 "A Successful Pirate Raid"
  ryukyu.6.d:0 "Our pirates successfully struck the enemy port and escaped before a coordinated defense could be organized. Although some resistance was encountered, our crews returned with captured goods, weapons, and valuable cargo."
  ryukyu.6.a:0 "The raid was profitable."

  ryukyu.7.t:0 "A Limited Pirate Raid"
  ryukyu.7.d:0 "The enemy's defenses proved stronger than expected. Our pirates managed to seize some cargo and escape, but several vessels were damaged and the profits were limited. Nevertheless, the fleet returned without suffering a complete defeat."
  ryukyu.7.a:0 "At least they returned."
  