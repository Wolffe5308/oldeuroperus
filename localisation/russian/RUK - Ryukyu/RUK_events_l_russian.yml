l_russian:

  ryukyu.1.t:0 "Пиратский переворот"
  ryukyu.1.d:0 "За последние годы пиратские капитаны островов Рюкю стали богаче и влиятельнее, чем сам королевский двор. Под покровом темноты их флоты вошли в столицу, а вооруженные экипажи штурмовали королевский дворец и правительственные учреждения. Король, его министры и собрание острова были убиты прежде, чем смогли организовать какое-либо сопротивление. \n \nНа рассвете над замком Сюри развевались черные знамена пиратских капитанов. Объявив старую династию коррумпированной и слабой, капитаны отменили монархию и провозгласили рождение нового государства — Пиратской Республики Рюкю. С этого дня море, а не трон, будут определять судьбу островов."
  ryukyu.1.a:0 "Да здравствует Пиратская Республика!"

  ryukyu.2.t:0 "Колонизация Сайпана"
  ryukyu.2.d:0 "После долгого путешествия по восточным морям поселенцы Рюкю достигли острова Сайпан. Рыбаки, торговцы, фермеры и моряки начали строить постоянные деревни и защищенную гавань. С знаменем Рюкю, поднятым над новым поселением, Сайпан стал нашей первой колонией в далеком Тихом океане."
  ryukyu.2.a:0 "Основание колонии Сайпан"

  ryukyu.3.t:0 "Колонизация Гуама"
  ryukyu.3.d:0 "Рюкюанские мореплаватели успешно пересекли открытый Тихий океан и основали постоянное поселение на острове Гуам. Были основаны новые рыбацкие деревни, торговые посты и защищенная гавань, что позволило Рюкю укрепить свое морское присутствие и расширить свое влияние на западную часть Тихого океана."
  ryukyu.3.a:0 "Основание колонии Гуам"

  ryukyu.4.t:0 "Пираты Рюкю совершают набег на наш порт"
  ryukyu.4.d:0 "Перед рассветом флот пиратских судов Рюкю зашел в один из наших самых загруженных портов. Торговые суда были разграблены, склады подожжены, а ценные грузы унесены прежде, чем рейдеры скрылись за горизонтом."
  ryukyu.4.a:0 "Пираты скрылись."

  ryukyu.5.t:0 "Невероятно успешный рейд"
  ryukyu.5.d:0 "Наш пиратский флот во время нападения не встретил серьезного сопротивления. Порт был захвачен, его склады опустели, несколько торговых судов захвачены. Наши корабли вернулись с грузом сокровищ, припасов и пленников. Слухи об этой победе распространились по островам, значительно укрепив репутацию Пиратской Республики."
  ryukyu.5.a:0 "Великолепный улов!"

  ryukyu.6.t:0 "Успешный пиратский рейд"
  ryukyu.6.d:0 "Наши пираты успешно нанесли удар по порту противника и скрылись, прежде чем удалось организовать скоординированную оборону. Несмотря на некоторое сопротивление, наши экипажи вернулись с трофейными товарами, оружием и ценным грузом."
  ryukyu.6.a:0 "Рейд был прибыльным."

  ryukyu.7.t:0 "Неудачный пиратский рейд"
  ryukyu.7.d:0 "Оборона противника оказалась сильнее, чем ожидалось. Нашим пиратам удалось захватить часть груза и уйти, но несколько судов были повреждены, а общая прибыль мизерна. Тем не менее флот вернулся, не потерпев разгромного поражения."
  ryukyu.7.a:0 "По крайней мере, они вернулись."
  