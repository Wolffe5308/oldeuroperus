l_russian:

 bht.1.t:0 "Наварра требует Шампань"
 bht.1.desc:0 "Недавно Наварра направила посла с требованием отдать им нашу провинцию Шампань. Они заявляют о родстве и законном наследовании, но мы знаем, что все эти заявления сфабрикованы. Как мы должны реагировать?"
 bht.1.a:0 "Они правы, дайте им Шампань."
 bht.1.b:0 "Отрубите посланнику голову!"

 bht.2.t:0 "Франция казнит посланника"
 bht.2.desc:0 "Франция казнила нашего посланника, которого мы отправили с требованием выдать нам Шампань. Мы должны объявить им войну!"
 bht.2.a:0 "Начинайте подготовку!"
 
 bht.3.t:0 "Требование испанских территорий"
 bht.3.desc:0 "Бандиты из правительства [FROM.GetNameDef] потребовали, чтобы мы немедленно передали им нашу территорию под угрозой войны.\n\n Мы должны решить, готовы ли мы отдать нашу землю властям [FROM.GetAdjective] в надежде избежать войны или мы постараемся загнать [FROM.GetNameDef] в ту яму, из которой они выбрались"
 bht.3.a:0 "Зачем умирать за испанские замки?"
 bht.3.b:0 "Пора окончательно покончить с их гегемонией."

 bht.4.t:0 "[FROM.GetNameDefCap] отказывают нам!"
 bht.4.desc:0 "Дураки из [FROM.GetNameDef] отвергли наше совершенно разумное требование вернуть территорию ее законному владельцу. Это оставляет нам только один выход: война!"
 bht.4.a:0 "Они пожалеют о своем решении."
 
 bht.5.t:0 "Возвращение территорий"
 bht.5.desc:0 "Слабаки из [FROM.GetNameDef] продемонстрировали нехарактерную мудрость в своем решении вернуть нам наши земли без применения насилия."
 bht.5.a:0 "С возвращением в родную гавань!" 
