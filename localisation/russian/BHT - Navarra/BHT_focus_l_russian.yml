  BHT_14:0 "Шампанское наследство"
  BHT_14_desc:0 "Жанну и аристократов Шампани многое связывает. Муж готов уступить регион любимой."

  BHT_15:0 "Присяга на верность Франции"
  BHT_15_desc:0 "После развития Наварры пришло время присягнуть на верность Франции и присоединиться к ней. Это поможет Франции одержать победу."

  BHT_16:0 "Шампанское наследство"
  BHT_16_desc:0 "Жанну и аристократов Шампани многое связывает. Французы не посмеют отказать вернуть регион легитимной правительнице."

  BHT_18:0 "Подготовка армии"
  BHT_18_desc:0 ""

  BHT_19:0 "Наёмники"
  BHT_19_desc:0 "Небольшим странам тяжело собрать большое войско. Хорошо, что есть наёмники"

