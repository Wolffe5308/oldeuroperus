  BHT_29:0 "Королева Испании"
  BHT_29_desc:0 "Теперь, после захвата земель, Жанна станет королевой Испании. Своим первым указом станет введение максимальной централизации в стране, чтобы полностью контролировать ситуацию на землях короны."

