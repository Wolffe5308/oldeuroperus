l_russian:

  BHT_1:0 "Выбор Жанны"
  BHT_1_desc:0 "Жанна, жена короля Франции Филиппа IV, стоит перед выбором. Либо предать своего мужа в трудную минуту, либо остаться верной и служить ради будущего Франции."

  BHT_2:0 "Семья это главное"
  BHT_2_desc:0 "Выбор очевиден. Жена должна быть верна мужу, и она будет. Ради семьи, Франции и будущего"

  BHT_3:0 "Предать мужа"
  BHT_3_desc:0 "Очевидный выбор для опытный правительницы. Зачем нам Франция, если можно возвысить Наварру?"

