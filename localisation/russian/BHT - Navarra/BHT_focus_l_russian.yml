  BHT_40:0 "Объединенная Иберия"
  BHT_40_desc:0 "Наконец-то, спустя много веков, Иберия вновь объединена в единое государство. Пришло время ввести единый свод законов для поддержания контроля над провинциями."

  BHT_41:0 "Изгнать Тамплиеров из Иберии"
  BHT_41_desc:0 ""

  BHT_44:0 "Вернуться к Своему мужу"
  BHT_44_desc:0 "Теперь, когда Наварра стала сильнее, чем когда-либо, она может противостоять Франции на равных."

  BHT_45:0 "Изгнать англичан с континента"
  BHT_45_desc:0 "Нельзя допустить, чтобы англичане распространяли свою гниль по континенту, мы загоним их обратно на свои острова!"

  BHT_46:0 "Объединение Иберии и Франции"
  BHT_46_desc:0 "После стольких войн семья снова вместе, под властью одного государства. Пришло время укрепить и объединить две страны."

