  BHT_42_desc:0 "Для эффективного и стабильного управления обширными землями Кастилии необходимо расширить бюрократический аппарат."

  BHT_43:0 "Несправляющаяся администрация"
  BHT_43_desc:0 "Для эффективного и стабильного управления обширными землями Кастилии необходимо расширить бюрократический аппарат."

