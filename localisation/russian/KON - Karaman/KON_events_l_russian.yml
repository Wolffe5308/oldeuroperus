l_russian:

  karamanids.1.t:0 "§WПредложение союза!"
  karamanids.1.desc:0 "Конийский Султанат направил предложение о союзе. Объединив наши силы, мы сможем господствовать в Анатолии и противостоять внешним угрозам. Принять ли их предложение?"
  karamanids.1.a:0 "Мы согласны."
  karamanids.1.b:0 "Отказано."

  karamanids_news.1.a:0 "Анатолия едина!"
  karamanids_news.1.t:0 "§WНовый альянс"
  karamanids_news.1.d:0 "Османы приняли предложение Конийского Султаната, заключив союз с целью переустройства Анатолии."

  karamanids_news.2.a:0 "Путь предстоит нелёгкий..."
  karamanids_news.2.t:0 "§WОсманский отказ"
  karamanids_news.2.d:0 "Османы отклонили предложение Конийского Султаната, что предвещает возможное соперничество за будущее Анатолии."
  