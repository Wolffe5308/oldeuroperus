l_russian:

  lux.1.t:0 "§WУспешные переговоры!"
  lux.1.desc:0 "Сегодня наши послы вернулись домой с Роны с хорошими новостями. Герцог согласился поддержать восстание в нужный момент. Пришло время завершить разработку нашего плана..."
  lux.1.a:0 "Отлично."
  lux.1b.t:0 "§WUnУспешные переговоры!"
  lux.1b.desc:0 "После долгих переговоров нам не удалось склонить вассала на свою сторону. Все эти доводы показались ему бессмыслицей. Что ж, мы можем обойтись и без них..."
  lux.1b.a:0 "Печально."
  lux.2.t:0 "§WУспешные переговоры!"
  lux.2.desc:0 "Сегодня наши послы вернулись домой из Пуату с хорошими новостями. Герцог согласился поддержать восстание в нужный момент. Пришло время завершить разработку нашего плана..."
  lux.2.a:0 "Отлично."
  lux.2b.t:0 "§WUnУспешные переговоры!"
  lux.2b.desc:0 "После долгих переговоров нам не удалось склонить вассала на свою сторону. Все эти доводы показались ему бессмыслицей. Что ж, мы можем обойтись и без них..."
  lux.2b.a:0 "Печально."
  lux.3.t:0 "§WУспешные переговоры!"
  lux.3.desc:0 "Сегодня наши послы вернулись домой из Бретани с хорошими новостями. Герцог согласился поддержать восстание в нужный момент. Пришло время завершить разработку нашего плана..."
  lux.3.a:0 "Отлично."
  lux.3b.t:0 "§WUnУспешные переговоры!"
  lux.3b.desc:0 "После долгих переговоров нам не удалось склонить вассала на свою сторону. Все эти доводы показались ему бессмыслицей. Что ж, мы можем обойтись и без них..."
  lux.3b.a:0 "Печально."
  lux.4.t:0 "§WЗатишье перед бурей!"
  lux.4.desc:0 "Ваше величество, у меня для вас плохие новости! Наши шпионы подслушали секретный разговор Генриха Люксембургского с некоторыми из наших вассалов. Они готовят план по разделению Франции и захвату власти! Уже слишком поздно, пора браться за оружие..."
  lux.4.a:0 "Затишье перед бурей!"
  lux.5.t:0 "§WЛюксембург требует вассализации§!"
  lux.5.d:0 "Официальная делегация из Люксембурга выдвинула четкое и бескомпромиссное требование. Они настаивают на том, чтобы наше королевство подчинилось власти Люксембурга как вассального государства, приняв их защиту в обмен на суверенитет. Принятие этого решения поставит наше правительство под их влияние, в то время как отказ чреват дипломатической изоляцией и возможными ответными мерами. Выбор, стоящий перед нами сейчас, определит наше будущее."
  lux.5.a:0 "Мы признаем их авторитет."
  lux.5.b:0 "Мы отказываемся"
  lux.6.t:0 "§WЛюксембург требует аннексии"
  lux.6.d:0 "Из Люксембурга поступил прямой ультиматум. На этот раз они не добиваются вассального устройства или политических уступок — они требуют полной аннексии. Наше правительство будет распущено, наша администрация поглощена, а наши вооруженные силы переданы под командование Люксембурга. Принятие ультиматума немедленно положит конец нашему суверенитету. Отказ чреват серьезными последствиями, поскольку Люксембург может истолковать неповиновение как оправдание применения силы."
  lux.6.a:0 "Мы соглашаемся на аннексию"
  lux.6.b:0 "Мы отказываемся"

  lux_news.1.t:0 "§WЛюксембург обрел нового вассала§!"
  lux_news.1.d:0 "Люксембург успешно добился своего требования о вассализации. Столкнувшись с дипломатическим давлением и реалиями власти, государство, ставшее объектом давления, согласилось подчиниться, приняв власть Люксембурга в обмен на защиту. Это решение знаменует собой значительное расширение влияния Люксембурга и сигнализирует о сдвиге в региональном балансе сил."
  lux_news.1.a:0 "Влияние Люксембурга растет"
  lux_news.2.t:0 "§WТребование о вассализации отклонено§!"
  lux_news.2.d:0 "В смелом акте неповиновения государство, ставшее объектом преследования, отклонило требование Люксембурга о вассализации. Официальные лица сослались на суверенитет и независимость как на не подлежащие обсуждению принципы, несмотря на риски, которые может повлечь за собой такой отказ. Этот отказ вносит новую напряженность в регион и поднимает вопросы о том, как Люксембург отреагирует на этот вызов."
  lux_news.2.a:0 "Напряженность нарастает"
  lux_news.3.t:0 "§WЛюксембург аннексирует соседнее государство§!"
  lux_news.3.d:0 "Люксембург добился значительного расширения своей территории за счет политического давления. После получения ультиматума с требованием аннексии, государство, ставшее объектом преследования, приняло его, распустив правительство и передав свои земли под власть Люксембурга. Сообщается, что в рамках соглашения были переброшены военные силы, что укрепило позиции Люксембурга и изменило региональный баланс сил."
  lux_news.3.a:0 "Новая реальность в регионе"
  lux_news.4.t:0 "§WУльтиматум отклонен.§!"
  lux_news.4.d:0 "Требование Люксембурга о полной аннексии было отклонено. Государство, ставшее объектом аннексии, отказалось отказаться от своего суверенитета, несмотря на оказываемое давление и риск ответных мер. Этот отказ усилил напряженность и породил неопределенность относительно дальнейших действий Люксембурга, поскольку наблюдатели задаются вопросом, сможет ли дипломатия еще сдержать конфликт."
  lux_news.4.a:0 "Неповиновение имеет свою цену."
