  JOP_ninja_operation_moderate_success_tt:0 "\n§YУмеренная вероятность успеха§!\nОперация имеет §Yумеренную§! вероятность успеха. Возможен как успех, так и неудача."
  JOP_ninja_operation_high_success_tt:0 "\n§GВысокая вероятность успеха§!\nОперация имеет §Gвысокую§! вероятность успеха. Неудача по прежнему возможна, но вероятность успеха значительно выше."
  JOP_ninja_operation_learn_tt:0 "§5Наши синоби учатся на каждой успешной миссии. В будущем у них будет больше шансов на успех.§!"
