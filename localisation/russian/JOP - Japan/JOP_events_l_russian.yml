l_russian:

 jop.1.t:0 "Свержение императора"
 jop.1.desc:0 "Сегодня утром были схвачены люди, верные императору, а сам он был взят под стражу. Власть уже принадлежала сёгуну, но император всячески ему препятствовал. Теперь вся Япония в руках Хисааки. И кто знает, к чему это нас приведёт."
 jop.1.a:0 "Он был жалким."
 
 jop.2.t:0 "Выход из тени"
 jop.2.desc:0 "Прошло много времени с тех пор, как сёгунат захватил власть в Японии. Но наконец император Го-Фусими решил взяться за оружие против Камакуры. Сам сёгун был убит своими же людьми."
 jop.2.a:0 "За Императора!"
 
 jop.3.t:0 "§WЯпонский ультиматум§!"
 jop.3.desc:0 "Из Киото поступил ультиматум. Япония требует, чтобы мы добровольно подчинились и присоединились к их владениям. В случае отказа они угрожают силой захватить наши земли. Как нам следует отреагировать?"
 jop.3.a:0 "Мы преклоним колени перед Японией..."
 jop.3.b:0 "Мы никогда не сдадимся!"
 
 jop.4.t:0 "Поджоги"
 jop.4.desc:0 "По всей стране начались масштабные поджоги складов оружия, домов самураев и чиновников, верных сёгуну."
 jop.4.a:0 "Как такое возможно?"
 
 jop.5.t:0 "Тайные встречи"
 jop.5.desc:0 "Случаи массовых, и не очень массовых, женских собраний участились. Они могут проходить как в саду, так и дома. Казалось бы, это очень важное событие, но их частота вызывает тревогу."
 jop.5.a:0 "Что-то здесь не так."
 
 jop.6.t:0 "Недовольство"
 jop.6.desc:0 "В последнее время жены стали чаще не подчиняться приказам своих мужей. Они даже осмеливаются спорить с ними и повышать голос. Несколько особенно непослушных уже были приговорены к смертной казни, но это лишь усилило напряжение в семьях."
 jop.6.a:0 "К чему это нас приведёт?"
 
 jop.7.t:0 "Новые идеи"
 jop.7.desc:0 "Всё чаще стали витать в воздухе идеи о равенстве мужчин и женщин. Ярые сторонники и приверженцы этих идей занимаются скрытой пропагандой, а главные проповедники наносят себе татуировки в виде дракона, летящего среди ветвей сакуры — символа своего равенства."
 jop.7.a:0 "Нас ждут серьезные перемены..."
 
 jop.8.t:0 "Пропаганда в чайных домиках"
 jop.8.desc:0 "Если раньше новые идеи распространялись в основном среди женщин, то теперь мужчины, приходящие отдохнуть, все чаще могут услышать эти разговоры от куртизанок."
 jop.8.a:0 "Они уже повсюду?!"
 
 jop.9.t:0 "Женское манипулирование"
 jop.9.desc:0 "Женское обаяние растёт. Оно окутывает мужчин одного за другим. Из-за этого число его поклонниц только увеличивается, ходят слухи, что к этому причастна и сама жена императора."
 jop.9.a:0 "Они не сидят сложа руки."
 
 jop.10.t:0 "Онна-бугэйся"
 jop.10.desc:0 "Похоже, многие женщины-самураи присоединились к сторонникам нового порядка."
 jop.10.a:0 "Это было вполне ожидаемо."
 
 jop.11.t:0 "Тренировочные лагеря"
 jop.11.desc:0 "Похоже, они не будут довольствоваться одними словами. По всей Японии создаются подпольные школы, обучающие обычных женщин самурайскому искусству. Обучение проводят как женщины, так и мужчины-самураи. Люди, верные сёгуну, раскрывают их местонахождение и имена учителей. Среди них есть и высокопоставленные чиновники."
 jop.11.a:0 "Пусть головы летят"
 
 jop.12.t:0 "Набеги бандитов"
 jop.12.desc:0 "Как и ожидалось, если раньше они ограничивались нападениями на отдельных людей или ночными поджогами, то теперь открыто нападают на дома людей, верных сёгуну. Из-за этого им приходится тратить большие деньги на охрану, нанимая ронинов."
 jop.12.a:0 "Когда это закончится?"
 
 jop.13.t:0 "Охота на самураев"
 jop.13.desc:0 "По всей стране начались массовые нападения на самураев, верных сёгуну: нападения на дороги, в городах, в чайных домах и даже во дворцах."
 jop.13.a:0 "..."
 
 jop.14.t:0 "Наши мужчины"
 jop.14.desc:0 "Прошло много времени с тех пор, как началось распространение новых идей. Многие женщины заплатили за это своими жизнями, но их жертвы не были напрасны: большое количество мужей стали все больше прислушиваться к своим женам и их идеям."
 jop.14.a:0 "Наши идеи обязательно победят."
 
 jop.15.t:0 "Новые убийства"
 jop.15.desc:0 "Убийства продолжаются, мужчины, которые когда-то убивали своих жен, теперь боятся любой проходящей мимо девушки, они не выдают себя, мило улыбаются, кланяются, а затем достают нож и вонзают его прямо в горло, так что он умирает долго и мучительно."
 jop.15.a:0 "Зверства"
 
 jop.16.t:0 "Убийство сёгуна"
 jop.16.desc:0 "Сегодня хороший день для всей Японии. Сёгун, который всё это время не покидал свой дворец, решил лично уничтожить один из тренировочных лагерей, но был почти сразу же убит женщиной-самураем. Он даже не успел взмахнуть мечом, как почувствовал резкую боль и слабость в ногах. Упав на землю, он долго лежал, истекая кровью, и наблюдал, как его люди умирают один за другим. Узнав об этом, вся Япония взорвалась яростью."
 jop.16.a:0 "Давайте отпразднуем этот день!"
 
 jop.17.t:0 "Выборы"
 jop.17.desc:0 "Сегодня, во время очередного налета на китайский корабль, наша дорогая Йоко погибла. Мерзкая китайская свинья ударила ее ножом в спину, когда она спасала моряка, упавшего за борт. Свинья, конечно же, тут же полетела за борт с перерезанным горлом, но это не вернет Йоко к нам. Пора двигаться дальше и выбрать нового лидера. Первым будет Садаши, опытный капитан и хороший боец, правая рука Йоко. Вторым — пират, захваченный Йоко в Сингапуре, хитрый и скользкий тип, который позже стал ее мужем. Кого мы выберем?"
 jop.17.a:0 "Мы выбираем Садаши"
 jop.17.b:0 "Наш выбор падает на пиратку Судзуме"
 
 jop.18.t:0 "Вторжение на Тайвань"
 jop.18.d:0 "Японские войска высадились на острове Тайвань. Столкнувшись с мощью нашего флота и армии, правители острова должны решить, сдаться ли им или продолжить сопротивление."
 jop.18.a:0 "Остров сдался Японии"
 jop.18.b:0 "Они отказываются сдаваться" 

 jop.19.t:0 "Тайвань соглашается"
 jop.19.d:0 "Признавая подавляющую мощь Императорской японской армии и флота, власти Тайваня согласились сдать остров без дальнейшего сопротивления. Японские войска мирно оккупировали остров, обеспечив Империи еще один стратегический плацдарм."
 jop.19.a:0 "Тайвань теперь часть нашей империи."

 jop.20.t:0 "Тайвань отверг наш ультиматум"
 jop.20.d:0 "Правители Тайваня отвергли требования Японии и поклялись защищать остров от наших сил. Дипломатические усилия провалились, и единственным оставшимся вариантом остаются военные действия."
 jop.20.a:0 "Тогда мы захватим их!" 

 jop.21.t:0 "Вторжение на Хайнань"
 jop.21.d:0 "Японские войска прибыли к берегам Хайнаня и предъявили властям острова ультиматум. Они должны либо мирно сдаться, либо столкнуться с полномасштабным вторжением."
 jop.21.a:0 "Hainan Surrenders"
 jop.21.b:0 "Они отказываются сдаваться"

 jop.22.t:0 "Хайнань соглашается"
 jop.22.d:0 "Власти Хайнаня приняли наши требования и приказали своим войскам прекратить боевые действия. Японские войска обеспечили безопасность острова без серьезного сопротивления."
 jop.22.a:0 "Хайнань наш."

 jop.23.t:0 "Хайнань отвергает наш ультиматум"
 jop.23.d:0 "Правители Хайнаня отвергли требования Японии и заявили, что будут защищать остров. Нашим силам теперь необходимо подготовиться к его захвату силой."
 jop.23.a:0 "Тогда мы силой захватим Хайнань!"

 jop.24.t:0 "Корё принимает наш ультиматум"
 jop.24.desc:0 "Правители Корё приняли наши требования и согласились подчиниться японской власти. Их земли, солдаты и администрация теперь будут включены в состав нашего королевства без кровопролития."
 jop.24.a:0 "Они сделали мудрый выбор."

 jop.25.t:0 "Корё отвергает наш ультиматум"
 jop.25.desc:0 "Правители Корё отвергли наш ультиматум и заявили, что будут сопротивляться японской власти. Их неповиновение оставляет нам лишь один выход: мы должны захватить их земли силой."
 jop.25.a:0 "Тогда начнётся война!"

 jop.26.t:0 "Вторжение в Циндао"
 jop.26.d:0 "Японские военные корабли прибыли к берегам Циндао и предъявили местным властям ультиматум. Они должны сдать город и прилегающую территорию, иначе им грозит полномасштабное военное вторжение."
 jop.26.a:0 "Циндао сдается"
 jop.26.b:0 "Они отказываются сдаваться"

 jop.27.t:0 "Циндао соглашается"
 jop.27.d:0 "Власти Циндао приняли наши требования и приказали своим войскам прекратить боевые действия. Японские войска вошли в город и без серьезного сопротивления взяли под контроль его важный порт."
 jop.27.a:0 "Циндао теперь наш."

 jop.28.t:0 "Циндао отверг наш ультиматум"
 jop.28.d:0 "Власти Циндао отвергли требования Японии и заявили, что будут защищать город. Дипломатические усилия провалились, и теперь наши силы должны готовиться к захвату порта силой."
 jop.28.a:0 "Тогда Циндао будет захвачен силой!"

 jop.29.t:0 "Вторжение в Шанхай"
 jop.29.d:0 "Японские военные корабли вошли в воды у берегов Шанхая и предъявили властям города ультиматум. Они должны сдать город и его ценный порт, иначе им грозит полномасштабное военное вторжение."
 jop.29.a:0 "Шанхай сдается"
 jop.29.b:0 "Они отказываются сдаваться"

 jop.30.t:0 "Шанхай соглашается"
 jop.30.d:0 "Власти Шанхая приняли наши требования и приказали своим войскам прекратить наступление. Японские войска вошли в город и без серьезного сопротивления взяли под контроль его порт, промышленные предприятия и торговые районы."
 jop.30.a:0 "Шанхай теперь наш."

 jop.31.t:0 "Шанхай отверг наш ультиматум"
 jop.31.d:0 "Власти Шанхая отвергли требования Японии и заявили, что будут защищать город. Дипломатия провалилась, и теперь наши силы должны готовиться к захвату Шанхая силой."
 jop.31.a:0 "Тогда Шанхай будет захвачен силой!"
 

 ### EVENT NINJA ###

 jop_ninja.1.t:0 "Украденные боевые планы"
 jop_ninja.1.desc:0 "Наши синоби проникли в штаб противника и вернулись с ценными планами сражения. Их знания уже начали улучшать нашу военную подготовку."
 jop_ninja.1.a:0 "Отличная работа."

 jop_ninja.2.t:0 "Скрытая шпионская сеть"
 jop_ninja.2.desc:0 "Наши агенты незаметно создали новые убежища на соседних территориях. Информация теперь распространяется быстрее, чем когда-либо прежде."
 jop_ninja.2.a:0 "Расширить сеть."

 jop_ninja.3.t:0 "Тихое убийство"
 jop_ninja.3.desc:0 "Опасный вражеский шпион бесследно исчез. Конкурирующие разведывательные организации сейчас действуют в полной неразберихе."
 jop_ninja.3.a:0 "Без свидетелей."

 jop_ninja.4.t:0 "Скрытый военный тайник"
 jop_ninja.4.desc:0 "Наши оперативники обнаружили заброшенный склад оружия, спрятанный глубоко в горах. Запасы были распределены между нашими силами."
 jop_ninja.4.a:0 "Удачное открытие."

 jop_ninja.5.t:0 "Верные информаторы"
 jop_ninja.5.desc:0 "Торговцы, монахи и путешественники молчаливо договорились предоставлять информацию нашим синоби, где бы они ни находились."
 jop_ninja.5.a:0 "Каждый шепот имеет значение."

 jop_ninja.6.t:0 "Скрытые Мастера"
 jop_ninja.6.desc:0 "Опытные синоби завершили подготовку нового поколения оперативников, обладающих навыками маскировки и проникновения."
 jop_ninja.6.a:0 "Тени становятся все глубже."

 jop_ninja.7.t:0 "Тайны клана"
 jop_ninja.7.desc:0 "В архиве старого клана синоби были обнаружены древние руководства, подробно описывающие тактику скрытого проникновения, инженерные методы и закодированную связь."
 jop_ninja.7.a:0 "Сохранить эти знания."

 jop_ninja.8.t:0 "Великая инфильтрация"
 jop_ninja.8.desc:0 "После многих лет тщательного планирования наша крупнейшая операция синоби превзошла все ожидания. Вражеские суды, торговые гильдии и военные штабы теперь, сами того не подозревая, служат источниками информации для наших агентов. Влияние нашей теневой сети никогда не было таким сильным."
 jop_ninja.8.a:0 "Это царство принадлежит невидимым существам."

 jop_ninja.9.t:0 "Ночь тысячи клинков"
 jop_ninja.9.desc:0 "Под покровом темноты скоординированные удары синоби уничтожали вражеских офицеров, саботировали склады снабжения и сеяли хаос по всему региону. К рассвету сопротивление рухнуло еще до того, как наши армии двинулись в путь."
 jop_ninja.9.a:0 "Нанесите удар, прежде чем они узнают о нашем присутствии."

 jop_ninja.10.t:0 "Невидимый сёгунат"
 jop_ninja.10.desc:0 "Our shinobi have quietly woven themselves into every layer of the realm. Daimyō, merchants, monks, and even rival courts unknowingly carry out our will. Enemy spies disappear before they can act, while our influence grows without drawing a single blade. The true rulers of Japan now govern from the shadows."
 jop_ninja.10.a:0 "Власть принадлежит тем, кто остается незамеченным."

 jop_ninja.11.t:0 "Смерть во тьме"
 jop_ninja.11.desc:0 "Под покровом безлунной ночи наши синоби проникли в опорный пункт противника и уничтожили его руководство, не подняв тревоги. Паника охватила ряды, офицеры исчезали один за другим, оставив врага без лидера и в страхе."
 jop_ninja.11.a:0 "Они нас совсем не заметили."

 jop_ninja.12.t:0 "Тени несут смерть"
 jop_ninja.12.desc:0 "Наши агенты стремительно продвигались по вражеской территории, уничтожая склады снабжения, нейтрализуя гонцов и сея страх среди местных чиновников. К тому времени, как противник понял, что произошло, наши агенты уже скрылись в ночи, оставив после себя лишь тишину."
 jop_ninja.12.a:0 "Тени — наше самое мощное оружие."

 jop_ninja.13.t:0 "Миссия скомпрометирована" 
 jop_ninja.13.desc:0 "Одна из наших секретных операций была раскрыта до её завершения. Несколько конспиративных квартир были заброшены, а ценные контакты прекратились."
 jop_ninja.13.a:0 "Мы должны всё восстановить."
  
 jop_ninja.14.t:0 "Захваченные боевики"
 jop_ninja.14.desc:0 "В ходе разведывательной миссии были захвачены несколько синоби. Их гибель нарушила работу нашей разведывательной сети."
 jop_ninja.14.a:0 "Болезненная жертва."

 jop_ninja.15.t:0 "Ложные разведданные"
 jop_ninja.15.desc:0 "Наши агенты вернулись с вводящей в заблуждение информацией, в результате чего ценные ресурсы были потрачены впустую на проверку ложных зацепок."
 jop_ninja.15.a:0 "Проверьте всё."

 jop_ninja.16.t:0 "Вражеская контрразведка"
 jop_ninja.16.desc:0 "Наши конкуренты усилили меры безопасности и раскрыли ряд наших методов. В будущих операциях потребуется большая осторожность."
 jop_ninja.16.a:0 "Адаптируйтесь и выдержите."

 jop_ninja.17.t:0 "Неудачное покушение"
 jop_ninja.17.desc:0 "Наша цель избежала покушения и теперь знает наши методы. Вражеские власти начали масштабный поиск наших агентов, вынудив многих покинуть свои посты."
 jop_ninja.17.a:0 "Тени нас предали."

 jop_ninja.18.t:0 "Полезная информация"
 jop_ninja.18.desc:0 "Наши синоби вернулись с ценной информацией о враждующих чиновниках, местных конфликтах и ​​тайных союзах. Хотя миссия не раскрыла никаких великих секретов, полученные разведданные укрепили наши позиции при дворе."
 jop_ninja.18.a:0 "Каждый секрет имеет ценность." 

 jop_ninja.19.t:0 "Слухи пресечены"
 jop_ninja.19.desc:0 "Среди населения начали распространяться злонамеренные слухи, но наши агенты выявили их источник и тихо положили этому конец. Доверие общественности частично восстановлено."
 jop_ninja.19.a:0 "Порядок сохранен."

 jop_ninja.20.t:0 "Выявлена ​​слабость противника"
 jop_ninja.20.desc:0 "Наши агенты обнаружили свидетельства плохой дисциплины и внутренних разногласий среди наших врагов. Известия об их слабости воодушевили как наших бойцов, так и население в целом."
 jop_ninja.20.a:0 "Победа может быть ближе, чем ожидалось."

 jop_ninja.21.t:0 "Украденные записи ремесленников"
 jop_ninja.21.desc:0 "В ходе обычной операции по проникновению наши синоби получили подробные записи, принадлежащие опытным мастерам и надзирателям мастерских. Их методы могут помочь улучшить наши собственные производственные технологии."
 jop_ninja.21.a:0 "Примените эти знания на практике."

 jop_ninja.22.t:0 "Дорогостоящая подготовка"
 jop_ninja.22.desc:0 "Для проведения операции потребовалось больше взяток, поддельных документов и спрятанных припасов, чем предполагалось изначально. Хотя наши агенты благополучно вернулись, эта миссия создала неожиданную нагрузку на суд."
 jop_ninja.22.a:0 "Успех имеет свою цену."

 jop_ninja.23.t:0 "Тревожные слухи"
 jop_ninja.23.desc:0 "Свидетели заметили наших агентов во время их отступления. Слухи о убийцах в масках и тайных заговорах сейчас распространяются среди населения, сея беспокойство по всему королевству."
 jop_ninja.23.a:0 "Слухи в конце концов утихнут."

 jop_ninja.24.t:0 "Неубедительный доклад"
 jop_ninja.24.desc:0 "Наши синоби вернулись с противоречивыми сведениями о численности противника. Отсутствие достоверной разведывательной информации подорвало доверие у ряда военачальников."
 jop_ninja.24.a:0 "Мы должны действовать осторожно."

 jop_ninja.25.t:0 "Чиновники требуют ответов."
 jop_ninja.25.desc:0 "Необъяснимое исчезновение средств и персонала привлекло внимание влиятельных должностных лиц суда. Потребовались значительные усилия, чтобы скрыть истинную цель операции.Ф"
 jop_ninja.25.a:0 "Предоставить им подходящее объяснение."
