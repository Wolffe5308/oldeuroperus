  #DYNAMIC MODIFIER IDEA
  VEN_create_venetian_army:0 "Establish the §YVenetian Army§!"
  VEN_modify_venetian_army_by:0 "Modify §YVenetian Army§! by"
  VEN_venetian_army:0 "Venetian Army"
  VEN_venetian_army_desc:0 "Though renowned for its fleets, the Venetian Republic maintains a disciplined land army to defend its mainland possessions, secure trade routes, and wage campaigns across the Adriatic and Italy. Composed of professional soldiers, feudal levies, and experienced mercenary companies, the Venetian Army fights not for conquest alone, but to protect the wealth and stability upon which the Serenissima is built."
  VEN_create_venetian_navy:0 "Establish the §YVenetian Navy§!"
  VEN_modify_venetian_navy_by:0 "Modify §YVenetian Navy§! by"
  VEN_venetian_navy:0 "Venetian Navy"
  VEN_venetian_navy_desc:0 "The lifeblood of Venice flows through the sea. Dominating the Adriatic with unmatched shipbuilding and skilled sailors, the Venetian Navy safeguards merchant convoys, crushes pirates, and projects the Republic's influence from the eastern Mediterranean to the ports of Western Europe. Its powerful galleys are the shield and spear of Venetian prosperity."
  VEN_create_venetian_trade_network:0 "Establish the §YVenetian Trade Network§!"
  VEN_modify_venetian_trade_network_by:0 "Modify §YVenetian Trade Network§! by"
  VEN_venetian_trade_network:0 "Venetian Trade Network"
  VEN_venetian_trade_network_desc:0 "Venice commands one of the greatest commercial empires of the medieval world. Through privileged agreements, bustling marketplaces, and a vast network of merchants stretching from Constantinople to Flanders, the Republic accumulates immense wealth. Every port connected to the Lion of Saint Mark strengthens Venice's economy and reinforces its position as the foremost trading power of the Mediterranean."
  
