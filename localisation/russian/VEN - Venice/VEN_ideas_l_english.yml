  #DYNAMIC MODIFIER IDEA
  VEN_create_venetian_army:0 "Создать §YВенецианская армия§!"
  VEN_modify_venetian_army_by:0 "Изменит §YВенецианская армия§! на:"
  VEN_venetian_army:0 "Венецианская армия"
  VEN_venetian_army_desc:0 "Венеция славится своим флотом, но у неё есть и дисциплинированная армия для защиты материковых владений, охраны торговых путей и ведения кампаний по всей Адриатике и Италии. В составе венецианской армии — профессиональные солдаты, феодальные ополчения и опытные наёмники. Она воюет не ради завоеваний, а за защищту богатства и стабильности, на которых держится Светлейшая Республика."
  VEN_create_venetian_navy:0 "Создать §YВенецианский флот§!"
  VEN_modify_venetian_navy_by:0 "Изменит §YВенецианский флот§! на:"
  VEN_venetian_navy:0 "Венецианский флот"
  VEN_venetian_navy_desc:0 "Жизненная сила Венеции течёт по морю. Господствуя в Адриатике благодаря непревзойдённому кораблестроению и искусным морякам, венецианский флот охраняет торговые караваны, сокрушает пиратов и проецирует влияние Республики от восточного Средиземноморья до портов Западной Европы. Его мощные галеры — и щит, и копьё венецианского процветания."
  VEN_create_venetian_trade_network:0 "Создать §YТорговые пути Венеции§!"
  VEN_modify_venetian_trade_network_by:0 "Изменит §YТорговые пути Венеции§! на:"
  VEN_venetian_trade_network:0 "Торговые пути Венеции"
  VEN_venetian_trade_network_desc:0 "Венеция повелевает одной из величайших торговых империй средневекового мира. Привилегированные соглашения, шумные рынки и разветвлённая сеть купцов — от Константинополя до Фландрии — приносят Республике несметные богатства. Каждый порт, связанный с крылатым львом Святого Марка, укрепляет экономику Венеции и утверждает её как главную торговую силу Средиземноморья."
  
