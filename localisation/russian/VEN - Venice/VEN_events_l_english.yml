l_russian:

  ven.1.t:0 "§WПредложение Венеции"
  ven.1.desc:0 "Республика Венеция предложила нам продать нашу землю. Они готовы заплатить 150 сундуков золота. Что скажете, повелитель?"
  ven.1.a:0 "Мы согласны."
  ven.1.b:0 "Ещё чего! НЕТ!"
  ven.2.t:0 "§WЗемельные приобретения"
  ven.2.desc:0 "После долгих переговоров они согласились продать нам эти земли. Отличная сделка!"
  ven.2.a:0 "Превосходно."
  ven.3.t:0 "§WЗемельные приобретения"
  ven.3.desc:0 "После долгих переговоров, мы не только не смогли договориться, но и разозлили местное правительство."
  ven.3.a:0 "Печально."
  ven.17.t:0 "§WVenetian Trade Proposal§!"
  ven.17.desc:0 "Merchants of the Republic of Venice have arrived at our court with a proposal to establish a formal trade agreement. They promise increased commerce, access to valuable goods, and closer economic ties between our realms. How shall we respond?"
  ven.17.a:0 "Мы согласны."
  ven.17.b:0 "Нет уж, сами справимся."
  ven.18.t:0 "§WTrade Agreement Signed§!"
  ven.18.desc:0 "Our diplomats have successfully concluded a trade agreement. Venetian merchants will enjoy new commercial privileges, strengthening our trade network and enriching both nations."
  ven.18.a:0 "A prosperous future awaits."
  ven.19.t:0 "§WTrade Proposal Rejected§!"
  ven.19.desc:0 "The foreign ruler has rejected our proposal. Venice must seek new opportunities elsewhere, though diplomacy may yet prevail another day."
  ven.19.a:0 "Разочаровывающе."  
  ven.20.t:0 "§WThe Treaty of Peace§!"
  ven.20.desc:0 "Unable to continue the costly conflict with Genoa, the Republic of Venice has agreed to a white peace. As part of the treaty, Venice recognizes Genoese demands and will pay a substantial tribute to secure an end to the war. Though the agreement is humiliating, it restores peace and allows the Republic to recover its strength."
  ven.20.a:0 "Peace comes at a heavy price." 
  ven.21.t:0 "§WЭкономический кризис§!"
  ven.21.desc:0 "Большой совет отверг мир с Генуей — война продолжается, несмотря на всё растущие потери. Годы боёв на море опустошили казну, подорвали торговлю и загнали Республику в долги. Купцы не могут торговать, налоги не поступают, в городе зреет недовольство. Если не вмешаться, Республику ждёт экономический крах."
  ven.21.a:0 "Венеция выстоит."  
  ven.22.t:0 "§RЭкстренное заседание совета§!"
  ven.22.desc:0 "Торговля развалилась, и Республика трещит по швам. Склады пустуют, рабочим нечем кормить семьи, в городе растёт недовольство. Большой совет собрался, но вместо дела — одни споры. Люди уже не верят, что пустые разговоры спасут Венецию."
  ven.22.a:0 "Увеличим налоги, всё просто"
  ven.22.b:0 "Открыть житницы и снизить пошлины на рынках."
  ven.22.c:0 "Бездействуем, пока совет не придёт к единому решению."
  ven.23.t:0 "§RЭкстренное заседание совета§!"
  ven.23.desc:0 "Noble families accuse the merchant guilds, the guilds blame the Council, and the common people demand decisive leadership. Once again the Great Council gathers, yet every faction argues for its own interests while the crisis deepens."
  ven.23.a:0 "Grant temporary emergency powers to local magistrates."
  ven.23.b:0 "Protect the privileges of the great merchant families."
  ven.23.c:0 "Organize public works and suspend certain commercial duties."
  ven.24.t:0 "§GРеспублика выстояла§!"
  ven.24.desc:0 "Вопреки всем ожиданиям, Республика выстояла. Благодаря компромиссам, продуманным реформам и твёрдости Большого совета Венеция вышла из экономического кризиса окрепшей. Те, кто сомневался, выживет ли Республика в эти тяжёлые времена, сегодня видят процветание и вновь верят в её древние установления. Голоса, требовавшие сильного единого правителя, затихли — Большой совет празднует победу республиканского правления над неопределённостью."
  ven.24.a:0 "Светлейшая Республика выстояла."
  ven.25.t:0 "§RРождение Венецианской империи§!"
  ven.25.desc:0 "Большой совет собирается под позолоченными сводами дворца дожей. Pietro Gradenigo поднимается, чтобы обратиться к Республике. Годы экономических трудностей, политического паралича и растущего недовольства убедили многих: старый республиканский порядок больше не может гарантировать Венеции процветание и безопасность.\n\nПри поддержке армии, купеческой элиты и уставшего населения, отчаянно жаждущего стабильности, Gradenigo произносит свою историческую речь:\n\n"Поколениями эта Республика приносила славу Венеции. Однако сегодня раздоры ослабили нашу волю и поставили под угрозу наше будущее. Ради нашей безопасности и дальнейшей стабильности Республика будет преобразована в Венецианскую империю, а во главе её встанет единый государь, которому доверены судьба и благо нашего народа."\n\nКогда знать неохотно поднимается, а толпа разражается ликованием, знамя Святого Марка проносят по улицам. Светлейшая Республика уходит в историю — начинается новая имперская эпоха."
  ven.25.a:0 "Да здравствует Pietro I!"  
  ven.26.t:0 "§GТриумф Республики§!"
  ven.26.desc:0 "Месяцы экономических трудностей сокрушили авторитет Pietro Gradenigo. Купцы, ремесленники и даже многие знатные семьи утратили к нему доверие, возлагая на его политику вину за упадок Республики.\n\nСобравшись на чрезвычайное заседание, Большой совет большинством голосов лишает Pietro Gradenigo полномочий и отстраняет его от должности. Однако совет не желает сосредотачивать ещё больше власти в руках одного правителя. Напротив, принимаются масштабные конституционные реформы: расширяются полномочия выборных магистратов, укрепляется власть совета, а влияние будущих дожей ограничивается.\n\nПока колокола собора Святого Марка разносятся над Венецией, народ празднует то, что многие называют возрождением Республики. Отныне Светлейшая Республика будет управляться не волей одного человека, а голосом своих граждан."
  ven.26.a:0 "Отныне Республика принадлежит народу."
  ven.27.t:0 "§RПереворот Marino Zorzi§!"
  ven.27.desc:0 "Растущее влияние Pietro Gradenigo встревожило многих в венецианской знати и военных кругах. Его стремление превратить Республику в империю убедило противников в том, что он намерен навсегда забрать власть в свои руки.\n\nНе успел Gradenigo провозгласить империю, как солдаты, верные Marino Zorzi, захватили дворец дожей, заняли мосты у площади Святого Марка и арестовали ближайших сторонников Gradenigo. Большой совет оказался в осаде, прежде чем его члены успели что‑либо предпринять.\n\nВыступив перед знатью, Zorzi осудил имперские амбиции Gradenigo как опасную тиранию. Однако и возвращать старую Республику он не собирался. Вместо этого он объявил, что Венеции нужна сильная, но ограниченная монархия — с опорой на армию, знать и древние городские установления.\n\nPietro Gradenigo отстранён от власти. Marino Zorzi провозглашён королём Венеции. Империя не состоялась, но и Республика не вернулась."
  ven.27.a:0 "Да здравствует король!"
  ven.28.t:0 "§RПровальный переворот§!"
  ven.28.desc:0 "Слухи о заговоре ползли по дворцу дожей уже несколько недель, но мало кто верил, что Marino Zorzi отважится поднять меч на Pietro Gradenigo. Затем, ещё до рассвета, верные стражи перехватили гонцов с планами заговорщиков — Pietro успел ударить первым.\n\nКогда Marino Zorzi со своими сторонниками двинулся к площади Святого Марка, все мосты уже были заняты солдатами, верными нашему правителю. Заговорщиков окружили, обезоружили и арестовали, не дав Республике скатиться в гражданскую войну.\n\nPietro Gradenigo выступил перед Большим советом и обличил заговорщиков:\n\n"Это не просто мятеж — это измена самой Венеции. Те, кто хотел расколоть наш народ, ответят по закону. Пусть этот день станет предупреждением для всех, кто ставит свои амбиции выше Республики".\n\nПровалившийся переворот только укрепил власть Gradenigo. Сторонники славят его как спасителя Венеции, оставшаяся оппозиция притихла, не решаясь снова бросить ему вызов."
  ven.28.a:0 "Изменники понесут наказание."
