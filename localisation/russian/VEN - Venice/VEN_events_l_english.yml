l_english:

  ven.1.t:0 "§WOffer from Venice"
  ven.1.desc:0 "The Republic of Venice has made you an offer to sell the land. They are ready to buy it for 150 chests of gold. What do we say, my Lord?"
  ven.1.a:0 "We accept."
  ven.1.b:0 "What an insolence! No!"
  ven.2.t:0 "§WLand purchase"
  ven.2.desc:0 "After a long negotiation, they agreed to sell us the land. Great deal!"
  ven.2.a:0 "Great."
  ven.3.t:0 "§WLand purchase"
  ven.3.desc:0 "After a long trade dispute, we could not come to a solution and only angered the ruler."
  ven.3.a:0 "Sad."
  ven.17.t:0 "§WVenetian Trade Proposal§!"
  ven.17.desc:0 "Merchants of the Republic of Venice have arrived at our court with a proposal to establish a formal trade agreement. They promise increased commerce, access to valuable goods, and closer economic ties between our realms. How shall we respond?"
  ven.17.a:0 "Accept the trade agreement."
  ven.17.b:0 "Decline the proposal."
  ven.18.t:0 "§WTrade Agreement Signed§!"
  ven.18.desc:0 "Our diplomats have successfully concluded a trade agreement. Venetian merchants will enjoy new commercial privileges, strengthening our trade network and enriching both nations."
  ven.18.a:0 "A prosperous future awaits."
  ven.19.t:0 "§WTrade Proposal Rejected§!"
  ven.19.desc:0 "The foreign ruler has rejected our proposal. Venice must seek new opportunities elsewhere, though diplomacy may yet prevail another day."
  ven.19.a:0 "A disappointing outcome."  
  ven.20.t:0 "§WThe Treaty of Peace§!"
  ven.20.desc:0 "Unable to continue the costly conflict with Genoa, the Republic of Venice has agreed to a white peace. As part of the treaty, Venice recognizes Genoese demands and will pay a substantial tribute to secure an end to the war. Though the agreement is humiliating, it restores peace and allows the Republic to recover its strength."
  ven.20.a:0 "Peace comes at a heavy price." 
  ven.21.t:0 "§WEconomic Crisis§!"
  ven.21.desc:0 "The Great Council has chosen to reject peace with Genoa and continue the war despite mounting losses. Years of naval warfare have exhausted the treasury, disrupted Mediterranean commerce, and burdened the Republic with immense debt. Merchants are unable to conduct their business safely, tax revenues have collapsed, and unrest spreads throughout Venice. Unless decisive action is taken, the Republic faces a severe economic crisis."
  ven.21.a:0 "The Republic must endure."  
  ven.22.t:0 "§REmergency Council Meeting§!"
  ven.22.desc:0 "The collapse of trade has shaken the Republic. Merchants complain of empty warehouses, laborers struggle to feed their families, and unrest grows in the streets of Venice. The Great Council has assembled in an emergency session, but its members remain divided over the proper response. Many citizens have begun to question whether endless debate is capable of solving the crisis."
  ven.22.a:0 "Increase taxes to stabilize the treasury."
  ven.22.b:0 "Open the state granaries and reduce market tolls."
  ven.22.c:0 "Delay action until the Council reaches a consensus."
  ven.23.t:0 "§REmergency Council Meeting§!"
  ven.23.desc:0 " Noble families accuse the merchant guilds, the guilds blame the Council, and the common people demand decisive leadership. Once again the Great Council gathers, yet every faction argues for its own interests while the crisis deepens."
  ven.23.a:0 "Grant temporary emergency powers to local magistrates."
  ven.23.b:0 "Protect the privileges of the great merchant families."
  ven.23.c:0 "Organize public works and suspend certain commercial duties."
  ven.24.t:0 "§GThe Republic Endures§!"
  ven.24.desc:0 "Against all expectations, the Republic has weathered the storm. Through compromise, careful reform, and the determination of the Great Council, Venice has emerged from its economic crisis stronger than before. The people once questioned whether the Republic could survive these difficult times, but today's prosperity has restored their faith in its ancient institutions. The voices calling for a single strong ruler have faded, while the Great Council celebrates the triumph of republican government over uncertainty."
  ven.24.a:0 "The Most Serene Republic shall endure."
  ven.25.t:0 "§RThe Birth of the Venetian Empire§!"
  ven.25.desc:0 "The Great Council gathers beneath the gilded halls of the Palazzo Ducale as Pietro Gradenigo rises to address the Republic. Years of economic hardship, political paralysis, and growing unrest have convinced many that the old republican order can no longer guarantee Venice's prosperity or security.\n\nWith the support of the army, the merchant elite, and a weary population desperate for stability, Gradenigo delivers his historic proclamation:\n\n\"For generations, this Republic has brought glory to Venice. Yet today, division has weakened our resolve and endangered our future. In order to ensure our security and continuing stability, the Republic shall be reorganized into the Venetian Empire, with a single sovereign entrusted to safeguard our people and our destiny.\"\n\nAs the nobles reluctantly rise and the crowd erupts in celebration, the banner of Saint Mark is carried through the streets. The Most Serene Republic has passed into history, and a new imperial age begins."
  ven.25.a:0 "Long live Emperor Pietro I!"  
  ven.26.t:0 "§GThe Triumph of the Republic§!"
  ven.26.desc:0 "Months of economic hardship have shattered the authority of Doge Pietro Gradenigo. Merchants, artisans, and even many noble families have lost confidence in his leadership, blaming his policies for the Republic's decline.\n\nGathering in an extraordinary session, the Great Council votes overwhelmingly to strip Gradenigo of his powers and remove him from office. Rather than placing greater authority in the hands of a single ruler, the Council chooses the opposite course. Sweeping constitutional reforms are enacted, expanding the powers of elected magistrates, strengthening the authority of the Great Council, and limiting the influence of future Doges.\n\nAs the bells of Saint Mark's Basilica ring across Venice, the people celebrate what many call the rebirth of the Republic. From this day forward, the Serene Republic shall be governed not by the will of one man, but by the voice of its citizens and their representatives."
  ven.26.a:0 "The Republic belongs to its people."
  ven.27.t:0 "§RThe Coup of Marino Zorzi§!"
  ven.27.desc:0 "Pietro Gradenigo's growing authority has alarmed many within the Venetian nobility and military command. His plans to transform the Republic into an empire have convinced his rivals that he intends to place all power permanently in his own hands.\n\nBefore Gradenigo can complete his imperial proclamation, armed soldiers loyal to Marino Zorzi seize the Palazzo Ducale, occupy the bridges surrounding Saint Mark's Square, and arrest the Doge's closest supporters. The Great Council is surrounded before its members can organize any resistance.\n\nAppearing before the assembled nobles, Zorzi condemns Gradenigo's imperial ambitions as dangerous tyranny. Yet he has no intention of restoring the old Republic. He declares that Venice requires a strong but restrained monarchy—one supported by the army, the nobility, and the ancient institutions of the city.\n\nPietro Gradenigo is removed from power, and Marino Zorzi is proclaimed King of Venice. The imperial dream is dead, but the Republic has not returned."
  ven.27.a:0 "Long live King Marino I!"
  ven.28.t:0 "§RThe Failed Coup§!"
  ven.28.desc:0 "Rumors of conspiracy had spread through the Palazzo Ducale for weeks, but few believed that Marino Zorzi would dare raise his sword against Pietro Gradenigo. Before dawn, loyal guards intercepted messengers carrying the conspirators' plans, allowing the Doge to act before the plot could unfold.\n\nAs Marino Zorzi and his supporters marched toward Saint Mark's Square, they found every bridge occupied by soldiers loyal to Pietro. The conspirators were quickly surrounded, disarmed, and arrested without giving the city a chance to descend into civil war.\n\nStanding before the assembled Great Council, Pietro Gradenigo denounced the conspirators.\n\n\"This is not merely rebellion—it is treason against Venice herself. Those who sought to divide our people shall answer before the law. Let this day serve as a warning to all who would place ambition above the Republic.\"\n\nThe failed coup leaves Pietro stronger than ever. His supporters hail him as the savior of Venice, while the remaining opposition falls silent, unwilling to challenge his authority again."
  ven.28.a:0 "The traitors shall answer for their crimes."
