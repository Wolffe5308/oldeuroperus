 TVT_37_desc:0 "Жемайтия постоянно была спорной территорией. То она становилась независимой,то была вассалом рыцарей, то переходила под контроль Литвы. Нужно присоединить Жемайтию раз и навсегда!"
 TVT_38_desc:0 "Вражда с Литвой продолжается десятилетиями. Пора заканчивать этот балаган и покончить с неверными!"
 TVT_39_desc:0 "Захватив обширные балтийские земли, мы можем называться балтийским орденом, тем самым, де-юре присоединив новые территории."
