l_russian:

  byz.1.t:0 "§WУльтиматум"
  byz.1.desc:0 "Проклятые Палеологи требуют наши земли. Они считают, что стали слишком сильны, и требуют возвращения древних византийских земель. К ним относятся следующие земли: Сивас, Малатья, Ван, Эрзурум, Алеппо и Дейр-эз-Зор. Вам решать, соглашаться или нет, но наш народ готов к войне."
  byz.1.a:0 "Мы согласны..."
  byz.1.b:0 "Мы будем защищать эти земли вечно, если потребуется!"
  
  byz.2.t:0 "§WОни согласны"
  byz.2.desc:0 "Отлично. Хулагуиды согласились отдать нам необходимые территории без лишнего кровопролития."
  byz.2.a:0 "Отлично."
  
  byz.3.t:0 "§WСражаться!"
  byz.3.desc:0 "Черт возьми, Хулагуиды лишь посмеялись над нашим требованием и заявили, что готовы к войне."
  byz.3.a:0 "Мы преподадим им урок!"

  byz.4.t:0 "Венеция крадет нашу прибыль"
  byz.4.desc:0 "Венецианцы разбогатели благодаря торговле, которая когда-то беспрепятственно проходила через наши руки. Их купцы господствуют на морях, в то время как наша собственная казна с каждым днем ​​истощается. Многие теперь призывают к мести, утверждая, что только война может восстановить римскую честь и вернуть то, что у нас отняли. Однако другие предупреждают, что империя уже не так сильна, как прежде."
  byz.4.a:0 "Объявить войну и отомстить!"
  byz.4.b:0 "Мы больше не сильны."
  
  byz.5.t:0 "Возвращение византийских территорий"
  byz.5.desc:0 "Властные бандиты бегут [FROM.GetNameDef]. Они потребовали от нас немедленной передачи им нашей территории под угрозой войны. Мы не можем сказать, что удивлены этим решением. [FROM.GetAdjective] стервятники, но это не делает наше положение менее шатким.\n\nМы должны решить, готовы ли мы отдать свою землю в руки государства. [FROM.GetAdjective] в надежде избежать войны или если мы готовы пойти на это [FROM.GetNameDef] обратно в анналы истории, где им и место."
  byz.5.a:0 "Бороться не стоит."
  byz.5.b:0 "Мы не склонимся перед византийскими требованиями."

  byz.6.t:0 "[FROM.GetNameDefCap] Отказывает нам!"
  byz.6.desc:0 "Дураки в [FROM.GetNameDef] отклонили наше вполне разумное требование о возвращении наших бывших территорий законным владельцам. Это оставляет нам только один выход: война!"
  byz.6.a:0 "Их дерзость будет встречена нашими армиями."

  byz.7.t:0 "Наши территории принадлежат нам!"
  byz.7.desc:0 "Слабаки из [FROM.GetNameDef] проявили некоторую несвойственную им мудрость, приняв решение вернуть нам наши земли без применения насилия."
  byz.7.a:0 "Добро пожаловать обратно в Империю!"
