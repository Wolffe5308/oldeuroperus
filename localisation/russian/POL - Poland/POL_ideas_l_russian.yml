  POL_piast_dukes_subdued_desc:0 "The dukes have been cowed by force and example. Open resistance has ended, though bitterness still simmers beneath the surface."
  POL_piast_authority_consolidated:0 "Piast Authority Consolidated"
  POL_piast_authority_consolidated_desc:0 "The crown stands unchallenged. The era of fragmentation has ended, and the Piast realm now moves with a single will."
