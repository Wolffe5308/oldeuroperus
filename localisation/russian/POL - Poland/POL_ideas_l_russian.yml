  POL_piast_dukes_divided:0 "Fragmented Piast Dukes"
  POL_piast_dukes_divided_desc:0 "The realm is fractured among competing Piast rulers. Royal authority is weak, revenues are divided, and loyalty lies with local lords rather than the crown."
  POL_piast_dukes_appeased:0 "Appeased Piast Dukes"
  POL_piast_dukes_appeased_desc:0 "Through concessions and privileges, the dukes have been brought into reluctant cooperation. Unity exists, but only so long as the rewards continue."
