  POL_piast_dukes_divided:0 "Разобщённые Пясты"
  POL_piast_dukes_divided_desc:0 "Государство раздроблено враждующими князьями из дома Пястов. Королевская власть слаба, доходов почти нет, а верность принадлежит местным правителям, а не короне."
  POL_piast_dukes_appeased:0 "Примирённые Пясты"
  POL_piast_dukes_appeased_desc:0 "Благодаря уступкам и привилегиям князья неохотно пошли на сотрудничество. Единство существует, но только до тех пор, пока продолжаются подачки."
  POL_piast_dukes_subdued:0 "Пясты подчинены"
  POL_piast_dukes_subdued_desc:0 "Князья укрощены силой и примером. Открытое сопротивление прекратилось, хотя горечь всё ещё тлеет под поверхностью."
  POL_piast_authority_consolidated:0 "Власть Пястов консолидирована"
  POL_piast_authority_consolidated_desc:0 "Корона стоит незыблемо. Эпоха раздробленности окончена, и государство Пястов отныне движимо единой волей."
