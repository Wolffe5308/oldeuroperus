l_russian:

  msk.1.t:0 "§WЯзыческий ультиматум"
  msk.1.desc:0 "Москва направила нам ультиматум с требованием принять славянское язычество. По их мнению, приняв православие, русские утратили свою культуру и историю. В противном случае нам будет объявлена война."
  msk.1.a:0 "Мы слишком долго разочаровывались в нашей религии..."
  msk.1.b:0 "Отречься от нашей веры?!"
  
  msk.2.t:0 "§WЯзыческий ультиматум"
  msk.2.desc:0 "[FROM.GetName] согласились на наше предложение! Теперь они язычники, как и мы! В честь этого события устроим пир."
  msk.2.a:0 "Отлично."
  
  msk.3.t:0 "§WЯзыческий ультиматум"
  msk.3.desc:0 "[FROM.GetName] отказались от нашего предложения! Эти глупцы получат по заслугам!"
  msk.3.a:0 "К бою!"
  
  msk.4.t:0 "§WЗапрос из Москвы"
  msk.4.desc:0 "Москва недавно обратилась в католичество и теперь просит у нас любой помощи, чтобы усилить влияние в регионе. Что нам отправить?"
  msk.4.a:0 "Большой сундук с золотом."
  msk.4.b:0 "Солдат."
  msk.4.c:0 "Пусть сами разбираются!"
  
  msk.5.t:0 "§WЗапрос из Москвы"
  msk.5.desc:0 "Москва недавно обратилась в католичество и теперь просит у нас любой помощи, чтобы усилить влияние в регионе. Что нам отправить?"
  msk.5.a:0 "Большой сундук с золотом."
  msk.5.b:0 "Солдат."
  
  msk.6.t:0 "§WДоговор с Богемией"
  msk.6.desc:0 "Некоторое время назад мы предложили Богемии взаимные гарантии. Учитывая последние события, это соглашение вполне могло бы состояться. Однако они отказалась от этого предложения..."
  msk.6.a:0 "Чёрт!"
  
  msk.7.t:0 "§WДоговор с Богемией"
  msk.7.desc:0 "Наша миссия увенчалась успехом, и нам удалось заключить договор с Богемией. Отныне мы по праву можем называться союзниками!"
  msk.7.a:0 "Великолепно."
  
  msk.8.t:0 "§WСоюз с Москвой"
  msk.8.desc:0 "Москва предлагает укрепить взаимную выгоду от общей веры и заключить с нами союз."
  msk.8.a:0 "Хорошо."
  msk.8.b:0 "Никаких союзов."
  
  msk.9.t:0 "§WЗапрос из Москвы"
  msk.9.desc:0 "Москва недавно обратилась в католичество и теперь просит у нас любой помощи, чтобы усилить влияние в регионе. Что нам отправить?"
  msk.9.a:0 "Большой сундук с золотом."
  msk.9.b:0 "Солдат."
  
  msk.10.t:0 "§WДоговор с Болгарией"
  msk.10.desc:0 "Некоторое время назад мы предложили Болгарии взаимные гарантии. Учитывая последние события, это соглашение вполне могло бы состояться. Однако они отказалась от этого предложения..."
  msk.10.a:0 "Чёрт!"
  
  msk.11.t:0 "§WДоговор с Болгарией"
  msk.11.desc:0 "Наша миссия увенчалась успехом, и нам удалось заключить договор с Болгарией. Отныне мы по праву можем называться союзниками!"
  msk.11.a:0 "Великолепно."
  