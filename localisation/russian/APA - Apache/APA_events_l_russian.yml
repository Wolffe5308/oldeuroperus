l_russian:

  apache.1.t:0 "Первая экспедицимя"
  apache.1.desc:0 "Племя апачей готовится к великому маршу. Наши старейшины выбрали доверенного разведчика, который отправится вперед и будет искать землю, достойную нашего народа. Путь неопределенен, и каждая дорога несет в себе свои опасности и обещания."
  apache.1.a:0 "Идите через лес."
  apache.1.b:0 "Выбирайте более безопасный путь."
  apache.1.c:0 "Перебраться через горы."

  apache.2.t:0 "Трудности в лесу"
  apache.2.desc:0 "Путь разведчика через густой лес оказался трудным. Густые леса, пустыни, болезни и нападения животных нанесли ущерб нашему народу. Хотя путь вперед остается открытым, многие были потеряны на этом пути."
  apache.2.a:0 "Марш требует жертв."

  apache.3.t:0 "Земля для людей"
  apache.3.desc:0 "После долгого и тщательного путешествия разведчик вернулся с хорошими новостями. За более безопасным маршрутом лежит плодородная и защищенная земля, пригодная для поселения и будущего народа апачей. Племя встречает эту новость с надеждой."
  apache.3.a:0 "Мы нашли наш новый дом."

  apache.4.t:0 "Духи в горах"
  apache.4.desc:0 "Высоко среди горных перевалов разведчик обнаружил священное место, где шепчут ветры и камни помнят. Старейшины объявляют это ритуальной площадкой, местом, где наши люди могут молиться и укреплять свою связь с духами, прежде чем марш продолжится."
  apache.4.a:0 "Давайте помолимся и послушаем духов."
  
  apache.5.t:0 "Второй разведчик"
  apache.5.desc:0 "Первые поиски не привели нас в землю обетованную. Теперь старейшины отправляют еще одного разведчика, чтобы продолжить путешествие, надеясь, что новый путь может открыть место, где народ апачей сможет поселиться и процветать."
  apache.5.a:0 "Изучить скалистые пустоши."
  apache.5.b:0 "Следуйте по сухим равнинам."
  apache.5.c:0 "Ищите за пределами речных долин."
  apache.5.d:0 "Обратно по старым тропам."

  apache.6.t:0 "Земля найдена"
  apache.6.desc:0 "Наконец разведчик вернулся и сообщил о земле, достойной нашего народа. Она плодородна, защищена и пригода для заселения. Долгие поиски окончены, и теперь апачи могут с надеждой смотреть в будущее."
  apache.6.a:0 "Мы нашли свой дом."

  apache.7.t:0 "Нет земли для поселения"
  apache.7.desc:0 "Разведчик вернулся с пустыми руками. Хотя многие дороги были обысканы, земли, подходящей для поселения, найти не удалось. Племя должно продержаться еще немного и продолжить свое странствие."
  apache.7.a:0 "Мы должны продолжать двигаться."

  apache.8.t:0 "Голоса за пределами огня"
  apache.8.d:0 "Пройдя Испытание Огнем, барьер между мирами ослабевает. Перед вами собираются духи, разделенные на разные пути мудрости и выживания."
  apache.8.a:0 "Слушайте духов земли"
  apache.8.b:0 "Слушайте духи людей"

  apache.9.t:0 "Духи земли"
  apache.9.d:0 "Два древних духа выходят из пыли и дебрей, каждый предлагая свое благословение."
  apache.9.a:0 "Примите духов пустыни"
  apache.9.b:0 "Примите духов охоты"

  apache.10.t:0 "Духи народа"
  apache.10.d:0 "Теперь к вам взывают другие голоса, говорящие о стойкости, единстве и переменах."
  apache.10.a:0 "Примите дух народа"
  apache.10.b:0 "Примите духов адаптации"
  apache.10.c:0 "Примите дух выживания"

  apache.11.t:0 "Тронутый духами"
  apache.11.d:0 "Когда ритуал завершается, вы чувствуете, как внутри вас поселилось чье-то присутствие. Один из духов ответил на ваш зов, его сила теперь связана с вашим народом. И все же завеса не закрылась полностью — другой голос все еще шепчет, призывая вас прислушаться."
  apache.11.a:0 "Другой дух зовёт нас..."

  apache.12.t:0 "В поисках горных теней"
  apache.12.d:0 "Духи шепчут о скрытой силе, сокрытой в высоких местах. Если мы обыщем горы, мы можем обнаружить древнюю тропу, известную только нашим предкам. Но вершины суровы, и не каждая тропа ведет к мудрости."

  apache.12.a:0 "Следуйте по узкой тропе сквозь тени"
  apache.12.b:0 "Открыто поднимитесь к самому высокому гребню."
  apache.12.c:0 "Обыщите нижние склоны и битый камень."

  apache.13.t:0 "Тени гор"
  apache.13.d:0 "Глубоко среди горных троп мы находим то, что обещали духи. К нашему народу возвращаются старые способы скрытности, выносливости и бесшумного передвижения. Теперь нас укрывают сами горы."
  apache.13.a:0 "Горы идут с нами"

  apache.14.t:0 "Затерянный среди вершин"
  apache.14.d:0 "Мы обыскали горы, но нашли только холодный камень, разреженный воздух и исчезающие тропы. Что бы ни хотели открыть духи, оно остается скрытым от нас."
  apache.14.a:0 "Мы возвращаемся с пустыми руками"
  