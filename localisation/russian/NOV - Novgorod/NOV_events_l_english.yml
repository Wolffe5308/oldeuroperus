l_english:

  novgorod.1.t:0 "Novgorod Requests to Join Our Alliance"
  novgorod.1.d:0 "Diplomats from the Republic of Novgorod have arrived seeking membership in our alliance. Their military and commercial strength could prove valuable, though accepting them would further entangle us in the affairs of the East."
  novgorod.1.a:0 "Welcome Novgorod into the alliance."
  novgorod.1.b:0 "Decline their request."
  novgorod.2.t:0 "Novgorod Demands Pskov's Submission"
  novgorod.2.d:0 "Novgorod has demanded that Pskov peacefully submit to their rule, claiming that the northern Rus' lands must be united under one banner."
  novgorod.2.a:0 "We shall reunite with Novgorod."
  novgorod.2.b:0 "Pskov will remain free!"
  novgorod.3.t:0 "The Rise of Semyon Klimovich"
  novgorod.3.d:0 "Deep divisions between the merchant Boyars and the military have thrown the Kingdom of Novgorod into turmoil. Condemning the Boyars' Council as weak and incapable of defending the realm, the respected commander Semyon Klimovich has won the loyalty of the army and the support of many townsfolk. As soldiers marched through the capital, the authority of the Boyars collapsed with little resistance. Declaring that only a strong monarch can preserve Novgorod's future, Klimovich has proclaimed himself Tsar, ending centuries of republican tradition."
  novgorod.3.a:0 "Long live Tsar Semyon I!"
  novgorod.4.t:0 "The Question of Minorities"
  novgorod.4.d:0 "The rise of Tsar Semyon Klimovich has not ended Novgorod's internal troubles. Karelians, Komi-Zyryans, Biarmians, and other peoples within the realm remain uneasy under Novgorodian rule. Cultural tensions threaten the stability of the young Tsardom, and Semyon must decide how the Crown will deal with these divisions."
  novgorod.4.a:0 "Grant them rights under the Crown."
  novgorod.4.b:0 "One realm, one people."
  novgorod.4.c:0 "The Crown has greater concerns."
  novgorod.5.t:0 "Coronation of Tsar Semyon I"
  novgorod.5.d:0 "Before the nobles, clergy, soldiers, and people of Novgorod, Semyon Klimovich has been crowned as Tsar Semyon I. What began as a military seizure of power has now been sanctified by ceremony, law, and tradition. The Boyars' Council has fallen, and a new monarchy rises in its place."
  novgorod.5.a:0 "Long live Tsar Semyon I!"

  novgorod_news.1.t:0 "Novgorod Joins the Alliance"
  novgorod_news.1.d:0 "The Republic of Novgorod has been accepted into the alliance led by [ROOT.GetNameDef], strengthening diplomatic ties between the eastern principalities and their western partners."
  novgorod_news.2.t:0 "Novgorod's Request Rejected"
  novgorod_news.2.d:0 "The government of [ROOT.GetNameDef] has rejected Novgorod's request to join its alliance. The republic will now be forced to seek security through other diplomatic means."
  novgorod_news.3.t:0 "Pskov Submits to Novgorod"
  novgorod_news.3.d:0 "Pskov has accepted Novgorod's demand for peaceful reunification, bringing the northern Rus' lands closer together."
  novgorod_news.4.t:0 "War Between Novgorod and Pskov"
  novgorod_news.4.d:0 "Pskov has rejected Novgorod's demand for submission. In response, Novgorod has declared war to force the reunification of the northern Rus' lands."
  novgorod_news.5.t:0 "The Boyars Overthrown in Novgorod"
  novgorod_news.5.d:0 "The Boyars' Council of Novgorod has been dissolved following a military coup led by Semyon Klimovich. With the backing of the army and popular support, Klimovich has proclaimed himself Tsar, transforming the Kingdom of Novgorod into a centralized monarchy."
  