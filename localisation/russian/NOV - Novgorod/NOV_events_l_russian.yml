l_russian:

  novgorod.1.t:0 "Новгород предлагает вступить в альянс"
  novgorod.1.d:0 "Прибыли дипломаты Новгородской Республики с учетом членства в нашем альянсе. Их военная и экономическая мощь может пригодиться, хотя их принятие еще больше запутывает нас в делах на Востоке."
  novgorod.1.a:0 "Поприветстовать Новгород в альянсе."
  novgorod.1.b:0 "Отклоните их просьбу."
  novgorod.2.t:0 "Новгород требует подчинения Пскова"
  novgorod.2.d:0 "Новгород требовал от Пскова мирно подчиниться их власти, утверждая, что земли северной Руси должны быть объединены под одним знаменем."
  novgorod.2.a:0 "Мы воссоединимся с Новгородом."
  novgorod.2.b:0 "Псков остается свободным!"
  novgorod.3.t:0 "Взлет Семена Климовича"
  novgorod.3.d:0 "Глубокие разногласия между купеческим боярством и военными повергли Новгородское княжество в смуту. Осудив Боярскую раду, как слабую и неспособную защитить царство, уважаемый полководец Семен Климович, продемонстрировал лояльность армии и поддержку многих горожан. Когда солдаты прошли через столицу, власть бояра рухнула без особого сопротивления. Заявив, что только сильный монарх может обеспечить будущее Новгорода, Климович провозгласил себя королем, положив конец многовековой республиканской традиции."
  novgorod.3.a:0 "Да здравствует царь Семен I!"
  novgorod.4.t:0 "Вопрос меньшинства"
  novgorod.4.d:0 "Приход короля Семена Климовича не закрывал конец проблемы Новгорода. Карелы, коми-зыряне и другие народы королевства по-прежнему неспокойно живут под властью Новгорода. Культурная опасность угрожает стабильности молодого Царства, и Семен должен решить, как Корона справится с древними разногласиями."
  novgorod.4.a:0 "Предоставьте им права под Короной."
  novgorod.4.b:0 "Одно царство, один народ."
  novgorod.4.c:0 "У Короны есть более серьезные опасения."
  novgorod.5.t:0 "Коронация царя Семена I"
  novgorod.5.d:0 "Перед дворянами, духовенством, солдатами и новгородцами Семен Климович был коронован как царь Семен I. То, что началось как военный захват власти, теперь освящено церемонией, законом и традицией. Боярская рада пала, и на ее месте возникает новая монархия."
  novgorod.5.a:0 "Да здравствует царь Семен I!"

  novgorod_news.1.t:0 "Новгород присоединяется к Альянсу"
  novgorod_news.1.d:0 "Новгородская Республика была принята в альянс во главе с [ROOT.GetNameDef], что укрепило дипломатические связи между восточными княжествами и их западными партнерами."
  novgorod_news.2.t:0 "Запрос Новгорода отклонен"
  novgorod_news.2.d:0 "Правительство [ROOT.GetNameDef] отклонило просьбу Новгорода о вступлении в его альянс. Республика теперь будет вынуждена искать безопасности другими дипломатическими средствами."
  novgorod_news.3.t:0 "Псков подчиняется Новгороду"
  novgorod_news.3.d:0 "Псков принял требование Новгорода о мирном воссоединении, сблизив земли северной Руси."
  novgorod_news.4.t:0 "Война Новгорода и Пскова."
  novgorod_news.4.d:0 "Псков отверг требование Новгорода о подчинении. В ответ Новгород объявил войну, чтобы добиться воссоединения земель Северной Руси."
  novgorod_news.5.t:0 "Свержение бояр в Новгороде"
  novgorod_news.5.d:0 "Боярский совет Новгорода был распущен в результате военного переворота под руководством Семена Климовича. При поддержке армии и народа Климович провозгласил себя царем, превратив Новгородское королевство в централизованную монархию."
  