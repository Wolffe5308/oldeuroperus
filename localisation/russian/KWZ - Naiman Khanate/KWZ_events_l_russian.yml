l_russian:

  naiman.1.t:0 "Прошение найманов: укрепить власть"
  naiman.1.desc:0 "Послы Найманского Ханства прибыли с официальным прошением. Они просят признать их инициативу и использовать наше влияние, чтобы изменить придворную политику в их пользу — указами, назначениями и декретами, которые укрепят их положение и подавят инакомыслие. Поддержка их сейчас станет сигналом о том, что баланс сил меняется."
  naiman.1.a:0 "Мы согласны"
  naiman.1.b:0 "У нас есть дела получше"

  naiman.2.t:0 "Прошение найманов: расширить плавильни"
  naiman.2.desc:0 "Найманы просят техническую помощь и припасы для строительства новых плавилен. Они обещают стабильные поставки руды и рабочей силы, если мы направим мастеров и ремесленников им на помощь. Эти предприятия будут кормить наши кузницы — и их амбиции."
  naiman.2.a:0 "Мы согласны"
  naiman.2.b:0 "Сами справятся"

  naiman.3.t:0 "Прошение найманов: оружейные и мастерские"
  naiman.3.desc:0 "Стремясь ускорить свой промышленный рост, найманы предлагают совместными усилиями построить мастерские и оружейные в подконтрольных им городах. С нашей рабочей силой и материалами строительство может начаться незамедлительно, что укрепит как их экономику, так и нашу казну."
  naiman.3.a:0 "Мы согласны"
  naiman.3.b:0 "Кто их сюда пустил?"

  naiman.4.t:0 "Прошение найманов: династический брак"
  naiman.4.desc:0 "Послы от найманов обращаются с дерзкой просьбой: выдать чингизидскую принцессу замуж за Тарагай-нойона. Такой союз свяжет наши дома, скрепит верность кровью и дарует найманам новую легитимность в глазах степных властителей. Однако вес этого предложения может сместить баланс сил на поколения вперёд."
  naiman.4.a:0 "Мы согласны."
  naiman.4.b:0 "Не бывать этому!"   

  naiman.5.t:0 "Отказ"
  naiman.5.desc:0 "Наши послы возвращаются с мрачными вестями. Наш запрос был решительно отклонён. Никаких уступок предложено не было, и дверь для дальнейших переговоров, похоже, закрылась."
  naiman.5.a:0 "Досадно."

  naiman.6.t:0 "Прошение удовлетворено: власть укреплена"
  naiman.6.desc:0 "Наше прошение встретили решительной поддержкой. Выпущены указы, ханство вознаграждено, советы переустроены. При дворе усиливается влияние, а карт-бланш на решительные действия крепнет с каждым днём."
  naiman.6.a:0 "Да будет так."

  naiman.7.t:0 "Прошение удовлетворено: новые плавильни"
  naiman.7.desc:0 "Надзиратели отправляются в путь с ремесленниками и запасёнными инструментами. В считанные дни земляные работы завершены, первые печи зажжены. Рёв мехов вскоре начнёт питать наши литейные свежей рудой."
  naiman.7.a:0 "Нам ещё многое предстоит."
  
  naiman.8.t:0 "Прошение удовлетворено: оружейные и мастерские"
  naiman.8.desc:0 "Участки выбраны, чертежи составлены, ресурсы доставлены на место. Новые мастерские вырастают рядом с оружейными, каждая готовая превращать сырьё в опору власти."
  naiman.8.a:0 "Да поможет нам Аллах."

  naiman.9.t:0 "Династический союз"
  naiman.9.desc:0 "Помолвка заключена. Гонцы развозят весть по степи: Тарагай-нойон взял в жёны Чагатайскую царевну, соединив кровные линии и скрепив союз между нашими государствами. С этим браком расходятся слухи о грядущем — о том основании, на котором будет воздвигнута судьба Тамерлана."
  naiman.9.a:0 "Начало новой эпохи."
