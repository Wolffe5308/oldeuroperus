l_russian:

  mam.1.t:0 "Мамлюкский посол"
  mam.1.desc:0 "Сегодня в наши земли прибыл посол из Каира. Он заявляет, что в интересах своего государства мы должны передать им всё побережье Красного моря. Что ответим?"
  mam.1.a:0 "Мы согласны."
  mam.1.b:0 "Убить его."
  mam.2.t:0 "Крах Хулагуидов"
  mam.2.desc:0 "После захвата трёх важных крепостей персидская знать узрела слабость монгольского владычества и свергла его."
  mam.2.a:0 "Это только начало"
  mam.3.t:0 "Наследник фараонов на троне"
  mam.3.d:0 "С отказом Мамлюкского султаната от старой веры и обращением к древним традициям Египта легитимность иноземных династий оказалась под вопросом. После долгих поисков по забытым семейным хроникам, храмовым архивам и родословным знати перед двором предстал человек, утверждающий, что ведёт свой род от последних фараонов.\n\nПризнанный последним живым наследником древних династий, Нектанеб III был провозглашён новым правителем Египта. Впервые за многие столетия фараон вновь восседает на троне Обеих Земель."
  mam.3.a:0 "Да здравствует фараон!"

  mam_news.1.t:0 "§WМемфис вновь восстаёт из руин§!"
  mam_news.1.a:0 "Слава Кемета возвращается."
  mam_news.1.d:0 "Египет вновь обратился к традициям своего древнего прошлого. По королевскому указу разрушенный город Мемфис будет отстроен заново на старых основаниях, восстанавливая первую великую столицу фараонов.\n\nХрамы, памятники и царские залы вновь поднимутся у берегов Нила, став символами возрождённой египетской идентичности. Для всего мира возрождение Мемфиса — смелое заявление: Египет более не стремится лишь править настоящим, но намерен вернуть наследие своих предков."
