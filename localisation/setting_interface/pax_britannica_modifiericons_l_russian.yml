  Nationalistic_Fervour_tt_delayed:0 "Поражение в Первой мировой войне до сих пор сильно влияет на сознание французов. Многие отцы, братья и мужья погибли, а те, кто пережил такие ужасы, жаждут мести. Жажда, которая не будет утолена до падения Британской и Германской империй. \n \n В зависимости от вашего уровня националистического рвения будут применяться различные военные модификаторы. Модификатор «Националистического рвения» также будет уменьшаться на §R -1 §! каждый месяц, поэтому не забывайте поддерживать его! \n \n Эти модификаторы корректируют §Y Ежемесячно §! и являются следующими: \n \n Низкий националистический пыл: \n £population_texticon Ежемесячное население: §R -5,00% §! \n £surrender_texticon Предел капитуляции: §R -5,00% §! \n £manpower_texticon Фактор рекрутируемого населения: §R -5,00% §! \n £defence_core_texticon Защита дивизии на основной территории: §R -5,00% §! \n £attack_core_texticon Атака дивизии на основной территории: §R -5,00% §! \n \n Средний националистический Рвение: \n £population_texticon Ежемесячное население: §G +5,00% §! \n £surrender_texticon Лимит капитуляции: §G +5,00% §! \n £manpower_texticon Коэффициент рекрутируемого населения: §G +5,00% §! \n £defence_core_texticon Защита дивизии на основной территории: §G +5,00% §! \n £attack_core_texticon Атака дивизии на основной территории: §G +5,00% §! \n \n Высокий националистический пыл: \n £population_texticon Месячная численность населения: §G +10,00% §! \n £surrender_texticon Лимит капитуляции: §G +10,00% §! \n £manpower_texticon Фактор рекрутируемого населения: §G +10,00% §! \n £defence_core_texticon Защита дивизии на основной территории: §G +10,00% §! \n £attack_core_texticon Атака дивизии на основную территорию: §G +10,00% §!"

