  Factionalism_tt_delayed:0 "Политическая система Франции противоречит друг другу. Назвать его крайне правым политическим союзом было бы грубым преуменьшением взяток и коррупции, которыми дышит французское государство. Всегда и где-то есть кто-то с иным мнением. Этих особей необходимо выслеживать до самого их исчезновения. \n \n В зависимости от вашего уровня фракционности ваша стабильность и факторы политической власти будут увеличиваться/уменьшаться. Модификатор «Фракционного рвения» также будет увеличиваться на §R +1 §! каждый месяц, поэтому не забудьте сохранить его на прежнем уровне! \n \n Эти модификаторы корректируют §Y Ежемесячно §! и являются следующими: \n \n Низкая фракционность: \n £ Political_power_texticon Прирост политической власти: §G +10,00% §! \n £stability_texticon Стабильность: §G +10,00% §! \n £stability_popularity_texticon Партийная популярность Модификатор стабильности: §G +10,00% §! \n \n Средняя фракционность: \n £ Political_power_texticon Прирост политической власти: §R -5,00% §! \n £stability_texticon Стабильность: §R -5,00% §! \n £stability_popularity_texticon Партийная популярность Модификатор стабильности: §R -5,00% §! \n \n Высокая фракционность: \n £ Political_power_texticon Прирост политической власти: §R -10,00% §! \n £stability_texticon Стабильность: §R -10,00% §! \n £stability_popularity_texticon Модификатор стабильности популярности партии: §R -10,00% §! \n"
  
