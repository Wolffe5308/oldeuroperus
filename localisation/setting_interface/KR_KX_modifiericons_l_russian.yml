FNG_mantetsu_profits_desc:0 "Южно-Маньчжурская железнодорожная компания, неофициально известная как «Мантэцу», присутствует в Маньчжурии после окончания русско-японской войны. Сегодня ее деятельность охватывает весь регион и составляет основу его растущей промышленной экономики. Мантэцу приносит японскому правительству больше валового дохода, чем все остальные страны империи вместе взятые. \n §W -------------- \n $MODIFIER_LOCAL_RESOURCES_FACTOR$ : [?FNG.JAP_mantetsu_resource_gain|=%+] \n $MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$ : [?FNG.JAP_mantetsu_factory_output|=%+] [MantetsuFactoriesReceived] §!"
