SOV_cultural_revolution_proletkult_idea_desc:0 "С приходом к власти фракции «Пролеткультисты» началась активная политика «пролетаризации». Этот проект, направленный на искоренение неграмотности, радикальное повышение уровня образования и ассимиляцию людей с пролетарской этикой, требует большого финансирования и рабочей силы. Однако в случае успеха мы окажемся буквально в рабочем раю \n §W -------------- \n £kx_illitteracy_texticon Уровень неграмотности Ежемесячное изменение: [?SOV.SOV_culrev_level_of_illiteracy_monthly_rate|=-2] \n £kx_education_texticon Средний уровень образования Ежемесячное изменение: [?SOV.SOV_culrev_level_of_education_monthly_rate|=+2] \n £kx_proletkult_texticon Принятие Ежемесячное изменение «Пролетарской этики» [?SOV.SOV_culrev_level_of_proletarian_ethics|=+2] \n $stability_good_modifier$ : [?SOV.SOV_culrev_stability|%=+2] \n $war_support_modifier$ : [?SOV.SOV_culrev_war_support|%=+2]"
SOV_Cultural_Revolution_Proletkult_decisions_desc:0 "§N Пролеткульт §! вырос из небольшого кружка поэтов и писателей-авангардистов в крупную организацию в структуре §N Наркомата §! §Y Просвещения §! . Проект §N Пролеткульт §! направлен на ликвидацию неграмотности, повышение уровня образования и внедрение пролетарской этики в культуру русских и национальных меньшинств. \n \n £kx_illitteracy_texticon УРОВЕНЬ НЕГРАМОТНОСТИ: [?SOV.SOV_proletkult_level_of_illiteracy|2] % \n \n £kx_education_texticon СРЕДНИЙ УРОВЕНЬ ОБРАЗОВАНИЯ: [?SOV.SOV_proletkult_level_of_education|2] % \n \n £kx_proletkult_texticon ПРИНЯТИЕ ПРОЛЕТАРСКОЙ ЭТИКИ: [?SOV.SOV_proletkult_level_of_proletarian_ethics|2] %"
