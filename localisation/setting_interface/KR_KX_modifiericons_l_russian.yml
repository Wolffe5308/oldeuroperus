ott_constitution_tt:0 "Османский парламент, великий визирь и падишах [OTT.GetLeader] разработают современную конституцию Османской империи. \n \n §Y Плюралистическая конституция §! : \n §g Власть должна быть ближе к личности, а не к государству, при этом важность индивидуальных свобод, таких как свобода слова и свобода религии, гарантируется и защищается. Султан откажется от своего права напрямую влиять на государственные дела и вместо этого делегирует их демократически избранному органу. §! \n Приобретает национальный дух §Y Плюралистическая конституция §! , которая предоставляет: ( $stability_good_modifier$ : §G +10% §! ) \n \n §Y Авторитарная конституция §! : \n §g Власть будет централизована вокруг партии, избранный лидер которой будет назначен Великим визирем, в то время как все другие партии будут запрещены. Султан сохраняет за собой право контролировать все религиозные дела, но должен подчиняться партии в государственных вопросах. §! \n Обретает национальный дух §Y Авторитарная конституция §! , которая предоставляет: ( $MODIFIER_POLITICAL_POWER_FACTOR$ : §G +10% §! , $MODIFIER_GLOBAL_NON_CORE_MANPOWER$ : §G +10% §! ) \n \n"
