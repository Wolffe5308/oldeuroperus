#KR_United_Kingdom_l_english
GBR_postwar_devastation_idea_desc:0 "После стольких сражений на британской земле экономика была опустошена. Хуже, чем фактическое разрушение, являются обломки синдикалистской экономической системы, от которой поспешно отказались, но которой пока нечем заменить. Британцам предстоит пережить период трудностей и адаптации, и это будет нелегко. \n §W -------------- \n $MODIFIER_CONSUMER_GOODS_FACTOR$ : [?GBR.GBR_consumer_goods_adj|=%+] \n $MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$ : [?GBR.GBR_factory_adj|=%+] \n $MODIFIER_INDUSTRIAL_CAPACITY_DOCKYARD_FACTOR$ : [?GBR.GBR_dockyards_adj|=%+] \n $MODIFIER_LOCAL_RESOURCES$ : [?GBR.GBR_resources_adj|=%+] \n $MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$ : [?GBR.GBR_construction_adj|=%+] §!"
GBR_legacy_revolution_idea_desc:0 "Британии предстоит восстановить не только экономику, но и саму структуру общества. Молодежь никогда не знала ничего, кроме синдикализма, а многие представители старшего поколения поддержали революцию или смотрели на возвращающихся изгнанников как на трусов, которые бежали вместо того, чтобы остаться и сражаться. Доверие необходимо восстановить, а это потребует времени и усилий. \n §W -------------- \n $MODIFIER_STABILITY_WEEKLY$ : [?GBR.GBR_weekly_stab_adj|=%+] \n $MODIFIER_POLITICAL_POWER_COST$ : [?GBR.GBR_pp_cost_adj|=%+] \n $MODIFIER_CONSCRIPTION_TOTAL_FACTOR$ : [?GBR.GBR_consc_adj|=%+] §!"
GBR_syndicalist_resistance_idea_desc:0 "Большинство синдикалистов в Британии устали от борьбы... но дать им достаточно повода для гнева, чтобы поверить, что возвращение короля означает, что все - включая несправедливость - будет таким, как было? И мы вполне можем столкнуться с возвращением к насилию, которое возвестило восстание 1925 года. \n §W -------------- \n $stability_good_modifier$ : [?GBR.GBR_stab_factor_adj|=%+] §!"

