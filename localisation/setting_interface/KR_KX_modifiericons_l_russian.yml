ott_vilayet_stability_idea_desc:0 "От пустынь Сирии до гор Курдистана и холмов Кипра Османская империя осуществляет контроль над своими гражданами. Однако этим гражданам не всегда нравится, когда ими управляет Константинийе, и чаще всего это наносит ущерб общей стабильности королевства. \n \n Чем выше местная нестабильность в наших вилайетах (представленная £resistance_texticon §Y Unrest §! ), тем больше наказание для нашей страны. \n §W -------------- \n $stability_good_modifier$ : [?var_state_stability|+=%] [ott_vilayet_stability_war_support] \n \n §H Влияние на наши основные состояния §! : \n $MODIFIER_RESISTANCE_GARRISON_PENETRATION_CHANCE$ : [?-0.95|-=%] \n $MODIFIER_RESISTANCE_DAMAGE_TO_GARRISONS$ : [?-0.95|-=%] §!"
