RUS_orth_eur_enlightenment_modifier_idea_desc:0 "Великое евразийское Просвещение началось с создания специальных правительственных советов, которые должны были бороться с неграмотностью среди населения, ассимилировать коренные меньшинства и продвигать евразийскую идеологию среди всех социальных слоев. \n §W -------------- \n $MODIFIER_POLITICAL_POWER_FACTOR$ : [?RUS.RUS_orth_eur_enlightenment_political_power_factor|=%+0] \n $stability_good_modifier$ : [?RUS.RUS_orth_eur_enlightenment_stability|=%+2] \n $war_support_modifier$ : [?RUS.RUS_orth_eur_enlightenment_war_support|=%+0] \n $MODIFIER_CONSUMER_GOODS_FACTOR$ : [?RUS.RUS_orth_eur_enlightenment_consumer_goods_factor|=%+] \n £manpower_texticon Эффективная общая рабочая сила: [?RUS.RUS_orth_eur_enlightenment_conscription_factor|=%+] \n $MODIFIER_DRIFT_DEFENCE_FACTOR$ : [?RUS.RUS_orth_eur_enlightenment_ideology_drift_defense|=%+0] \n £compliance_texticon Среднее соответствие требованиям для интеграции: [?RUS.rus_core_integration_cost_compliance|Y3] \n £time_texticon Время интеграции: [?RUS.rus_core_integration_time_to_remove|Y0] дней"
RUS_orth_eur_cultural_revolution_decisions_desc:0 "Наше правительство наконец приступило к созданию настоящей §C идеократии §! с помощью процесса «§G Великого евразийского Просвещения §!». \n \n Просветление – это сложная, но необходимая вещь, которую нам необходимо завершить, чтобы уменьшить §Y интеграцию §! §G время §! и §G среднее соответствие для интеграции §! . \n \n §C Идеократия §! Уровень зависит от §Y Ассимиляции коренных меньшинств §! , §M Уровень грамотности §! и §g Принятие евразийской идеологии §! . \n \n \n Всего §C Идеократия §! Уровень: [?RUS.rus_ideocracy|С2] \n \n £national_unity_texticon §Y Ассимиляция коренных меньшинств §! : [?RUS.rus_assimiliation_of_native_minorities|Y2] \n £kx_education_texticon Уровень §M Грамотность §! : [?RUS.rus_illiteracy|M2] \n §g £ai_texticon Принятие евразийской идеологии §! : [?RUS.party_popularity@ruling_party|%g2]"
increase_rus_illiteracy_imrovement_rate_tt:0 "Мы приложим больше усилий для повышения §M грамотности §! за счет: \n $MODIFIER_POLITICAL_POWER_FACTOR$ : §R -50% §! \n £kx_education_texticon §M Грамотности §! Ежедневное изменение: §G +0,08 §! \n"
