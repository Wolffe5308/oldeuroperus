#KR_Guatemala_l_english
GUA_united_fruit_desc:0 "United Fruit Company жестко контролирует политику и экономику Гватемалы со времен диктатуры Кабреры в 1898 году. Хотя в результате в Гватемале наблюдается значительный экономический рост, это заставляет United Fruit Company держать судьбу Гватемалы на волоске. В настоящее время он контролирует §Y [?UFC_power] % §! нашей земли. \n §W Это дает нам следующие эффекты: §! \n §W $MODIFIER_POLITICAL_POWER_GAIN$ : §! §R - [?UFC_effect1] §! \n §W $MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$ : §! §G + [?UFC_effect2] % §! \n §W $MODIFIER_CONSUMER_GOODS_FACTOR$ : §! §Y - [?UFC_effect3] % §! \n §W $war_support_modifier$ : §! §R - [?UFC_effect4] % §!"

#KR_Haiti_l_english
 HAI_foreign_control_desc:0 "Несмотря на уход Америки с оккупации нашего острова, Гаити продолжает прочно занимать свое место в американской экономической сфере. Расколовшись между немецкими и американскими экономическими интересами, наш народ оказывается постоянно эксплуатируемым, и если с какой-либо из держав не произойдет что-то существенное, мы будем продолжать находиться под их властью. \n §W ----------------- §! \n §W Американское экономическое влияние: §! [GetAmericanInfluence] \n §W Немецкое экономическое влияние: §! [GetGermanInfluence] \n §W Французское общинное экономическое влияние: §! [GetFrenchInfluence] §! [GetENTInfluence] \n \n §W [GetRestrictions] §W $MODIFIER_INDUSTRIAL_FACTORY_DONATIONS$ : §! [?HAIeconomicinfluncecivs|=+0] \n §W $MODIFIER_POLITICAL_POWER_FACTOR$ : §! [?HAIeconomicinfluncepp|%+0]"
 HAI_foreign_control_dummy_desc:0 "Несмотря на уход Америки с оккупации нашего острова, Гаити продолжает прочно занимать свое место в американской экономической сфере. Расколовшись между немецкими и американскими экономическими интересами, наш народ оказывается постоянно эксплуатируемым, и если с какой-либо из держав не произойдет что-то существенное, мы будем продолжать находиться под их властью. \n §W ----------------- §! \n §W Американское экономическое влияние: §! §R Высокое §! \n §W Немецкое экономическое влияние: §! §G Низкое §! \n §W Французское общинное экономическое влияние: §! §G Низкое §! \n \n §W Ограничения, предусмотренные американским мандатом: §! §R Государственные расходы §! \n \n §W Невозможно назначать министров или законы: §! §R Да §! \n §W $MODIFIER_INDUSTRIAL_FACTORY_DONATIONS$ : §! [?1|=+0] \n §W $MODIFIER_POLITICAL_POWER_FACTOR$ : §! [?-0.1|%+0]"
 HAI_border_clashes_idea_desc:0 "После вывода американских войск доминиканцы начали наращивать свои силы на нашей границе и становиться еще более агрессивными в своих действиях. Несмотря на наше желание нанести ответный удар, доминиканские взятки нейтрализовали нашу армию. Мы должны покончить с коррупцией и хотя бы немного модернизировать нашу армию, чтобы иметь возможность защищать наши границы. \n §W ----------------- \n $MODIFIER_ARMY_ORG$ : [?HAIborderclashesORG|+=%1] \n $stability_good_modifier$ : [?HAIborderclashesST|+=%] \n $war_support_modifier$ : [?HAIborderclashesWS|+=%] §!"
 HAI_border_clashes_desc:0 "Доминиканский режим постоянно вторгается на территорию Гаити. Они совершили набеги на различные приграничные деревни, а затем подкупили наших чиновников, чтобы предотвратить возмездие. Президент Каликст пришел к власти с намерением остановить набеги доминиканцев, но доминиканское взяточничество продолжает оставаться занозой на нашем глазу. Мы должны найти решение, если хотим защитить нашу границу. \n \n Уровень коррупции в Гаити в настоящее время находится на уровне [?HAI.HAI_corruption|R%] . \n \n Доминиканские взятки затронули Гаити: \n $MODIFIER_ARMY_ORG$ : [?HAI.HAIborderclashesORG|=+%] \n $war_support_modifier$ : [?HAI.HAIborderclashesWS|=+%] \n $stability_good_modifier$ : [?HAI.HAIborderclashesST|=+%] \n \n [GetCorruptionStance]"

