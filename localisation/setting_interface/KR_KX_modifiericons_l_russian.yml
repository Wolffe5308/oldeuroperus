increase_rus_acceptance_of_eurasian_ideology_rate_tt:0 "Мы приложим больше усилий для улучшения §g евразийской пропаганды §! за счёт: \n $MODIFIER_POLITICAL_POWER_FACTOR$ : §R -25% §! \n"
