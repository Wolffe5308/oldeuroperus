rus_industry_lack_desc:0 "Неспособность Керенского провести земельную реформу привела к тому, что целые регионы страны утратили эффективные пути индустриализации. Более того, после Гражданской войны Россия столкнулась с экономическим развалом, коротким периодом роста, а затем рецессией из-за застоя и коррупции, вызванных неэффективным правлением Керенского. Сейчас Россия по-прежнему отстает в промышленном отношении от Западной Европы и США. \n §W -------------- \n $MODIFIER_POLITICAL_POWER_FACTOR$ : [?ROOT.RUS_backward_industry_political_power_gain|=%+0] \n $MODIFIER_PRODUCTION_FACTORY_EFFICIENCY_GAIN_FACTOR$ : [?ROOT.RUS_backward_industry_efficiency_gain|=%+0] \n $MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY$ : [?ROOT.RUS_backward_industry_max_efficiency|=%+0] \n $MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$ : [?ROOT.RUS_backward_industry_industrial_capacity|=%+0] \n $MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$ : [?ROOT.RUS_backward_industry_production_speed_buildings|=%+0] \n $MODIFIER_RESEARCH_SPEED_FACTOR$ : [?ROOT.RUS_backward_industry_research_speed|=%+0] \n £civ_factory Ежемесячный темп индустриализации: [?ROOT.RUS_backward_industry_industrialisation_rate|=%+2]"
rus_industrialised_nation_desc:0 "Благодаря усилиям нашего правительства наша страна промышленно развита и процветает. \n §W -------------- \n $MODIFIER_POLITICAL_POWER_FACTOR$ : [?ROOT.RUS_backward_industry_political_power_gain|=%+0] \n $MODIFIER_PRODUCTION_FACTORY_EFFICIENCY_GAIN_FACTOR$ : [?ROOT.RUS_backward_industry_efficiency_gain|=%+0] \n $MODIFIER_PRODUCTION_FACTORY_MAX_EFFICIENCY$ : [?ROOT.RUS_backward_industry_max_efficiency|=%+0] \n $MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$ : [?ROOT.RUS_backward_industry_industrial_capacity|=%+0] \n $MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$ : [?ROOT.RUS_backward_industry_production_speed_buildings|=%+0] \n $MODIFIER_RESEARCH_SPEED_FACTOR$ : [?ROOT.RUS_backward_industry_research_speed|=%+0] \n £civ_factory Ежемесячный темп индустриализации: [?ROOT.RUS_backward_industry_industrialisation_rate|=%+2]"

