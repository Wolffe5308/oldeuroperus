vilayet_stability_dynamic_modifier:0 "Стабильность королевства \n §W -------------- §! \n §g От пустынь Сирии до гор Курдистана и холмов Кипра Османская империя осуществляет контроль над своими гражданами. Однако этим гражданам не всегда нравится, когда ими управляет Константинийе, и чаще всего это наносит ущерб общей стабильности королевства. \n \n Чем выше местная нестабильность в наших вилайетах (представленная £resistance_texticon §Y Unrest §! ), тем больше наказание для нашей страны. Следующие значения рассчитываются для каждого штата и добавляются к общей сумме по всей империи: \n \n §G Низкий §! : £stability_texticon §R -1% §! \n §Y Средний §! : £stability_texticon §R -2,5% §! \n §R Высокий §! : £stability_texticon §R -5% §! §! \n \n Динамически обновляется"
OTT_Centralise_tt_desc:0 "Отменив часть местной власти вилайета, власть будет передана Османскому парламенту в Константинийе. Посредством политики поселений, усиления местных гарнизонов, разоружения бедуинов и расширения государственной инфраструктуры в офисе в столице были разработаны амбициозные планы, которые, как мы надеемся, так же легко выполнить, как и написать... \n \n [THIS.OTT_CENTRALISE_complete_check] Все следующее должно быть правдой: \n [THIS.OTT_CENTRALISE_pp_check] Больше политической власти, чем §Y 10 §! \n [THIS.OTT_CENTRALISE_party_check] Должно быть верно одно из следующих: \n Нынешняя правящая партия §Y Автократ по отцовской линии §! \n Текущая правящая партия — §Y Авторитарный демократ §! \n Текущая правящая партия — централистская §Y Рыночная либеральная партия §! \n [THIS.OTT_CENTRALISE_integration_factor_total_check] Должно быть верно одно из следующих условий: \n [THIS.OTT_CENTRALISE_integration_factor1_check] Должно быть верно все следующее: \n — §C Автономный регион §! \n [THIS.OTT_CENTRALISE_vilayet_category] > §G 50% §! \n [THIS.OTT_CENTRALISE_integration_factor2_check] Все следующее должно быть правдой: \n - это §C Вилайет §! \n [THIS.OTT_CENTRALISE_vilayet_category] = §G 100% §! \n \n §Y Эффект §! : \n £ Political_power_texticon Политическая власть: §R -10 §! \n §Y [THIS.GetName] §! £resistance_texticon §Y Риск восстания §! §R увеличится §! \n §Y [THIS.GetName] §! £national_unity_texticon §Y Османская власть §! увеличит §G §!"
OTT_Decentralise_tt_desc:0 "Чтобы лучше учитывать местные потребности и сохранить уникальный культурный характер Империи, власть необходимо передать от центральной власти в Константинии местным властям. Это затруднит проведение в жизнь общенациональной политики или реагирование на местные угрозы со стороны Османского государства, но эта политика пользуется поддержкой на местах и ​​ослабит давление на некоторые из наших наиболее нестабильных регионов. \n \n §Y Эффект §! : \n §Y [THIS.GetName] §! £resistance_texticon §Y Риск восстания §! §G уменьшится §! \n §Y [THIS.GetName] §! £national_unity_texticon §Y Османская власть §! уменьшится §R §!"
ott_centralisation_army:0 "$ott_centralisation_add_tooltip$ \n $MODIFIER_POLITICAL_POWER_FACTOR$ : §G +1% §! \n $STAT_ARMY_DEFAULT_MORALE$ §G +1% §! \n $MODIFIER_ARMY_ORG$ : §G +1% §! \n $MODIFIER_ARMY_BONUS_AIR_SUPERIORITY$ : §G +1% §! \n $modifier_production_speed_arms_factory_factor$ : §G +1% §! \n \n"
