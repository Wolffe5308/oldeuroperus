l_russian:

  armored_knight:0 "Тяжёлые рыцари"
  knights_unit:0 "Тяжёлые рыцари I"
  knights_unit_desc:0 "Ополчение в доспехах вместе с закованными в латы рыцарями может стать сокрушительной силой на поле боя."
  knights_unit2:0 "Тяжёлые рыцари II"
  knights_unit2_desc:0 "Более тяжёлые доспехи и улучшенная тактика делают рыцарей ещё более грозной силой на поле боя."
  knights_unit3:0 "Тяжёлые рыцари III"
  knights_unit3_desc:0 "Элитные рыцари при поддержке ветеранов-ополченцев образуют несокрушимую стену из стали и доблести."
  knights_unit4:0 "Тяжёлые рыцари IV"
  knights_unit4_desc:0 "Отборные рыцари в лучших доспехах и верные оруженосцы — кавалерия, которой нет равных ни в мощи, ни в доблести."

  cavalry_transport_bonus1:0 "Усовершенствование повозок I"
  cavalry_transport_bonus1_desc:0 "Базовые улучшения повозок снижают нагрузку на кавалерийские части, обеспечивая более быструю и надёжную транспортировку припасов и снаряжения."
  cavalry_transport_bonus2:0 "Усовершенствование повозок II"
  cavalry_transport_bonus2_desc:0 "Усиленные рамы повозок и улучшенная конструкция осей повышают грузоподъёмность и проходимость по пересечённой местности, увеличивая дальность передвижения кавалерии."
  cavalry_transport_bonus3:0 "Усовершенствование повозок III"
  cavalry_transport_bonus3_desc:0 "Передовые инженерные решения в конструкции повозок и улучшенные упряжки позволяют быстро перебрасывать кавалерию и припасы на огромные расстояния."

  support_transport_bonus1:0 "Улучшение качества дорог I"
  support_transport_bonus1_desc:0 "Базовые улучшения дорог упрощают снабжение войск, позволяя подразделениям обеспечения доставлять необходимые припасы быстрее и с меньшими потерями."
  support_transport_bonus2:0 "Улучшение качества дорог II"
  support_transport_bonus2_desc:0 "Мощёные дороги и разветвлённая сеть путей повышают скорость и надёжность перевозок, увеличивая эффективность логистики."
  support_transport_bonus3:0 "Улучшение качества дорог III"
  support_transport_bonus3_desc:0 "Качественные и прочные дороги обеспечивают быстрое и бесперебойное передвижение вспомогательных подразделений на огромные расстояния, значительно расширяя возможности снабжения."


  ### ARMOR ###

  cavalry_attack_bonus1:0 "Ударная кавалерийская тактика I"
  cavalry_attack_bonus1_desc:0 "Базовые улучшения в кавалерийских атаках и манёврах повышают эффективность в прямых столкновениях."
  cavalry_attack_bonus2:0 "Ударная кавалерийская тактика II"
  cavalry_attack_bonus2_desc:0 "Отработанные методы ведения боя повышают ударную мощь, позволяя кавалерии прорывать слабую вражескую оборону."
  cavalry_attack_bonus3:0 "Ударная кавалерийская тактика III"
  cavalry_attack_bonus3_desc:0 "Передовые стратегии координации и построения предоставляют кавалерии больший наступательный потенциал."
  cavalry_attack_bonus4:0 "Ударная кавалерийская тактика IV"
  cavalry_attack_bonus4_desc:0 "Мастерские манёвры превращают кавалерийские атаки в сокрушительный удар даже по укреплённому и организованному врагу."
  cavalry_attack_bonus5:0 "Ударная кавалерийская тактика V"
  cavalry_attack_bonus5_desc:0 "Вершина кавалерийского искусства: почти неудержимая ударная мощь и сокрушительное превосходство на поле боя."

  cavalry_defense_bonus1:0 "Повышение живучести кавалерии I"
  cavalry_defense_bonus1_desc:0 "Базовые оборонительные тактики и правильное построение снижают уязвимость кавалерии в бою."
  cavalry_defense_bonus2:0 "Повышение живучести кавалерии II"
  cavalry_defense_bonus2_desc:0 "Улучшенная дисциплина и грамотное использование местности повышают устойчивость к вражеским контратакам."
  cavalry_defense_bonus3:0 "Повышение живучести кавалерии III"
  cavalry_defense_bonus3_desc:0 "Продвинутые оборонительные построения укрепляют выносливость кавалерии в бою против пехоты."
  cavalry_defense_bonus4:0 "Повышение живучести кавалерии IV"
  cavalry_defense_bonus4_desc:0 "Усовершенствованные доспехи и скоординированная тактика отхода снижают потери под давлением противника."
  cavalry_defense_bonus5:0 "Повышение живучести кавалерии V"
  cavalry_defense_bonus5_desc:0 "Вершина кавалерийской обороны — конница способна выдержать даже самые яростные атаки."

  cavalry_speed_bonus1:0 "Повышение мобильности конницы I"
  cavalry_speed_bonus1_desc:0 "Базовая подготовка и облегчённое снаряжение повышают скорость кавалерии для быстрых манёвров."
  cavalry_speed_bonus2:0 "Повышение мобильности конницы II"
  cavalry_speed_bonus2_desc:0 "Улучшенная подготовка и совершенствование ухода за лошадьми повышают мобильность в бою."
  cavalry_speed_bonus3:0 "Повышение мобильности конницы III"
  cavalry_speed_bonus3_desc:0 "Передовые методы подготовки повышают скорость и манёвренность в долгих походах."
  cavalry_speed_bonus4:0 "Повышение мобильности конницы IV"
  cavalry_speed_bonus4_desc:0 "Современное снаряжение и тактическое мастерство обеспечивают быстрое перемещение по полю боя."
  cavalry_speed_bonus5:0 "Повышение мобильности конницы V"
  cavalry_speed_bonus5_desc:0 "Предел развития скорости кавалерии: непревзойдённая манёвренность и способность к молниеносным ударам."


  ### INDUSTRIAL DEVELOPMENT ###

  industrial_development:0 "Early Industrial Organization"
  industrial_development_desc:0 "The first steps toward organized production, laying foundations for efficiency, coordination, and structured labor."
  coal_development:0 "Coal and Charcoal Utilization"
  coal_development_desc:0 "Understanding and exploiting coal-based fuels allows for stronger metallurgy and more reliable energy sources."
  charcoal_burner_development1:0 "Primitive Charcoal Burning"
  charcoal_burner_development1_desc:0 "Basic open-pit charcoal burning methods provide limited but essential fuel for early industry."
  charcoal_burner_development2:0 "Organized Charcoal Yards"
  charcoal_burner_development2_desc:0 "Designated charcoal production areas improve consistency and reduce material waste."
  charcoal_burner_development3:0 "Standardized Charcoal Practices"
  charcoal_burner_development3_desc:0 "Refined techniques and shared knowledge enhance output and fuel quality."
  charcoal_burner_development4:0 "Mastered Charcoal Production"
  charcoal_burner_development4_desc:0 "Experienced burners achieve high efficiency, ensuring a stable charcoal supply for industry.
  charcoal_kiln_development1:0 "Basic Charcoal Kilns"
  charcoal_kiln_development1_desc:0 "Simple kiln structures allow for more controlled charcoal production than open burning."
  charcoal_kiln_development2:0 "Improved Kiln Construction"
  charcoal_kiln_development2_desc:0 "Stronger kiln designs increase yield and reduce fuel loss during processing."
  charcoal_kiln_development3:0 "Advanced Kiln Techniques"
  charcoal_kiln_development3_desc:0 "Enhanced airflow control and insulation improve charcoal purity and efficiency."
  charcoal_kiln_development4:0 "Integrated Kiln Networks"
  charcoal_kiln_development4_desc:0 "Large-scale kiln coordination supports sustained industrial and metallurgical growth."
  rural_development1:0 "Subsistence Farming"
  rural_development1_desc:0 "Basic agricultural expansion sustains growing populations and stabilizes local food supplies."
  rural_development2:0 "Organized Rural Settlements"
  rural_development2_desc:0 "Planned land use and communal farming improve productivity and reliability."
  rural_development3:0 "Improved Agricultural Methods"
  rural_development3_desc:0 "Crop rotation and better tools increase yields across rural regions."
  rural_development4:0 "Surplus-Oriented Agriculture"
  rural_development4_desc:0 "Farming evolves beyond survival, supporting trade and urban growth."
  rural_development5:0 "Rural Economic Backbone"
  rural_development5_desc:0 "A mature rural economy becomes the foundation of long-term industrial and population expansion."
