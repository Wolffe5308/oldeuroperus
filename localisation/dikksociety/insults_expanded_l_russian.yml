 INSULT_EXPANDED_POPUP_SENDER_DESC: "Вы хотите отправить следующее письмо §Y[?selected_country_to_insult.GetNameWithFlag]§!? \n\n§YЭто повлечет за собой следующие последствия.:§! [This.GetSendInsultStabilityEffect]\nДаёт базовую поддержку войны: §R-2.00%§!. [This.GetInsultTensionEffect]\n\n(§Y§Y[?selected_country_to_insult.GetNameWithFlag]§!§!): [This.GetReceiveInsultStabilityEffect]\nOpinion of [This.GetFlag] §Y[This.GetName]§! §R-50§!. \nВ течении §Y30 дней§!: \nЕженедельная поддержка войны: §G+1.00%§! \nВремя на оправдания цели войны: §G-10.0%§! \nНапряжение для оправдания цели войны: §Y-5.0%§! \nВ течении §Y180 дней§!: \nАтака против [This.GetName]: §G+10.0%§!"
