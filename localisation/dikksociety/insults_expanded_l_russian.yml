 INSULT_EXPANDED_POPUP_RECEIVER_ENTRY: "§H[This.GetReceivedInsultEntry]§!"
 INSULT_EXPANDED_POPUP_RECEIVER_CUSTOM_ENTRY: "§H[This.GetInsultTypedReceivedText]§!"
 INSULT_EXPANDED_POPUP_RECEIVER_DESC: "§YНастоящее письмо имеет следующие последствия:§! [This.GetReceiveInsultStabilityEffect]\nМнение §Y[This.GetNameWithFlag]§! §R-50§!. \nПолучает следующие бонусы за §Y30 дней§!: \nЕженедельная поддержка войны: §G+1.00%§! \nВремя на оправдания цели войны: §G-10.0%§! \nУровень напряженности для оправдания цели войны: §Y-5.0%§! \nВ течении §Y180 дней§!: \nАтака против [This.GetName]: §G+10.0%§! \n\n(§Y[This.GetNameWithFlag]§!): [This.GetSendInsultStabilityEffect]\nДает базовую поддержку войны: §R-2.00%§!. [This.GetInsultTensionEffect]"
 
