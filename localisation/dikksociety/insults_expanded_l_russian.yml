 WRITE_INSULT_BUTTON_TT_DELAYED: "§RМаксимально допустимое количество символов — 1000.§!\n§HРазрешены только буквы от А до Я, цифры и несколько специальных символов.§! \nВы можете вводить буквы обычным способом и удалять последний символ нажатием клавиши Enter. £DEL£. \n\nМожно использовать следующие специальные символы; горячие клавиши для их ввода указаны в скобках после них: \n§YМинус§! (§G-§!) \n§YПробел§! (§Gпробел§!) \n§YЗапятая§! (§G,§!) \n§YВопросительный знак§! (§GCtrl + Q§!) \n§YАпостроф§! (§GShift + ^§!) \n§YТочка§! (§G.§!) \n§YКавычка§! (§GShift + 2§!) \n§YВосклицательный знак§! (§GShift + 1§!) \n§YОткрытая скобка§! (§GShift + 8§!) \n§YЗакрытая скобка§! (§GShift + 9§!)"
 
