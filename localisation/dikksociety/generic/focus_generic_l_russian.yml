  generic_52_desc:0 "Вопрос религии один из важнейших в государстве."
  generic_53_desc:0 ""
  generic_54_desc:0 ""
  generic_55_desc:0 ""
  generic_56_desc:0 "Католичество - по праву зовется основной частью Христианства!"
  generic_57_desc:0 "Геополитически, принятие Православие более выгодно, нежели иные ветви."
  generic_58_desc:0 "Ветвь Христианства, которая наиболее распрастранена на кавказе, а также во многих регионах Эфиопии."
  generic_59_desc:0 "Вернуться к славянским истокам, тобы показать всему миру, что мы уважаем наших предков!"
  generic_60_desc:0 ""
  generic_61_desc:0 "Несмотря на схожесть с другими видами язычества, балтийское все же имеет свои отличия и выделилось в отдельную религию!"
  generic_62_desc:0 "Только вера в предков и бесстаришие в бою, способно привести к победе."
  generic_63_desc:0 "Ислам — самая молодая и вторая по численности приверженцев, после христианства, мировая монотеистическая авраамическая религия."
  generic_64_desc:0 "Синтоизм часто рассматривается как часть буддизма, однако само по себе существование доказывает, что религия успела обособиться."
  generic_65_desc:0 "Буддизм - одна из древнейших религий в азиатском регионе."
  generic_66_desc:0 "Индуизм - одна из древнейших и разнообразных религий мира."
  generic_67_desc:0 "Филосовское учение Конфуция является наиболее разумным вариантом замены религии."
  generic_68_desc:0 "Бог неба Тенгри - вот истенный миротворец!"
