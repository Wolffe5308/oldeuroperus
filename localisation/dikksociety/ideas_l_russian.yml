 traditions_technological:0 "Технологические традиции"
 idea_tradition_1:0 "Глубоко старомодный"
 idea_tradition_1_desc:0 "Жестко скованная обычаями прошлого, нововведение рассматривается как опасная ересь."
 idea_tradition_2:0 "Консервативный образ мышления"
 idea_tradition_2_desc:0 "Новые идеи принимаются лишь с неохотой, что замедляет темпы обучения."
 idea_tradition_3:0 "Осторожные мыслители"
 idea_tradition_3_desc:0 "Хотя традиции по-прежнему доминируют, некоторая доля любопытства допустима."
 idea_tradition_4:0 "Практические учёные"
 idea_tradition_4_desc:0 "Практические усовершенствования допускаются, хотя и под пристальным вниманием традиций."
 idea_tradition_5:0 "Сбалансированный прогноз"
 idea_tradition_5_desc:0 "Традиции и новаторство сосуществуют в хрупком равновесии."
 idea_tradition_6:0 "Прогрессивная мысль"
 idea_tradition_6_desc:0 "Умы ученых и правителей все чаще склоняются к прогрессу и реформам."
 idea_tradition_7:0 "Инновационный дух"
 idea_tradition_7_desc:0 "Культура экспериментирования и реформ способствует новым открытиям."
 idea_tradition_8:0 "Золотой век науки"
 idea_tradition_8_desc:0 "Традиции уступают место блеску и новаторству, возвещая эпоху знаний и мудрости."

 traditions_coal_improvement:0 "Традиции обработки древесного угля"
 idea_charcoal_production_1:0 "Примитивное сжигание древесного угля"
 idea_charcoal_production_1_desc:0 "Древесный уголь производится в примитивных лесных ямах практически без контроля, что приводит к крайней неэффективности и расточительству."
 idea_charcoal_production_2:0 "Неорганизованные дровяные печи"
 idea_charcoal_production_2_desc:0 "Независимые горелки работают без координации или стандартизированных методов, что ограничивает производственную мощность."
 idea_charcoal_production_3:0 "Местные традиции использования древесного угля"
 idea_charcoal_production_3_desc:0 "Базовые региональные знания несколько улучшают производство, хотя методы остаются непоследовательными."
 idea_charcoal_production_4:0 "Сезонное производство древесного угля"
 idea_charcoal_production_4_desc:0 "Сжигание древесного угля подчиняется сезонным циклам, что позволяет незначительно повысить производительность."
 idea_charcoal_production_5:0 "Создание угольных заводов"
 idea_charcoal_production_5_desc:0 "Постоянные производственные площадки и опытные рабочие обеспечивают стабильное производство древесного угля."
 idea_charcoal_production_6:0 "Стандартизированные методы обжига в печах"
 idea_charcoal_production_6_desc:0 "Использование общепринятых технологий и усовершенствованных конструкций печей позволяет вывести производство древесного угля на надежный базовый уровень."
 idea_charcoal_production_7:0 "Изготовление древесного угля под контролем гильдии"
 idea_charcoal_production_7_desc:0 "Ремесленные гильдии регулируют производство, повышая эффективность и контролируя качество."
 idea_charcoal_production_8:0 "Усовершенствованная конструкция печи"
 idea_charcoal_production_8_desc:0 "Усовершенствованные конструкции печей и квалифицированный контроль значительно увеличивают выход древесного угля."
 idea_charcoal_production_9:0 "Интегрированная угольная промышленность"
 idea_charcoal_production_9_desc:0 "Производство древесного угля тесно связано с кузницами и литейными цехами, что позволяет максимально повысить эффективность."
 idea_charcoal_production_10:0 "Мастерство в угольной промышленности"
 idea_charcoal_production_10_desc:0 "Высокоэффективные производственные сети обеспечивают поставку огромных объемов древесного угля для нужд промышленности и военного времени."

 traditions_banking:0 "Банковские и инвестиционные традиции"
 idea_banking_1:0 "Бартерная экономика"
 idea_banking_1_desc:0 "Торговля в значительной степени основана на бартере и неформальном обмене, при этом финансовые системы не пользуются большим доверием."
 idea_banking_2:0 "Местные ростовщики"
 idea_banking_2_desc:0 "Мелкие кредитные организации предоставляют кредиты с высоким риском, что ограничивает общий экономический рост."
 idea_banking_3:0 "Торговые кредитные сети"
 idea_banking_3_desc:0 "Торговцы предоставляют друг другу кредиты, устанавливая ранние финансовые связи между регионами."
 idea_banking_4:0 "Ранние банковские учреждения"
 idea_banking_4_desc:0 "Возникают примитивные банковские учреждения, предлагающие услуги хранения ценностей и простые кредиты."
 idea_banking_5:0 "Признанные финансовые практики"
 idea_banking_5_desc:0 "Стандартизированные методы кредитования и бухгалтерского учета повышают доверие и способствуют экономической координации."
 idea_banking_6:0 "Расширение кредитных систем"
 idea_banking_6_desc:0 "Увеличение объёмов капитала позволяет расширить кредитование, поддерживая торговлю и ранние отрасли промышленности."
 idea_banking_7:0 "Инвестиционные партнерства"
 idea_banking_7_desc:0 "Совместные предприятия и инвестиции с разделением рисков позволяют создавать амбициозные коммерческие предприятия."
 idea_banking_8:0 "Государственное финансирование"
 idea_banking_8_desc:0 "Правительства поддерживают и регулируют банковскую деятельность, стабилизируют рынки и обеспечивают крупномасштабное финансирование."
 idea_banking_9:0 "Сложные финансовые рынки"
 idea_banking_9_desc:0 "Сложные инструменты и организованные рынки способствуют быстрому перемещению капитала и инвестициям."
 idea_banking_10:0 "Финансовая гегемония"
 idea_banking_10_desc:0 "Высокоразвитая финансовая система доминирует в торговле и инвестициях, подпитывая беспрецедентную экономическую мощь."

 traditions_administrative_efficiency:0 "Эффективность управления"
 idea_administration_1:0 "Раздробленное управление"
 idea_administration_1_desc:0 "Государство держится на местных владыках и нерегулярном сборе налогов. Поддерживать экономику — дорого и неэффективно."
 idea_administration_2:0 "Базовые налоговые учреждения"
 idea_administration_2_desc:0 "Местные налоговые службы начинают упорядочивать налогообложение и сокращать ненужные расходы."
 idea_administration_3:0 "Областные архивариусы"
 idea_administration_3_desc:0 "Чиновники ведут более точные записи о землях, населении и доходах, что улучшает управление государством."
 idea_administration_4:0 "Организованная бюрократия"
 idea_administration_4_desc:0 "Растущий бюрократический аппарат упорядочивает управление и снижает расходы на содержание государства."
 idea_administration_5:0 "Королевская казна"
 idea_administration_5_desc:0 "Централизованный контроль над налогами и расходами укрепляет финансовую дисциплину во всём королевстве."
 idea_administration_6:0 "Областные управленцы"
 idea_administration_6_desc:0 "Надёжные чиновники снижают уровень коррупции и повышают эффективность местного управления."
 idea_administration_7:0 "Единая система управления"
 idea_administration_7_desc:0 "Единые процедуры и обученные чиновники позволяют правительству управлять растущим государством более эффективно."
 idea_administration_8:0 "Квалифицированная бюрократия"
 idea_administration_8_desc:0 "Опытные администраторы с завидной компетентностью управляют налогами, логистикой и государственными финансами."
 idea_administration_9:0 "Централизованное управление"
 idea_administration_9_desc:0 "Большинство административных функций координируются с центральным правительством, что сводит к минимуму потери и усиливает контроль."
 idea_administration_10:0 "Имперская канцелярия"
 idea_administration_10_desc:0 "Разветвлённый административный аппарат позволяет даже огромной империи править эффективно, не допуская неконтролируемого роста расходов."
 idea_administration_11:0 "Управленческое мастерство"
 idea_administration_11_desc:0 "Наше государство обладает одной из лучших бюрократических систем в мире, что позволяет достичь максимальной эффективности управления и снизить экономическую нагрузку на содержание великой державы."
