l_russian:
  
  ### DEMOCRATIC ###
	traditional_lawism:0 "Традиционный законизм"
  traditional_lawism_desc:0 "Вера в то, что управление должно следовать давним традициям и неписаным законам, а не королевским указам."
	peasant_justice:0 "Крестьянское правосудие"
  peasant_justice_desc:0 "Пропаганда справедливого обращения с простыми людьми и права на местное самоуправление в деревнях"
	guild_solidarism:0 "Гильдейский Солидаризм"
  guild_solidarism_desc:0 "Идея о том, что экономическая и политическая власть должна быть разделена между рабочими гильдиями и торговцами."
	clerical_humanism:0 "Клерикальный гуманизм"
  clerical_humanism_desc:0 "Вера в то, что церковь должна способствовать справедливости, образованию и ограниченному управлению, а не абсолютной монархии."
	chivalric_republicanism:0 "Рыцарский республиканизм"
  chivalric_republicanism_desc:0 "Философия, согласно которой рыцари и дворяне должны поддерживать верховенство закона и справедливость, сопротивляясь тирании."
	landholder_consensus:0 "Консенсус землевладельцев"
  landholder_consensus_desc:0 "Вера в то, что землевладельцы, как знатные, так и простые, должны иметь право голоса в управлении, выступая за создание консультативных советов и права на землю."
	noble_liberalism:0 "Благородный либерализм"
  noble_liberalism_desc:0 "Мнение о том, что дворянство должно выступать защитником свобод, балансируя монархию с правами своих подданных."
	moral_contractualism:0 "Моральный контрактализм"
  moral_contractualism_desc:0 "Идея о том, что правители и подданные связаны моральными договорами, согласно которым справедливому правителю необходимо следовать, но тирану можно противостоять."

  ### COMMUNISM ###
	decentralized_tribalism:0 "Децентрализованный трайбализм"
  decentralized_tribalism_desc:0 "Независимые, но готовые к сотрудничеству племена делят ресурсы и управление без центрального правителя. Каждая группа сохраняет автономию, но занимается взаимопомощью и торговлей."
	nomadic_collectivism:0 "Кочевой коллективизм"
  nomadic_collectivism_desc:0 "Общество, в котором все ресурсы и товары распределяются между постоянно перемещающимися группами, обеспечивая выживание посредством коллективной собственности. Лидерство носит неформальный характер и основано на консенсусе, а не на иерархии."
	tribal_egalitarianism:0 "Племенной эгалитаризм"
  tribal_egalitarianism_desc:0 "Децентрализованная система, в которой все члены племени имеют равное право голоса, без постоянных правителей, а богатство распределяется поровну. Социальный статус основан на вкладе, а не на праве первородства."
	mobile_syndicalism:0 "Мобильный синдикализм"
  mobile_syndicalism_desc:0 "Рабочие союзы или гильдии коллективно контролируют ресурсы и принимают решения, даже в условиях кочевья. Труд организуется посредством кооперативных соглашений, а не через центральную власть."
	anarcho_nomadism:0 "Анархо-кочевничество"
  anarcho_nomadism_desc:0 "Полностью безгосударственное, высокомобильное общество, отвергающее все формы власти и структурированного управления. Законы и правила возникают в результате добровольных соглашений, а не принуждения."

  ### FASCISM ###
	totalistic_sovereignty:0 "Тоталистический суверенитет"
  totalistic_sovereignty_desc:0 "Система, в которой неоспоримый правитель обладает полной властью над государством, обеспечивая строгий контроль, национальное единство и непоколебимый иерархический порядок для поддержания доминирования."
	theocratic_supremacy:0 "Теократическое превосходство"
  theocratic_supremacy_desc:0 "Управление осуществляется духовенством, при этом религиозная власть является основным источником политической власти."
	divine_rule:0 "Божественное Правило"
  divine_rule_desc:0 "Вера в то, что власть правителя дарована божественной волей и что он неприкосновенен для смертных законов."
	stratocratic_nationalism:0 "Стратократический национализм"
  stratocratic_nationalism_desc:0 "Общество, возглавляемое военными, сосредоточило внимание на национальной силе, а государство отдавало приоритет военной добродетели и дисциплине."
	ultranationalism:0 "Ультранационализм"
  ultranationalism_desc:0 "Чрезвычайная лояльность к нации с упором на национальную идентичность и превосходство, часто приводящая к территориальной экспансии."
	imperialism:0 "Империализм"
  imperialism_desc:0 "Желание расширяться и завоевывать другие земли во имя нации, стремясь создать огромную империю под властью единого могущественного правителя."

  ### NEUTRALITY ###
	feudal_neutralism:0 "Феодальный нейтрализм"
	feudal_neutralism_desc:0 "Позиция, при которой феодальное общество остается нейтральным, сосредотачиваясь на внутреннем управлении и избегая участия во внешних конфликтах."
	agrarian_independence:0 "Аграрная независимость"
	agrarian_independence_desc:0 "Вера в самодостаточность, когда сельскохозяйственные общества отдают приоритет внутреннему производству и независимости, избегая иностранного влияния и конфликтов."
	traditional_moderation:0 "Традиционная модерация"
	traditional_moderation_desc:0 "Философия, которая способствует балансу и умеренности в управлении, стремясь избежать радикальных идеологий и внешнего вмешательства."
	peaceful_isolationism:0 "Мирный изоляционизм"
	peaceful_isolationism_desc:0 "Политика невмешательства во внешние дела, сосредоточения внимания исключительно на внутреннем мире, развитии и избежании международных затруднений."
	neutral_mercantilism:0 "Нейтральный меркантилизм"
	neutral_mercantilism_desc:0 "Торговый подход, при котором государство поддерживает нейтральные торговые отношения со всеми странами, избегая политических или военных конфликтов, обеспечивая при этом экономическое процветание."
	monarchical_oligarchy:0 "Монархическая олигархия"
	monarchical_oligarchy_desc:0 "Система, в которой власть принадлежит монарху вместе с элитной правящей группой, с упором на внутренний контроль и баланс, избегая при этом внешних конфликтов."
