 unit_limit_label:0 "§HМаксимально поддерживаемое количество дивизий§!\nДивизий: [?max_divisions|H0]\n\nБазовое значение: [?base_units|G1]\n   - Из национального населения: [?core_base|G1][unit_limit_noncore_population][unit_limit_subject_population_bonus]\n   - Из собственных регионов: [?num_owned_states|G0][unit_limit_subject_state_bonus]\n\nМножитель количества фабрик: [?industry_factor_uncapped|H%][unit_limit_modifier_was_capped][unit_limit_modified_by][unit_limit_faction_leader][unit_limit_economy_law]\n\nDefault: [?global.base_unit_limit_bonus|G=0][unit_limit_bonus_used]"
 unit_limit_desc:0 "Каждая страна способна содержать лишь определённое количество отдельных дивизий, после чего её экономика и инфраструктура испытывают трудности с их содержанием.\n\nМаксимальное количество поддерживаемых подразделений определяется в зависимости от страны. §Hнаселение§! и §Hколичество принадлежащих регионов§!, а затем умножается на отношение этого значения к §Hколичество заводов§! в регионе.\n\nВо время §Hгражданской войны§!, базовые значения рассчитываются как сумма всех состояний, принадлежащих всем участникам.[above_unit_limit_desc]"
 civil_war_bonus:0 "Бонус от гражданской войны : §G%100§!"

 unit_limit_desc_fake_intel:0 "(§HFake Intel Divisions§! не учитываются в лимите дивизий)"

 unit_limit_desc_above_limit:0 "\n\n--------------\n\n§RВ настоящее время мы превысили свои возможности, И единственный способ ослабить напряжение в нашей стране — это устранить некоторые из наших разногласий.§!\n\n$MODIFIER_ARMY_ORG_FACTOR$: [?mobilisation_penalty_var|+=%1]\n$MODIFIER_CONSUMER_GOODS_FACTOR$: [?mobilisation_penalty_var_positive|=%H1]\n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: [?mobilisation_penalty_var|+=%]\n$MODIFIER_TRAINING_TIME_ARMY_FACTOR$: [?mobilisation_penalty_var_positive|-=%]\n$MODIFIER_LAND_REINFORCE_RATE$: [?mobilisation_penalty_var|+=%1]"

 unit_limit_noncore_population_desc:0 "\n   - Из не национального населения: [?non_core_base|G1]"
 unit_limit_subject_population_bonus_desc:0 "\n   - Из §Hсубъект§! населения: [?subject_base_units|G1]"
 unit_limit_subject_state_bonus_desc:0 "\n   - Из §Hсубъект§! регионов: [?subject_states|G0]"
 unit_limit_modifier_was_capped_desc:0 "\n(Ограничено минимальным значением [?0.5|H%])"
 unit_limit_modified_by_desc:0 "\n\nДополнительно изменено:"
 unit_limit_faction_leader_desc:0 "\n   - Лидер фракции: §G+15%§!"
 unit_limit_bonus_used_desc:0 "\nНациональный дух: [?modifier@unit_limit_bonus|=+0]"
 unit_limit_has_war_desc:0 "\n   - В войне: §G+20%§!"
 unit_limit_fascism_desc:0 "\n   - Фашизм: §G+10%§!"
 unit_limit_communism_desc:0 "\n   - Коммунизм: §G+10%§!"
 unit_limit_neutrality_desc:0 "\n   - Нейтралитет: §G+5%§!"
 unit_limit_was_capped_desc:0 "\n\n   - Неограниченная сумма: [?net_max_divisions|H0]"
 unit_limit_num_states_used_desc:0 "\n\n   Поскольку общий объем предоставленных средств был меньше, чем количество принадлежащих регионов. ([?num_owned_states|H0]), вместо этого было использовано."
 unit_limit_default_used_desc:0 "\n\n   Поскольку общая сумма была меньше, чем по умолчанию (§H5§!), вместо этого было использовано."

