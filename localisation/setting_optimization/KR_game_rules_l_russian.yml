l_russian:

 RULE_UNIT_LIMIT_OPTIONS:0 "Пределы дивизиона"
 RULE_OPTION_STANDARD:0 "Применяется ко всем"
 RULE_UNIT_LIMIT_OPTIONS_STANDARD_DESC:0 "Были применены ограничения на количество подразделений, которые ИИ может построить, в зависимости от количества заводов и уровня экономического закона. Как только ИИ достигнет этого предела, они просто перестанут строить новые дивизии. Этот лимит также распространяется на игрока, хотя для него это мягкий предел, и он получает штраф в зависимости от того, насколько далеко он превысил лимит. \n \n §R Обратите внимание, что эта система создана для уменьшения неизбежного замедления, которое происходит по ходу игры, поскольку огромное количество действующих дивизий является основной причиной задержки системы. §!"
 RULE_UNIT_LIMIT_OPTIONS_AI_ONLY:0 "Применяется только к ИИ"
 RULE_UNIT_LIMIT_OPTIONS_AI_ONLY_DESC:0 "Были применены ограничения на количество подразделений, которые ИИ может построить, в зависимости от количества заводов и уровня экономического закона. Как только ИИ достигнет этого предела, они просто перестанут строить новые дивизии. В этом случае нет ограничений на количество дивизий, которые игрок может построить, кроме его способности поставлять рабочую силу и оборудование. \n \n §R Обратите внимание, что это даст игроку значительное преимущество перед странами ИИ, которые в противном случае имели бы сопоставимую силу. §!"
 RULE_OPTION_TURN_OFF:0 "Выключать"
 RULE_UNIT_LIMIT_OPTIONS_TURN_OFF_DESC:0 "Это полностью отключает систему ограничения делений. \n \n §R Рекомендуется делать это только в том случае, если вы либо не возражаете против того, чтобы скорость игры значительно снижалась по ходу игры, либо у вас ОЧЕНЬ здоровенный компьютер для запуска игры. §!"

 RULE_DEMOB_OPTIONS:0 "Демобилизация мирного времени"
 RULE_OPTION_DEMOB_EXISTS:0 "По умолчанию"
 RULE_OPTION_DEMOB_EXISTS_DESC:0 "В мирное время игроку будет предложено снизить свою экономику и/или законы о воинской повинности до уровней, разрешенных в мирное время и в соответствии с его военной поддержкой, в течение четырех месяцев. ИИ будет делать то же самое, хотя и быстрее и будет стремиться свести свои законы к более низким уровням, чем требуется от игрока. Если ограничения на юниты применяются к ИИ, это также побудит их сократить количество активных юнитов из соображений производительности."
 RULE_OPTION_DEMOB_AI_ONLY:0 "Применяется только к ИИ"
 RULE_OPTION_DEMOB_AI_ONLY_DESC:0 "В мирное время ИИ уменьшит свою экономику и/или законы о воинской повинности. Если к ИИ применяются ограничения на юниты, это также побудит их сократить количество активных юнитов из соображений производительности. Однако игроку никогда не будет предложено смягчить свои законы."
 RULE_OPTION_DEMOB_OFF:0 "Выключать"
 RULE_OPTION_DEMOB_OFF_DESC:0 "Ни игроку, ни ИИ никогда не будет предложено сократить свою экономику и/или законы о воинской повинности в мирное время. \n \n §R Рекомендуется делать это только в том случае, если вы либо не возражаете против того, чтобы скорость игры значительно снижалась по ходу игры, либо у вас ОЧЕНЬ здоровенный компьютер для запуска игры. §!"
