 unit_limit_desc:0 "каждая страна способна поддерживать лишь определенное количество отдельных дивизий, вследствие чего ее экономика и инфраструктура испытывают трудности с их уменьшением. \n \n Максимальное количество подключенных устройств определяется в зависимости от страны.  §H населения §! и §H количества соблюдения в регионах §! , а затем умножается на отношение этого значения к §H количеству заводов §! в регионах. \n \n Во время §H гражданской войны §! базовые значения рассчитываются как границы всех этапов, касающихся всех участников. [above_unit_limit_desc]"
